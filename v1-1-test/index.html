.chat-inbox{padding:18px 16px!important}

.composer-attach{position:relative}.composer-attach input{position:absolute;opacity:0;width:1px;height:1px}
.reply-preview{display:flex;gap:8px;align-items:center;border-left:3px solid #eab36c;padding:7px;margin:4px 0 8px;background:#ffffff10}
.reply-preview span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.reply-preview button{background:none;color:var(--text);border:0}
.pinned-msg{width:100%;background:#4b3421;color:var(--gold);border:0;text-align:left;padding:9px}
.upload-preview{display:block;max-width:130px;max-height:110px;object-fit:contain;border-radius:12px;margin:8px 0}
.action-list{display:grid;gap:5px;margin:15px 0}.action-list button{background:#483326;color:var(--text);border-radius:11px;padding:12px;display:flex;align-items:center;gap:12px;text-align:left}
.reaction-options{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.reaction-options button{font-size:23px;border:0;background:#513927;border-radius:10px;padding:9px}
.social-profile{padding:18px!important}

.social-buttons{display:flex;gap:7px;margin:20px 0 3px;flex-wrap:wrap}.social-buttons .btn{font-size:12px;padding:9px;flex:1}
.social-tabs{text-align:center;padding:6px 0 13px;border-bottom:1px solid #ffffff33}
.post-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:8px}
.post-tile{width:100%;aspect-ratio:1;display:grid;place-items:center;padding:0;color:var(--text);background:#533b2b;border:0;overflow:hidden}
.post-tile img{width:100%;height:100%;object-fit:cover}.post-add{background:#ffffff10}
.file-tile{display:grid;place-items:center;height:120px;border:2px dashed #ac834a;border-radius:14px;position:relative;cursor:pointer;margin-bottom:14px}
.file-tile input{opacity:0;position:absolute;width:1px;height:1px}
.post-full-image{display:block;width:100%;max-height:430px;object-fit:contain;border-radius:12px}
.comment-row{padding:7px;border-bottom:1px solid #ffffff21}.notification-row{display:grid;justify-content:initial;text-align:left;color:var(--text)}

document.body.addEventListener('click',ev=>{
  const x=ev.target.closest('button,[data-person],[data-chat]');
  if(!x)return;
  const n=x.dataset.nav,action=x.dataset.action,who=x.dataset.person;
  const chatId=x.dataset.chat,follow=x.dataset.follow,lang=x.dataset.lang;
  if(n){state.viewed='world';state.chatQuery='';navigate(n);return}
  if(action==='profile'){state.viewed='world';navigate('profile');return}
  if(who){state.viewed=who;closeModal();navigate('profile');return}
  if(follow){
    state.follows[follow]=!state.follows[follow];
    safeSet('follows',state.follows);
    toast(state.follows[follow]?t('unfollow'):t('follow'));render();return;
  }
  if(chatId){closeModal();navigate('chat',chatId);return}
  if(lang){state.lang=lang;safeSet('lang',lang);render();return}
  if(action==='chatBack'){navigate('chat');return}
  if(action==='groupInfo'||action==='editGroup'){
    state.groupModalId=x.dataset.id||state.thread;
    if(!groupById(state.groupModalId))return;
    state.modal=action==='editGroup'?'editgroup':'groupinfo';render();return;
  }
  if(action==='newGroup'){
    state.groupModalId=null;state.modal='newgroup';render();return;
  }
  if(action==='close'){closeModal();return}
  if(action==='toggleBg'){state.bg=!state.bg;safeSet('bg',state.bg);render();return}
  if(action==='notifications'||action==='settings'||action==='editProfile'||action==='newChat'){
    state.modal={notifications:'notifications',settings:'settings',editProfile:'edit',newChat:'newgroup'}[action];
    render();return;
  }
  if(action==='filter'){state.filter=x.dataset.value;render();return}
  if(action==='modPreview'){toast('TEST: modlar bazasi alohida ulanmagan');return}
  if(action==='joinDemo'){toast(t('testing'));return}
});
document.body.addEventListener('submit',ev=>{if(!['profileForm','chatForm','modform','groupForm'].includes(ev.target.id))return;ev.preventDefault();let fd=new FormData(ev.target);
if(ev.target.id==='groupForm'){
  const id=ev.target.dataset.groupId;
  const name=String(fd.get('groupName')||'').trim();
  const username=String(fd.get('groupUsername')||'').trim().replace(/^@/,'').toLowerCase();
  if(!name){toast(t('groupName'));return}
  if(!/^[a-z0-9_]{3,25}$/.test(username)){toast(t('badGroup'));return}
  if(state.groups.some(g=>g.username===username&&g.id!==id)){
    toast(t('uniqueGroup'));return;
  }
  const file=ev.target.querySelector('[name="groupAvatar"]')?.files?.[0];
  if(file&&(file.size>350000||!['image/jpeg','image/png','image/webp'].includes(file.type))){
    toast(t('maxPhoto'));return;
  }
  const members=fd.getAll('members').map(String).filter(member=>people.some(p=>p.id===member));
  const previous=groupById(id);
  const group={id:previous?.id||'group_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7),
    name:name.slice(0,48),username,members,avatar:previous?.avatar||null};
  const save=avatar=>{
    group.avatar=avatar;
    if(previous)state.groups=state.groups.map(g=>g.id===id?group:g);
    else state.groups.push(group);
    safeSet('groups',state.groups);
    closeModal();
    if(previous){render();toast(t('groupSaved'))}
    else {navigate('chat',group.id);toast(t('groupCreated'))}
  };
  if(file){const reader=new FileReader();
    reader.onload=()=>save(String(reader.result));
    reader.onerror=()=>toast(t('maxPhoto'));
    reader.readAsDataURL(file);
  }else save(group.avatar);
  return;
}
if(ev.target.id==='profileForm'){state.name=String(fd.get('name')||'World').trim()||'World';state.bio=String(fd.get('bio')||'').trim();safeSet('name',state.name);safeSet('bio',state.bio);const img=document.getElementById('avatarUpload')?.files?.[0];if(img&&img.size<=900000&&img.type.startsWith('image/')){const reader=new FileReader();reader.onload=()=>{state.avatar=reader.result;safeSet('avatar',state.avatar);closeModal();render();toast(t('save'))};reader.readAsDataURL(img)}else{closeModal();render();toast(t('save'))}return}if(ev.target.id==='chatForm'){if(!state.thread)return;state.messages[state.thread]??=[{mine:false,text:'Salom!'}];state.messages[state.thread].push({mine:true,text:String(fd.get('text')||'').trim()});render();return}if(ev.target.id==='modform'){state.posts.unshift({title:String(fd.get('title')||'Mod'),details:String(fd.get('desc')||''),version:String(fd.get('version')||''),author:'world'});safeSet('posts',state.posts);toast(t('testing'));navigate('profile');return}});

 if(file.size>300000||!['image/png','image/jpeg','image/webp'].includes(file.type)){toast(W('photoLimit'));return}
 const r=new FileReader();r.onload=()=>cb(String(r.result));r.onerror=()=>toast(W('photoLimit'));r.readAsDataURL(file);
}

 else {const g=groupById(id);if(!g)return;if(g.owner===me()){toast(W('ownerOnly')+' — '+W('deleteGroup'));return}

 const msg={id:'m_'+Date.now()+'_'+Math.random().toString(16).slice(2,6),author:me(),text:txt,photo:photo||null,reply:demo.reply,at:Date.now(),reactions:{}};
 setItems(id,[...items(id),msg]);demo.reply=null;delete demo.drafts[me()+'|'+id];store('drafts',demo.drafts);
 const recipients=id==='global'?allPeople().filter(p=>!demo.globalOut.includes(p.id)).map(p=>p.id):g?g.members:id==='saved'?[]:[id];
 recipients.filter(p=>p!==me()).forEach(p=>{const key=p+'|'+currentChatKey(id);demo.meta[key]??={};demo.meta[key].unread=(demo.meta[key].unread||0)+1});saveMeta();

function changeGroup(form,fd){
 const old=groupById(form.dataset.groupId);
 if(old&&old.owner!==me()){toast(W('ownerOnly'));return}
 const name=String(fd.get('name')||'').trim(),visibility=fd.get('visibility')||'public';
 const username=String(fd.get('username')||'').trim().replace(/^@/,'').toLowerCase();
 if(!name){toast(t('groupName'));return}
 if(visibility==='public'&&(!validNick(username)||usedNick(username,old?.id))){toast(validNick(username)?W('taken'):W('wrong'));return}
 const selected=fd.getAll('members').map(String);
 imgReader(form.querySelector('[name="avatar"]')?.files?.[0],picture=>{
 const id=old?.id||'group_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,5);
 const g={id,name,username:visibility==='public'?username:'',visibility,bio:String(fd.get('bio')||'').trim(),owner:old?.owner||me(),avatar:picture||old?.avatar||null,members:old?.members?.filter(x=>x!==me()&&selected.includes(x))||[]};
 g.members=[...new Set([g.owner,...g.members])];
 selected.forEach(target=>{
 if(g.members.includes(target))return;
 if(approveInvites(target)){if(!demo.invites.some(x=>x.groupId===id&&x.to===target))demo.invites.push({id:'req_'+Date.now()+'_'+target,groupId:id,groupName:name,from:me(),to:target});}
 else g.members.push(target);
 });
 if(old)state.groups=state.groups.map(item=>item.id===id?g:item);else state.groups.push(g);
 persistGroups();store('invites',demo.invites);state.modal=null;returnChat(id);
 if(selected.some(target=>approveInvites(target)))toast(W('inviteSent'));
 });
}

 if(a==='invitationAccept'||a==='invitationDecline'){

 if(x.id==='groupUsername'||x.id==='profileUsername'){statusCheck();return}
 if(x.id==='newChatFind'){demo.newChatSearch=x.value;const box=document.getElementById('newChatPeople');if(box){box.innerHTML=allPeople().filter(p=>p.id!==me()&&(!isPrivate(p.id)||items(p.id).length)&&(p.name+' '+p.nick).toLowerCase().includes(x.value.toLowerCase().replace(/^@/,''))).map(p=>'<button class="chat-contact" data-chat="'+F(p.id)+'">'+avatarUI(p)+'<span class="contact-body"><strong>'+F(p.name)+'</strong><small>@'+F(p.nick)+'</small></span></button>').join('')}return}
 if(x.id==='chatFind'){demo.chatSearch=x.value;const box=document.getElementById('chatContacts');if(box)box.innerHTML=chatContacts(x.value);return}
 if(x.id==='inChatSearch'){state.messageSearch=x.value;const cursor=x.selectionStart;render();let field=document.getElementById('inChatSearch');field?.focus();field?.setSelectionRange(cursor,cursor);return}
 if(x.id==='chatText'){demo.drafts[me()+'|'+state.thread]=x.value;store('drafts',demo.drafts)}
},true);
document.body.addEventListener('change',e=>{
 const x=e.target;if(x.name==='visibility'){statusCheck();return}
 if(x.type==='file'&&x.closest('.circle-photo')&&x.files?.[0]){imgReader(x.files[0],src=>{if(!src)return;let box=x.closest('.circle-photo');let old=box.querySelector('.avatar');if(old){let img=document.createElement('img');img.className='avatar large';img.src=src;old.replaceWith(img)}})}
 if(x.id==='attachChat'&&x.files?.[0]){imgReader(x.files[0],src=>{let box=document.getElementById('attachmentPreview');if(box&&src)box.innerHTML='<img class="upload-preview" src="'+F(src)+'" alt="">'});return}
 if(x.name==='image'&&x.closest('#postForm')&&x.files?.[0])imgReader(x.files[0],src=>{let box=document.getElementById('postImagePreview');if(box&&src)box.innerHTML='<img class="upload-preview" src="'+F(src)+'" alt="">'});
},true);
state.groups.forEach(g=>{g.owner??='world';g.members??=[];if(!g.members.includes(g.owner))g.members.unshift(g.owner);g.visibility??='public';if(g.username&&allPeople().some(p=>p.nick.toLowerCase()===g.username.toLowerCase())){g.username='guruh_'+String(g.id).replace(/[^a-z0-9]/gi,'').slice(-8).toLowerCase();g.visibility='private'}});
persistGroups();
const initHash=location.hash.match(/^#(home|chat|profile|community|add)(?:\/([^/]+))?/);
if(initHash){state.section=initHash[1];state.thread=initHash[2]||null}
state.viewed=me();
render();

/* Enhanced test UI starts directly; the legacy init would reset account and page state. */
</script></body></html>

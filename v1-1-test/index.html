function syncUsernameStatus(){
 const group=document.getElementById('groupUsername');
 if(group){const v=group.value.trim().replace(/^@/,'').toLowerCase();const el=document.getElementById('groupUsernameStatus');const busy=nameTaken(v,group.closest('form').dataset.groupId);el.textContent=!v?'':!validNick(v)?t('badGroup'):busy?tt('taken'):tt('available');el.className='username-status '+(validNick(v)&&!busy?'ok':'bad');}
 const acc=document.getElementById('accountUsername');if(acc){const v=acc.value.trim().toLowerCase();const used=v!==state.username&&nameTaken(v);const el=document.getElementById('accountUsernameStatus');el.textContent=!v?'':!validNick(v)?t('badGroup'):used?tt('taken'):tt('available');el.className='username-status '+(validNick(v)&&!used?'ok':'bad')}
 const wrap=document.getElementById('accountUsernameWrap');if(wrap)wrap.style.display=document.querySelector('[name="visibility"]:checked')?.value==='private'?'none':'block';
}
const readAvatar=(file,done)=>{if(!file)return done(null);if(file.size>350000||!['image/png','image/jpeg','image/webp'].includes(file.type)){toast(t('maxPhoto'));return}const rd=new FileReader();rd.onload=()=>done(String(rd.result));rd.onerror=()=>toast(t('maxPhoto'));rd.readAsDataURL(file)};
document.body.addEventListener('click',ev=>{
 const b=ev.target.closest('[data-action]');if(!b)return;
 const a=b.dataset.action;
 if(!['newChat','newGroup','leaveGroup','leaveGlobal','deleteGroup','inviteToggle','acceptInvite','rejectInvite'].includes(a))return;
 ev.preventDefault();ev.stopImmediatePropagation();
 if(a==='newChat'){state.modal='newchat';render()}
 if(a==='newGroup'){state.modal='newgroup';render()}
 if(a==='inviteToggle'){state.approveInvites=!state.approveInvites;safeSet('approve_invites',state.approveInvites);render()}
 if(a==='leaveGlobal'){navigate('chat')}
 if(a==='leaveGroup'){let g=groupById(b.dataset.id);if(!g)return;if(!confirm(tt('leave')+'?'))return;g.joined=false;safeSet('groups',state.groups);closeModal();navigate('chat')}
 if(a==='deleteGroup'){let g=groupById(b.dataset.id);if(!g||(g.owner&&g.owner!=='world'))return;if(!confirm(tt('deleteGroup')+'?'))return;state.groups=state.groups.filter(x=>x.id!==g.id);safeSet('groups',state.groups);closeModal();navigate('chat')}
 if(a==='acceptInvite'||a==='rejectInvite'){let idx=Number(b.dataset.index);let req=state.pendingInvites.splice(idx,1)[0];if(a==='acceptInvite'&&req){let g=groupById(req.id);if(g){g.members=[...new Set([...g.members,'world'])];g.joined=true;safeSet('groups',state.groups)}}safeSet('pending_invites',state.pendingInvites);render()}
},true);
document.body.addEventListener('submit',ev=>{
 const f=ev.target;if(!['groupForm','profileForm','chatForm'].includes(f.id))return;
 ev.preventDefault();ev.stopImmediatePropagation();const fd=new FormData(f);
 if(f.id==='chatForm'){const txt=String(fd.get('text')||'').trim();if(!txt)return;state.messages[state.thread]??=[];state.messages[state.thread].push({mine:true,text:txt,time:new Date().toLocaleTimeString(state.lang,{hour:'2-digit',minute:'2-digit'})});state.lastActivities[state.thread]=Date.now();safeSet('last_activities',state.lastActivities);render();return}
 if(f.id==='profileForm'){
 const visibility=fd.get('visibility')||'public';let username=String(fd.get('username')||state.username).trim().toLowerCase();if(visibility==='public'&&(!validNick(username)||(username!==state.username&&nameTaken(username)))){toast(tt('taken'));return}
 readAvatar(f.querySelector('[name="avatar"]')?.files?.[0],avatar=>{state.name=String(fd.get('name')||'World').trim()||'World';state.bio=String(fd.get('bio')||'').trim();state.visibility=visibility;state.username=username;if(avatar)state.avatar=avatar;['name','bio','visibility','avatar'].forEach(k=>safeSet(k,state[k]));safeSet('account_username',state.username);closeModal();render()});return;
 }
 const id=f.dataset.groupId,old=groupById(id);if(old&&old.owner&&old.owner!=='world'){toast(tt('onlyOwner'));return}
 const name=String(fd.get('groupName')||'').trim(),username=String(fd.get('groupUsername')||'').trim().replace(/^@/,'').toLowerCase();
 if(!name||!validNick(username)||nameTaken(username,id)){toast(!validNick(username)?t('badGroup'):tt('taken'));return}
 const wanted=fd.getAll('members').map(String).filter(id=>people.some(p=>p.id===id));
 readAvatar(f.querySelector('[name="groupAvatar"]')?.files?.[0],avatar=>{
 const group={id:old?.id||'group_'+Date.now().toString(36),owner:'world',name:name.slice(0,48),username,avatar:avatar||old?.avatar||null,joined:true,members:['world',...wanted.filter(id=>!people.find(p=>p.id===id)?.approveInvites)]};
 if(old)state.groups=state.groups.map(x=>x.id===id?group:x);else state.groups.push(group);
 // For this isolated demo, invite approval is represented by a local pending request.
 wanted.filter(id=>people.find(p=>p.id===id)?.approveInvites).forEach(id=>{state.pendingInvites.push({id:group.id,name:group.name,username:group.username,recipient:id})});
 safeSet('groups',state.groups);safeSet('pending_invites',state.pendingInvites);closeModal();navigate('chat',group.id);
 if(wanted.some(id=>people.find(p=>p.id===id)?.approveInvites))toast(tt('inviteSent'));
 });return;
},true);
document.body.addEventListener('input',ev=>{
 if(['groupUsername','accountUsername'].includes(ev.target.id))syncUsernameStatus();
 if(ev.target.id==='newChatFind'){const q=ev.target.value.toLocaleLowerCase().replace(/^@/,'');let el=document.getElementById('newChatPeople');if(el)el.innerHTML=people.filter(p=>(p.name+' '+p.nick).toLocaleLowerCase().includes(q)).map(p=>'<button type="button" class="chat-contact" data-chat="'+esc(p.id)+'">'+avat(p)+'<span class="contact-body"><strong>'+esc(p.name)+'</strong><small>@'+esc(p.nick)+'</small></span></button>').join('')||'<div class="mini-empty">'+t('emptyUsers')+'</div>'}
},true);
document.body.addEventListener('change',ev=>{
 if(ev.target.name==='visibility')syncUsernameStatus();
 if(ev.target.type==='file'&&ev.target.closest('.avatar-upload')&&ev.target.files?.[0]){
 const box=ev.target.closest('.avatar-upload'),file=ev.target.files[0];readAvatar(file,src=>{if(!src)return;const old=box.querySelector('.avatar');if(old){const img=document.createElement('img');img.className='avatar';img.src=src;old.replaceWith(img)}})
 }
},true);

init();
</script></body></html>

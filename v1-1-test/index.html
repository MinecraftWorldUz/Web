function renderBg(){document.body.classList.toggle('has-fall',!!state.bg);const el=document.getElementById('scene');el.innerHTML='';if(!state.bg)return;const svg='<svg viewBox="0 0 32 32"><path d="M16 2 20 9l5-2-2 6 6 4-7 3 1 6-7-3-7 3 1-6-7-3 6-4-2-6 5 2Z"/></svg>';const colors=['#f19a25','#b65024','#dc6a22','#a43c28','#ecaf49','#d34228'];for(let i=0;i<8;i++){let s=document.createElement('span');s.className='fall-leaf';s.style.left=(8+i*13.3)%100+'%';s.style.color=colors[i%6];s.style.setProperty('--duration',(20+i*2.6)+'s');s.style.setProperty('--delay',(-i*4.4)+'s');s.style.setProperty('--drift',((i%2?1:-1)*(20+i*3))+'px');s.innerHTML=svg;el.append(s)}}
function renderHeader(){document.getElementById('logo').innerHTML=ic('world',31);document.getElementById('bell').innerHTML=ic('bell')+'<span class="count">1</span>';document.getElementById('settingsTop').innerHTML=ic('settings');document.getElementById('profileTop').innerHTML=ic('user');document.getElementById('testlabel').textContent='V1.1 TEST • '+t('testing')}
function renderBottom(){document.getElementById('bottom').innerHTML=['home','community','add','chat','profile'].map(n=>`<button type="button" data-nav="${n}" class="${state.section===n?'active':''}">${ic(n==='add'?'plus':n)}<span>${t(n)}</span></button>`).join('');const fab=document.getElementById('fab');fab.classList.toggle('hidden',state.section!=='chat'||!!state.thread);fab.innerHTML=ic('plus',28)}
function home(){return `<section class="hero"><div><h1> Minecraft <span>World V1.1</span></h1><p>${t('modinfo')}</p><div class="small" style="margin-top:12px;color:#f9db9d">${t('testing')}</div></div></section><section class="panel"><div class="headrow"><h2>${ic('box')} ${t('mods')}</h2><span class="badge">V1.1 TEST</span></div><div class="cats">${['all','addons','maps','textures','shaders','chat'].map((x,i)=>`<button class="cat ${state.filter===x?'active':''}" data-action="filter" data-value="${x}">${ic(['box','plus','world','eye','sun','chat'][i])}<span>${['Barchasi','Addonlar','Xaritalar','Teksturalar','Shaderlar','Chat'][i]}</span></button>`).join('')}</div></section><section class="panel"><div class="headrow"><h2>${ic('box')} ${t('posted')}</h2><button class="btn secondary" data-nav="add">${ic('plus')} ${t('add')}</button></div><div class="cards">${[...state.posts,{title:'Visible Trades',details:'Villagerlar savdosini qulayroq ko‘rish',version:'Bedrock 1.21+',author:'admin',demo:true}].map(m=>`<div class="mod"><div class="mod-art">${ic('world',45)}</div><div class="mod-info"><h3>${esc(m.title)}</h3><p>${esc(m.details)}</p><div class="tiny">${esc(m.version||'Bedrock 1.21+')} · ${ic('eye',13)} 12 · ${ic('heart',13)} 3</div><div class="row"><button class="btn secondary" data-action="modPreview">${t('view')}</button><small class="muted">@${esc(m.author||'world')}</small></div></div></div>`).join('')}</div></section>`}
function community(){return `<section class="panel"><div class="headrow"><h2>${ic('community')} ${t('community')}</h2></div><p class="muted">${t('testing')}</p><div class="list spaced">${people.map(p=>`<div class="item"><div class="row between">${ident(p,`data-person="${p.id}"`)}<button class="btn ${state.follows[p.id]?'secondary':''}" data-follow="${p.id}">${state.follows[p.id]?t('unfollow'):t('follow')}</button></div></div>`).join('')}<div class="item"><h3>Birga Minecraft o‘ynaymiz!</h3><p class="muted" style="margin:9px 0">Bedrock • Survival • 20:00</p><button class="btn secondary" data-action="joinDemo">${t('community')}</button></div></div></section>`}
function translationFields(){let languages=['uz','ru','en'].filter(l=>l!==state.lang);return languages.map(l=>`<div class="translation-box"><b>${{uz:'O‘zbekcha',ru:'Русский',en:'English'}[l]}</b><label>${t('title')}</label><input class="field" name="title_${l}" placeholder="${{uz:'Nom',ru:'Название',en:'Title'}[l]}"><label>${t('desc')}</label><textarea name="description_${l}" placeholder="${{uz:'Tavsif',ru:'Описание',en:'Description'}[l]}"></textarea></div>`).join('')}
function add(){return `<section class="panel"><div class="headrow"><h2>${ic('plus')} ${t('create')}</h2></div><p class="muted small">${t('warning')}</p><form id="modform" class="spaced"><label>${t('title')}</label><input class="field" name="title" required maxlength="90"><label style="display:block;margin:12px 0 5px">${t('desc')}</label><textarea name="desc" required maxlength="1500"></textarea><div class="fields spaced"><div><label>Minecraft</label><select name="version"><option>Bedrock 26.63</option><option>Bedrock 1.21</option><option>Java 26.3</option><option>Java 1.21.11</option></select></div><div><label>${t('mods')}</label><select name="type"><option>Addon</option><option>Mod</option><option>Map</option><option>Texture</option></select></div></div><div class="sep"></div><h3>${t('translation')} (${['uz','ru','en'].filter(l=>l!==state.lang).join(' / ').toUpperCase()})</h3><p class="small muted">${t('testing')}</p>${translationFields()}<button class="btn" type="submit">${t('review')}</button></form></section>`}
function profile(){let p=person(state.viewed);const own=p.id==='world';return `<section class="panel profile"><div class="profile-top">${avat(p,true)}<div style="min-width:0"><div class="profile-name">${esc(p.name)} ${verified(p)}</div><div class="muted">@${esc(p.nick)}</div></div></div>${p.bio?`<p class="profile-bio">${esc(p.bio)}</p>`:''}<div class="small muted spaced">ID: ${own?'#2':p.id==='admin'?'#1':'#3'}</div><div class="statrow"><div class="stat"><strong>${own?state.posts.length:1}</strong><small>${t('posts')}</small></div><div class="stat"><strong>${own?1:3}</strong><small>${t('followers')}</small></div><div class="stat"><strong>${own?1:3}</strong><small>${t('following')}</small></div></div><div class="row">${own?`<button class="btn" data-action="editProfile">${ic('edit')} ${t('edit')}</button><button class="btn secondary" data-action="settings">${ic('settings')} ${t('settings')}</button>`:`<button class="btn" data-follow="${p.id}">${state.follows[p.id]?t('unfollow'):t('follow')}</button><button class="btn secondary" data-chat="${p.id}">${ic('chat')} ${t('chat')}</button>`}</div></section><div class="headrow"><h2>${t('posts')}</h2>${own?`<button class="btn" data-nav="add">${ic('plus')} ${t('add')}</button>`:''}</div>${state.posts.length&&own?state.posts.map(x=>`<div class="item"><h3>${esc(x.title)}</h3><p>${esc(x.details)}</p><span class="badge">TEST</span></div>`).join(''):`<div class="empty">${ic('box',31)}<p>${t('testing')}</p></div>`}`}
function chat(){if(state.thread)return threadUI();return `<section class="panel"><div class="headrow"><h2>${ic('chat')} ${t('chat')}</h2><span class="small muted">Telegram uslubi</span></div><div class="chat-top">${people.map(p=>`<button class="chat-user" data-chat="${p.id}">${avat(p)}<span>${esc(p.name)}</span></button>`).join('')}</div><div class="chat-list"><div class="item" data-chat="global">${ic('globe',32)}<div class="nameblock"><strong>${t('general')}</strong><span class="message-preview">Minecraft World</span></div></div>${people.map(p=>`<div class="item" data-chat="${p.id}">${avat(p)}<div class="nameblock"><strong>${esc(p.name)} ${verified(p)}</strong><span class="message-preview">@${esc(p.nick)} · ${esc(p.last)}</span></div>${p.unread?'<span class="badge">1</span>':''}</div>`).join('')}</div></section>`}
function threadUI(){let p=state.thread==='global'?{name:t('general'),nick:'world',id:'global'}:person(state.thread);let messages=state.messages[state.thread]||[{mine:false,text:state.thread==='global'?'Salom hammaga!':'Salom!'}];return `<section class="panel chat-screen"><div class="chat-head"><button class="go-back" data-action="chatBack" aria-label="${t('back')}">${ic('back',25)}</button>${ident(p,p.id==='global'?'':`data-person="${p.id}"`)}</div><div class="messages" id="messages">${messages.map(x=>`<div class="bubble ${x.mine?'mine':''}">${esc(x.text)}<small>00:27</small></div>`).join('')}</div><form id="chatForm" class="compose"><input class="field" name="text" required maxlength="1500" placeholder="${t('send')}..."><button class="btn" aria-label="${t('send')}" type="submit">${ic('send')}</button></form></section>`}
function notifyUI(){return `<h2>${ic('bell')} ${t('notifications')}</h2><div class="list"><div class="item notif">${avat(person('anzecraft'))}<div><strong data-person="anzecraft">${esc(person('anzecraft').name)}</strong><div class="small muted">@anzecraft</div><div class="small">${t('yours')}</div></div><button class="btn secondary" data-person="anzecraft">${t('profile')}</button></div></div><p class="footnote">${t('testing')}</p>`}
function settingsUI(){return `<h2>${ic('settings')} ${t('settings')}</h2><div class="checkrow"><div><strong>${t('turnbg')}</strong><div class="small muted">Minecraft pixel art + kuzgi xazon</div></div><button type="button" id="bgToggle" class="switch ${state.bg?'on':''}" data-action="toggleBg" aria-pressed="${state.bg}" aria-label="${t('turnbg')}"></button></div><div class="sep"></div><h3>${t('lang')}</h3><div class="language-buttons spaced">${['uz','ru','en'].map(l=>`<button class="tab ${state.lang===l?'active':''}" data-lang="${l}">${{uz:'O‘zbek',ru:'Русский',en:'English'}[l]}</button>`).join('')}</div><p class="footnote">${t('testing')}</p>`}
function profileEditUI(){return `<h2>${ic('edit')} ${t('edit')}</h2><form id="profileForm"><label>${t('name')}</label><input class="field" maxlength="45" name="name" required value="${esc(state.name)}"><label>Username</label><input class="field" readonly value="@world"><label>${t('bio')}</label><textarea name="bio" maxlength="280">${esc(state.bio)}</textarea><label>${t('photo')}</label><input class="field" type="file" id="avatarUpload" accept="image/png,image/jpeg,image/webp"><div class="row"><button class="btn" type="submit">${t('save')}</button><button type="button" class="btn secondary" data-action="close">${t('cancel')}</button></div></form><p class="footnote">${t('testing')}</p>`}
function modal(content){document.getElementById('overlay').classList.remove('hidden');document.getElementById('overlay').innerHTML=`<div class="modal"><div class="row between"><div></div><button type="button" class="icon-btn" data-action="close" aria-label="${t('cancel')}">${ic('back')}</button></div>${content}</div>`}
function closeModal(){state.modal=null;document.getElementById('overlay').classList.add('hidden');document.getElementById('overlay').innerHTML=''}
function render(){document.documentElement.lang=state.lang;renderBg();renderHeader();renderBottom();document.getElementById('main').innerHTML=state.section==='home'?home():state.section==='community'?community():state.section==='add'?add():state.section==='chat'?chat():profile();if(state.modal){modal(state.modal==='settings'?settingsUI():state.modal==='notifications'?notifyUI():state.modal==='edit'?profileEditUI():`<h2>${t('newchat')}</h2><div class="list">${people.map(p=>`<div class="item clickable" data-chat="${p.id}">${ident(p)}</div>`).join('')}</div>`)}else closeModal();if(state.thread){let m=document.getElementById('messages');if(m)m.scrollTop=m.scrollHeight}}
function navigate(section,thread=null,historyFlag=true){state.section=section;state.thread=thread;if(section==='profile'&&!state.viewed)state.viewed='world';state.modal=null;if(historyFlag)history.pushState({section,thread,viewed:state.viewed},'',`#${section}${thread?'/'+thread:''}`);render();window.scrollTo(0,0)}
let exitTap=0;
window.addEventListener('popstate',ev=>{if(state.modal){closeModal();return}if(state.thread){navigate('chat',null,false);return}if(ev.state?.section){state.viewed=ev.state.viewed||'world';navigate(ev.state.section,ev.state.thread||null,false);return}if(Date.now()-exitTap>1800){exitTap=Date.now();toast('Chiqish uchun yana bir marta orqaga bosing');history.pushState({section:'home'},'','#home')}else{toast('Sinov sahifasidan chiqilyapti')}});
document.body.addEventListener('click',ev=>{const x=ev.target.closest('button,[data-person],[data-chat]');if(!x)return;const n=x.dataset.nav,action=x.dataset.action,who=x.dataset.person,chatId=x.dataset.chat,follow=x.dataset.follow,lang=x.dataset.lang;if(n){state.viewed='world';navigate(n);return}if(action==='profile'){state.viewed='world';navigate('profile');return}if(who){state.viewed=who;closeModal();navigate('profile');return}if(follow){state.follows[follow]=!state.follows[follow];safeSet('follows',state.follows);toast(state.follows[follow]?t('unfollow'):t('follow'));render();return}if(chatId){closeModal();navigate('chat',chatId);return}if(lang){state.lang=lang;safeSet('lang',lang);render();return}if(action==='chatBack'){navigate('chat');return}if(action==='close'){closeModal();return}if(action==='toggleBg'){state.bg=!state.bg;safeSet('bg',state.bg);render();return}if(action==='notifications'||action==='settings'||action==='editProfile'||action==='newChat'){state.modal={notifications:'notifications',settings:'settings',editProfile:'edit',newChat:'newchat'}[action];render();return}if(action==='filter'){state.filter=x.dataset.value;render();return}if(action==='modPreview'){toast('TEST: modlar bazasi alohida ulanmagan');return}if(action==='joinDemo'){toast(t('testing'));return}});
document.body.addEventListener('submit',ev=>{if(!['profileForm','chatForm','modform'].includes(ev.target.id))return;ev.preventDefault();let fd=new FormData(ev.target);if(ev.target.id==='profileForm'){state.name=String(fd.get('name')||'World').trim()||'World';state.bio=String(fd.get('bio')||'').trim();safeSet('name',state.name);safeSet('bio',state.bio);const img=document.getElementById('avatarUpload')?.files?.[0];if(img&&img.size<=900000&&img.type.startsWith('image/')){const reader=new FileReader();reader.onload=()=>{state.avatar=reader.result;safeSet('avatar',state.avatar);closeModal();render();toast(t('save'))};reader.readAsDataURL(img)}else{closeModal();render();toast(t('save'))}return}if(ev.target.id==='chatForm'){if(!state.thread)return;state.messages[state.thread]??=[{mine:false,text:'Salom!'}];state.messages[state.thread].push({mine:true,text:String(fd.get('text')||'').trim()});render();return}if(ev.target.id==='modform'){state.posts.unshift({title:String(fd.get('title')||'Mod'),details:String(fd.get('desc')||''),version:String(fd.get('version')||''),author:'world'});safeSet('posts',state.posts);toast(t('testing'));navigate('profile');return}});
document.getElementById('overlay').addEventListener('click',ev=>{if(ev.target.id==='overlay')closeModal()});
function init(){document.getElementById('fab').innerHTML=ic('plus');state.viewed='world';history.replaceState({section:'home',viewed:'world'},'',location.pathname+'#home');render();}
init();
</script></body></html>


<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16211b">
<title>Minecraft World 🍁</title>
<style>
:root{
  --bg:#101914;--panel:#1c2920;--panel2:#273429;
  --text:#f9f0db;--muted:#b3b9aa;--gold:#ffc078;
  --orange:#ed9652;--edge:#ffffff20;--red:#f28d7e;
  --green:#8dda9b
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(ellipse at top right,#3c3a25,transparent 52%),var(--bg);
  color:var(--text);font:15px/1.5 system-ui,Arial,sans-serif;
  min-height:100vh
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
button:disabled{opacity:.55;cursor:default}
h1,h2,h3{line-height:1.2}
h1{font-size:clamp(34px,6vw,64px);letter-spacing:-2px;margin:0 0 16px}
h2{margin:5px 0 14px}
a{color:var(--gold)}
.shell{
  max-width:1160px;margin:auto;padding:0 14px 130px;
  position:relative;z-index:2
}
.top{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;position:sticky;top:0;z-index:20;
  padding:15px;background:#1a2821ee;
  border:1px solid var(--edge);border-radius:0 0 20px 20px;
  backdrop-filter:blur(16px)
}
.logo{
  font-weight:950;letter-spacing:1px;background:none;
  color:var(--text);font-size:19px;text-align:left
}
.logo b{color:var(--orange)}
.head-actions{display:flex;gap:8px}
.iconbtn{
  background:#ffffff12;color:var(--text);
  border:1px solid var(--edge);padding:9px 12px;
  border-radius:12px;position:relative
}
.dot{
  background:#ee6b48;border-radius:50%;
  position:absolute;top:-3px;right:-3px;
  min-width:18px;font-size:11px
}
.hero{
  position:relative;overflow:hidden;margin:20px 0 25px;
  background:radial-gradient(circle at 85% 22%,#ba693f66,transparent 43%),
  linear-gradient(125deg,#283d2d,#57402c);
  border:1px solid #cc94566c;border-radius:26px;
  padding:53px 35px;box-shadow:0 25px 60px #0006
}
.hero h1 span{color:var(--gold)}
.hero p{max-width:530px;color:#e5dbca}
.autumn{
  position:absolute;right:8%;top:25%;
  font-size:110px;opacity:.35;transform:rotate(18deg)
}
.eyebrow{
  color:var(--gold);font-size:11px;font-weight:800;
  letter-spacing:2px;text-transform:uppercase
}
.btn{
  background:var(--orange);color:#281f15;border-radius:12px;
  padding:10px 16px;font-weight:850;display:inline-block
}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{
  background:#ffffff13;color:var(--text);
  border:1px solid var(--edge)
}
.btn.danger{background:#b34940;color:white}
.btn.small{font-size:12px;padding:7px 10px}
.buttons{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:12px 0}
.bar{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;margin:25px 0 15px
}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}
.field{
  background:#15221a;color:var(--text);
  border:1px solid var(--edge);border-radius:10px;
  padding:11px;width:100%;outline:none
}
.field:focus{border-color:var(--orange)}
.filters input{flex:2;min-width:170px}
.filters select{flex:1;min-width:120px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}
.card{
  background:linear-gradient(130deg,#253127,#1a241d);
  border:1px solid var(--edge);border-radius:18px;
  overflow:hidden;min-width:0
}
.card:hover{border-color:#ffa85e70}
.art{
  height:180px;background:linear-gradient(125deg,#557944,#ad7940);
  display:grid;place-items:center;font-size:64px;
  position:relative;overflow:hidden
}
.art img{width:100%;height:100%;object-fit:cover}
.chip{
  position:absolute;left:10px;top:10px;
  background:#10221dbb;border:1px solid #ffffff50;
  border-radius:9px;font-size:11px;padding:4px 9px
}
.cardbody{padding:15px}
.cardbody h3{margin:3px 0 6px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.mini{font-size:12px}
.smalltext{font-size:13px}
.cardbody p{min-height:35px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.av{
  width:40px;height:40px;border-radius:50%;
  background:#73563c;display:inline-grid;place-items:center;
  overflow:hidden;flex-shrink:0;color:white;font-weight:800
}
.av.large{width:90px;height:90px;font-size:39px}
.av img{width:100%;height:100%;object-fit:cover}
.linkbtn{
  border:0;background:transparent;color:var(--gold);
  padding:0;font-weight:800;text-align:left;
  cursor:pointer;overflow-wrap:anywhere
}
.tick{
  background:#3b98f4;color:white;border-radius:50%;
  font-size:11px;margin-left:3px;padding:1px 5px
}
.banner{
  border:1px solid #c7916266;
  background:radial-gradient(circle at right,#8f5b3455,transparent 55%),#2c4231;
  border-radius:22px;padding:30px
}
.counters{display:flex;gap:8px;margin:20px 0}
.count{
  flex:1;min-width:0;text-align:center;
  border:1px solid var(--edge);background:#13231abb;
  color:var(--text);padding:12px 4px;border-radius:12px
}
.count b{display:block;font-size:25px}
.count span{font-size:12px}
.list{display:grid;gap:10px}
.item{
  border:1px solid var(--edge);
  background:var(--panel);border-radius:14px;padding:14px
}
.tabs{display:flex;gap:7px;margin:18px 0}
.tabs button{
  padding:9px 14px;border-radius:10px;
  background:#ffffff12;color:var(--muted)
}
.tabs button.on{background:var(--orange);color:#281f15}
.bottom{
  position:fixed;bottom:10px;left:50%;transform:translateX(-50%);
  display:grid;grid-template-columns:repeat(5,1fr);
  gap:4px;padding:7px;background:#1b2921f1;
  backdrop-filter:blur(18px);border:1px solid var(--edge);
  border-radius:21px;width:min(720px,calc(100% - 15px));
  z-index:20;box-shadow:0 12px 45px #0009
}
.bottom button{
  background:transparent;color:#b7bbaf;border-radius:12px;
  padding:7px 2px;font-size:11px;display:grid;place-items:center
}
.bottom button i{font-style:normal;font-size:25px}
.bottom button.on{background:#ec974f27;color:var(--gold)}
#leaves{
  position:fixed;inset:0;overflow:hidden;
  pointer-events:none;z-index:0
}
.leaf{
  position:absolute;top:-40px;opacity:.5;
  animation:fall linear infinite
}
@keyframes fall{
  to{transform:translate(80px,110vh) rotate(520deg)}
}
#overlay{
  display:none;position:fixed;inset:0;background:#000c;
  backdrop-filter:blur(8px);z-index:50;
  align-items:center;justify-content:center;padding:10px
}
#overlay.open{display:flex}
.dialog{
  width:min(750px,100%);max-height:93vh;overflow:auto;
  background:#1d2b22;border:1px solid #ffffff33;
  border-radius:20px;box-shadow:0 20px 80px #000a
}
.dialoghead{
  position:sticky;top:0;background:#25372bee;
  display:flex;justify-content:space-between;align-items:center;
  padding:13px 20px;border-bottom:1px solid var(--edge);z-index:2
}
.dialogbody{padding:20px}
.formgroup{margin:0 0 15px}
.formgroup label{
  display:block;font-size:13px;font-weight:800;margin:0 0 6px
}
.formgroup textarea{min-height:95px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.messages{
  max-height:400px;min-height:240px;overflow:auto;
  display:flex;flex-direction:column;gap:10px;padding:12px 0
}
.bubble{
  background:#344637;padding:10px 13px;border-radius:14px;
  max-width:78%;align-self:start;white-space:pre-wrap;
  overflow-wrap:anywhere
}
.bubble.mine{background:#98673e;align-self:end}
.bubble small{
  display:block;color:#e4d6c0;font-size:10px;text-align:right
}
.chatlayout{
  display:grid;grid-template-columns:230px minmax(0,1fr);gap:15px
}
.note{
  border-left:3px solid var(--gold);padding:12px;
  background:#fca34d14;border-radius:8px;
  color:#f7d4ae;margin:10px 0
}
.empty{
  text-align:center;padding:40px 15px;
  border:1px dashed #ffffff45;
  border-radius:17px;color:var(--muted)
}
#toast{
  position:fixed;top:80px;right:12px;z-index:100;
  background:#334e38;border:1px solid var(--orange);
  color:white;border-radius:12px;padding:10px 15px;
  display:none;max-width:350px
}
.wrap{overflow-wrap:anywhere;white-space:pre-wrap}
.divider{border-top:1px solid var(--edge);margin:16px 0}
.status{
  font-size:11px;border:1px solid var(--edge);
  border-radius:8px;padding:3px 6px;color:var(--gold)
}
.badgeStatus{color:var(--green)}
.footer{
  text-align:center;color:#829286;font-size:11px;margin:28px 0
}
@media(max-width:760px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chatlayout{grid-template-columns:1fr}
  .autumn{font-size:80px;right:-10px}
  .hero{padding:39px 23px}
}
@media(max-width:560px){
  .grid,.two{grid-template-columns:1fr}
  .logo{font-size:14px}
  .top{padding:10px}
  .iconbtn{padding:7px 9px}
  .hero h1{font-size:36px}
  .art{height:190px}
  .banner{padding:18px}
  .count b{font-size:20px}
  .count span{font-size:10px}
  .bottom button{font-size:9px}
  .bottom button i{font-size:22px}
}
@media(prefers-reduced-motion:reduce){
  .leaf{display:none}
}
</style>
</head>

function t(k){return words[S.lang]?.[k]||words.uz[k]||k}
function e(v){
  return String(v??'').replace(/[&<>"']/g,x=>({
    '&':'&amp;','<':'&lt;','>':'&gt;',
    '"':'&quot;',"'":'&#39;'
  }[x]));
}
function count(x){return (x||0).toLocaleString()}
function when(x){
  return new Date(x).toLocaleString(
    S.lang==='uz'?'uz-UZ':S.lang==='ru'?'ru-RU':'en-US'
  )
}
function banned(p){
  return !!(p&&(p.banned_permanently||
    p.banned_until&&new Date(p.banned_until)>new Date()))
}
function nick(p){return banned(p)?t('banned'):p?.username||'...'}
function tick(p){
  return p?.verified&&(!p.verified_until||
    new Date(p.verified_until)>new Date())
    ?'<span class="tick" title="Verified">✓</span>':''
}
function label(p){return '@'+e(nick(p))+tick(p)}
function avatar(p,large=false){
  return `<span class="av ${large?'large':''}">${
    p?.avatar_url&&!banned(p)
      ?`<img src="${e(p.avatar_url)}" alt="">`
      :e(nick(p)[0]?.toUpperCase()||'?')
  }</span>`
}
function cover(path){
  return path?DB.storage.from('covers').getPublicUrl(path).data.publicUrl:''
}
function btn(a,text,id='',extra=''){
  return `<button class="btn small ${extra}" data-act="${a}"
  data-id="${e(id)}">${text}</button>`
}
function blank(){return `<div class="empty">🍂 ${t('empty')}</div>`}
function toast(s){
  $('#toast').textContent=String(s);
  $('#toast').style.display='block';
  clearTimeout(window._tt);
  window._tt=setTimeout(()=>$('#toast').style.display='none',4200)
}
function check(r){if(r.error)throw r.error;return r.data}
function requireUser(){
  if(!S.u){authBox();return false}
  if(banned(S.me)){toast('Akkaunt cheklangan');return false}
  return true
}
function dialog(title,html){
  $('#overlay').innerHTML=`<div class="dialog">
    <div class="dialoghead">
      <strong>${e(title)}</strong>
      <button class="iconbtn" data-act="close">✕</button>
    </div>
    <div class="dialogbody">${html}</div>
  </div>`;
  $('#overlay').classList.add('open')
}
function close(){
  $('#overlay').classList.remove('open');
  $('#overlay').innerHTML=''
}
function formField(title,name,type='text',val='',req=true){
  return `<div class="formgroup">
    <label>${e(title)}</label>
    <input class="field" name="${name}" type="${type}"
      value="${e(val)}" ${req?'required':''}>
  </div>`
}
function optionList(arr,sel){
  return arr.map(x=>`<option value="${e(x)}"
    ${sel===x?'selected':''}>${e(x==='other'?'Other':x)}</option>`
  ).join('')
}
async function users(ids){
  let a=[...new Set(ids.filter(Boolean))];
  if(!a.length)return {};
  let r=await DB.from('profiles').select('*').in('id',a);
  check(r);
  return Object.fromEntries(r.data.map(p=>[p.id,p]))
}
function miniUser(p){
  return `<button class="linkbtn" data-act="user"
    data-id="${e(p?.id)}">${label(p)}</button>`
}
function card(m,p,own=false){
  return `<article class="card">
    <div class="art" data-act="mod" data-id="${m.id}">
      ${cover(m.cover_path)?`<img loading="lazy"
        src="${e(cover(m.cover_path))}" alt="">`:'⛏'}
      <span class="chip">${e(m.category)}</span>
    </div>
    <div class="cardbody">
      <h3><button class="linkbtn" data-act="mod"
        data-id="${m.id}">${e(m.title)}</button></h3>
      <p class="muted smalltext">${e(m.description.slice(0,125))}</p>
      <div class="row mini muted">
        ♡ ${count(m.likes_count)}
        · ⬇ ${count(m.downloads_count)}
        · ${e(m.game_version)}
      </div>
      <div class="divider"></div>
      <div class="row">${avatar(p)}${miniUser(p)}</div>
      ${own?`<div class="buttons">
        <span class="status">${t(m.status)}</span>
        ${btn('editMod',t('edit'),m.id,'ghost')}
        ${btn('removeMod',t('delete'),m.id,'danger')}
      </div>`:''}
    </div>
  </article>`
}
async function go(page='home',id=null){
  S.page=page;S.profileId=id;
  document.querySelectorAll('[data-go]').forEach(
    x=>x.classList.toggle('on',x.dataset.go===page)
  );
  $('#app').innerHTML='<div class="empty">🍁 ...</div>';
  try{
    if(page==='home')await home();
    else if(page==='profile')await profile(id||S.u?.id);
    else if(page==='create')create();
    else if(page==='community')await community();
    else if(page==='chat')await chats();
    else await home()
  }catch(err){
    console.error(err);
    $('#app').innerHTML=`<div class="empty">${e(err.message)}</div>`;
    toast(err.message)
  }
}
async function home(){
  let r=await DB.from('mods').select('*')
    .eq('status','approved')
    .order(S.sort==='popular'?'likes_count':'created_at',

async function submitAuth(f){
  const form=new FormData(f);
  const username=String(form.get('username')||'').trim().toLowerCase();
  const password=String(form.get('password')||'');
  const register=f.dataset.register==='true';
  if(!/^[a-z0-9_]{3,20}$/.test(username))
    throw Error('Username 3–20 ta: a–z, 0–9 yoki _');
  if(!password || new TextEncoder().encode(password).length>72)
    throw Error('Parol bo‘sh bo‘lmasin, 72 baytdan oshmasin');
  if(register){
    if([...password].length<8)
      throw Error('Parol kamida 8 belgidan iborat bo‘lsin');
    if(password!==form.get('password2'))
      throw Error('Parollar bir xil emas');
  }
  let response;
  try{
    response=await fetch(
      'https://ruovdgyfcucspffrvijh.supabase.co/functions/v1/username-auth',
      {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        credentials:'omit',
        cache:'no-store',
        body:JSON.stringify({
          action:register?'signup':'login',username,password
        })
      }
    );
  }catch{
    throw Error('Login serveri hali ishga tushmagan yoki ulanmagan');
  }
  const result=await response.json().catch(()=>({}));
  if(!response.ok)
    throw Error(result.error||'Login serveri javob bermadi');
  if(!result.access_token||!result.refresh_token)
    throw Error('Server sessiya qaytarmadi');
  const {error}=await DB.auth.setSession({
    access_token:result.access_token,
    refresh_token:result.refresh_token
  });
  if(error)throw error;
  close();
  toast('Xush kelibsiz, @'+username);
  await refreshUser();
  await go('home');
}

async function upload(bucket,file,max,types=null){
  if(!file||!file.size)throw Error('Fayl tanlanmagan');
  if(file.size>max)throw Error('Fayl hajmi katta');
  if(types&&!types.includes(file.type))
    throw Error('Rasm turi noto‘g‘ri');
  let ext=file.name.split('.').pop().toLowerCase();
  if(bucket!=='mod-files'){
    ext={
      'image/png':'png','image/jpeg':'jpg',
      'image/webp':'webp','image/gif':'gif'
    }[file.type]
  }
  if(bucket==='mod-files'&&
    !['zip','jar','mcpack','mcaddon','mcworld','rar','7z']
      .includes(ext))
    throw Error('Noto‘g‘ri mod fayl turi');
  let path=`${S.u.id}/${crypto.randomUUID()}.${ext}`;
  check(await DB.storage.from(bucket).upload(path,file,{
    contentType:file.type||'application/octet-stream',
    upsert:false
  }));
  return path
}

async function saveMod(f){
  if(!requireUser())return;
  let x=new FormData(f),id=f.dataset.id,m=null;
  if(id){
    m=check(await DB.from('mods').select('*')
      .eq('id',id).eq('author_id',S.u.id).single())
  }
  let image=x.get('image'),file=x.get('file');
  let cover_path=m?.cover_path||'',file_path=m?.file_path||'';
  if(image?.size){
    cover_path=await upload('covers',image,2097152,
      ['image/jpeg','image/png','image/webp','image/gif'])
  }
  if(file?.size){
    file_path=await upload('mod-files',file,10485760)
  }
  if(!cover_path||!file_path)throw Error('Rasm va fayl kerak');
  let data={
    title:String(x.get('title')).trim(),
    description:String(x.get('description')).trim(),
    category:x.get('category'),
    game_version:x.get('version'),
    cover_path,file_path
  };
  if(data.title.length<3||data.description.length<10)
    throw Error('Mod nomi yoki tavsifi juda qisqa');
  check(m?
    await DB.from('mods').update(data)
      .eq('id',id).eq('author_id',S.u.id):
    await DB.from('mods').insert({...data,author_id:S.u.id})
  );
  toast(t('pending'));
  close();
  await go('profile',S.u.id)
}

      <h2>✉ ${t('chat')}</h2>
      ${btn('chooseChat','＋')}
    </div>
    <div class="chatlayout">
      <div class="list">
        ${ids.length?ids.map(id=>`
          <button class="item row"
            style="color:var(--text);text-align:left"
            data-act="chatSelect" data-id="${id}">
            ${avatar(S.chatUsers[id])}
            ${label(S.chatUsers[id])}
          </button>`).join(''):blank()}
      </div>
      <div class="item" id="conversation"></div>
    </div>`;
  if(S.chatId)await conversation(S.chatId);
  else $('#conversation').innerHTML=blank()
}
async function conversation(id){
  if(!S.u)return;
  S.chatId=id;
  let p=(S.chatUsers||{})[id]||(await users([id]))[id];
  let r=await DB.from('messages').select('*')
    .or(`and(sender_id.eq.${S.u.id},recipient_id.eq.${id}),and(sender_id.eq.${id},recipient_id.eq.${S.u.id})`)
    .order('created_at',{ascending:true}).limit(300);
  check(r);
  let area=$('#conversation');
  if(!area)return;
  area.innerHTML=`
    <div class="row">${avatar(p)}${miniUser(p)}</div>
    <div class="divider"></div>
    <div class="messages" id="msgs">
      ${r.data.map(m=>`
        <div class="bubble ${m.sender_id===S.u.id?'mine':''}">
          ${e(m.body)}
          <small>
            ${when(m.created_at)}
            <button class="linkbtn" data-act="reportMsg"
              data-id="${m.id}">⚑</button>
          </small>
        </div>`).join('')||blank()}
    </div>
    <form id="msgForm" data-id="${id}" class="row">
      <button type="button" class="btn ghost"
        data-act="chooseChat">＋</button>
      <input class="field" style="flex:1" name="body"
        maxlength="2000" placeholder="${t('message')}" required>
      <button class="btn">➤</button>
    </form>`;
  $('#msgs').scrollTop=$('#msgs').scrollHeight
}
async function chooseChat(){
  if(!requireUser())return;
  let r=await DB.from('follows').select('following_id')
    .eq('follower_id',S.u.id);
  check(r);
  let mp=await users(r.data.map(x=>x.following_id));
  dialog(t('chat'),r.data.length?
    r.data.map(x=>`<div class="item row">
      ${avatar(mp[x.following_id])}
      ${miniUser(mp[x.following_id])}
      ${btn('chatStart','✉',x.following_id)}
    </div>`).join(''):blank())
}
async function notificationCount(){
  if(!S.u){
    $('#alertCount').hidden=true;
    return
  }
  let r=await DB.from('notifications')
    .select('id',{count:'exact',head:true})
    .eq('user_id',S.u.id).eq('is_read',false);
  if(r.error)return;
  $('#alertCount').hidden=!r.count;
  $('#alertCount').textContent=r.count>99?'99+':r.count
}
function listen(){
  if(S.channel){
    DB.removeChannel(S.channel);
    S.channel=null
  }
  if(!S.u)return;
  S.channel=DB.channel('world-'+S.u.id)
    .on('postgres_changes',{
      event:'INSERT',schema:'public',
      table:'notifications',filter:`user_id=eq.${S.u.id}`
    },p=>{
      notificationCount();
      toast('🔔 '+p.new.title);
      if(document.visibilityState==='hidden'&&
        'Notification'in window&&
        Notification.permission==='granted')
        new Notification(p.new.title,{body:p.new.body})
    })
    .on('postgres_changes',{
      event:'INSERT',schema:'public',
      table:'messages',filter:`recipient_id=eq.${S.u.id}`
    },()=>{
      if(S.page==='chat'&&S.chatId)
        conversation(S.chatId)
    }).subscribe()
}
async function notifications(){
  if(!requireUser())return;
  let r=await DB.from('notifications').select('*')
    .eq('user_id',S.u.id)
    .order('created_at',{ascending:false}).limit(100);
  check(r);
  dialog(t('notifications'),`
    ${btn('markRead',t('mark'))}
    <div class="divider"></div>
    ${r.data.map(n=>`
      <div class="item"
        style="border-left:3px solid ${n.is_read?'#567':'#ffab60'}">
        <b>${e(n.title)}</b>
        <p>${e(n.body)}</p>
        <small class="muted">${when(n.created_at)}</small>
      </div>`).join('')||blank()}`)
}
async function settings(){
  if(!requireUser())return;
  let r=await DB.from('verification_requests').select('*')
    .eq('user_id',S.u.id)
    .order('created_at',{ascending:false}).limit(1);
  check(r);
  let v=r.data[0];
  let badgeActive=S.me?.verified&&
    (!S.me.verified_until||
      new Date(S.me.verified_until)>new Date());
  dialog(t('settings'),`
    <div class="item">
      <label>🌐 ${t('language')}</label>
      <select class="field" id="language">
        <option value="uz" ${S.lang==='uz'?'selected':''}>
          🇺🇿 O‘zbekcha
        </option>
        <option value="ru" ${S.lang==='ru'?'selected':''}>
          🇷🇺 Русский
        </option>
        <option value="en" ${S.lang==='en'?'selected':''}>
          🇬🇧 English
        </option>
      </select>
    </div>
    <div class="item">
      <b>🔵 ${t('request')}</b>
      <p class="muted mini">
        ${badgeActive?
          t('verified')+' · '+
          (S.me.verified_until?when(S.me.verified_until):'Muddatsiz'):
          v?.status==='pending'?t('applied'):
          v?.status==='rejected'?t('rejected'):''}
      </p>
      ${!badgeActive&&v?.status!=='pending'?
        btn('badgeRequest',t('request')):''}
    </div>
    <div class="item">
      <b>🔔 Brauzer bildirishnomalari</b>
      <div class="buttons">
        ${btn('permit','Yoqish','', 'ghost')}
      </div>
      <p class="mini muted">
        Sayt yopiq bo‘lganda ham push xabarlar uchun
        qo‘shimcha xizmat kerak.
      </p>
    </div>
    ${S.me?.is_admin&&S.me.username==='admin'?
      `<div class="item">
        ${btn('admin','🛡 '+t('admin'))}
      </div>`:''}
    <div class="item">
      ${btn('logout',t('logout'),'','danger')}
    </div>`)
}
function badgeRequest(){
  dialog(t('request'),`
    <form id="badgeForm">
      <div class="formgroup">
        <label>
          Nima sababdan ko‘k belgi olishingiz kerak?
        </label>
        <textarea class="field" name="reason"
          minlength="10" maxlength="800" required></textarea>
      </div>
      <button class="btn">${t('send')}</button>
    </form>`)
}
function report(kind,id){
  if(!requireUser())return;
  dialog(t('report'),`
    <form id="reportForm" data-kind="${kind}" data-id="${id}">
      <div class="formgroup">
        <label>Sabab</label>
        <textarea class="field" name="reason"
          minlength="5" maxlength="500" required></textarea>
      </div>
      <button class="btn danger">${t('send')}</button>
    </form>`)
}
async function admin(){
  if(!S.me?.is_admin||S.me.username!=='admin')
    throw Error('Faqat @admin');
  let [mods,badges,people,reports,all]=await Promise.all([
    DB.from('mods').select('*').eq('status','pending')
      .order('created_at',{ascending:true}).limit(100),
    DB.from('verification_requests').select('*')
      .eq('status','pending').limit(100),
    DB.from('profiles').select('*')
      .order('public_id',{ascending:false}).limit(200),
    DB.from('reports').select('*')
      .eq('status','pending').limit(100),
    DB.from('mods').select('*')
      .order('created_at',{ascending:false}).limit(100)
  ]);
  for(let r of [mods,badges,people,reports,all])check(r);
  let mp=Object.fromEntries(
    people.data.map(p=>[p.id,p])
  );
  dialog(t('admin'),`
    <h3>📦 ${t('pending')} (${mods.data.length})</h3>
    ${mods.data.map(m=>`
      <div class="item">
        <b>${e(m.title)}</b> · ${e(m.game_version)}
        <p class="wrap">${e(m.description)}</p>
        <div class="buttons">
          ${btn('mod',t('edit'),m.id,'ghost')}
          ${adminBtn('approve_mod',t('approve'),m.id)}
          ${adminBtn('reject_mod',t('reject'),m.id,'danger')}
        </div>
      </div>`).join('')||blank()}
    <h3>🔵 ${t('badge')} (${badges.data.length})</h3>
    ${badges.data.map(v=>`
      <div class="item">
        ${e(mp[v.user_id]?.username||v.user_id)}
        <p class="wrap">${e(v.reason)}</p>
        <div class="buttons">
          ${adminBtn('approve_verification',t('approve'),v.id)}
          ${adminBtn('reject_verification',t('reject'),v.id,'danger')}
        </div>
      </div>`).join('')||blank()}
    <h3>⚑ ${t('report')} (${reports.data.length})</h3>
    ${reports.data.map(r=>`
      <div class="item">
        <b>${e(r.target_kind)}</b>
        <p>${e(r.reason)}</p>
        <div class="buttons">
          ${adminBtn('resolve_report','Yopish',r.id)}
          ${r.target_kind==='mod'?
            adminBtn('delete_mod',t('delete'),r.target_id,'danger'):''}
          ${r.target_kind==='profile'?
            adminBtn('ban',t('ban'),r.target_id,'danger'):''}
        </div>
      </div>`).join('')||blank()}
    <h3>📂 Barcha modlar (${all.data.length})</h3>
    ${all.data.map(m=>`
      <div class="item">
        ${e(m.title)}
        <span class="status">${e(m.status)}</span>
        <div class="buttons">
          ${btn('mod',t('edit'),m.id,'ghost')}
          ${adminBtn('delete_mod',t('delete'),m.id,'danger')}
        </div>
      </div>`).join('')||blank()}
    <h3>👥 ${t('accounts')}</h3>
    ${people.data.map(p=>`
      <div class="item row">
        <span class="status">#${p.public_id}</span>
        ${miniUser(p)}
        ${p.is_admin?'ADMIN':
          adminBtn(banned(p)?'unban':'ban',
            banned(p)?t('unban'):t('ban'),
            p.id,banned(p)?'ghost':'danger')}
        ${p.verified?
          adminBtn('remove_verification','✓✕',p.id,'ghost'):''}
      </div>`).join('')}`)
}
function adminBtn(action,text,id,extra=''){
  return `<button class="btn small ${extra}"
    data-act="adminAction" data-cmd="${action}"
    data-id="${id}">${text}</button>`
}
async function adminAction(cmd,id){
  if(!S.me?.is_admin||S.me.username!=='admin')return;
  let days=null,note=null;
  if(cmd==='ban'||cmd==='approve_verification'){
    let raw=prompt(
      'Necha kun? Bo‘sh qoldirsang muddatsiz bo‘ladi:',''
    );
    if(raw===null)return;
    if(raw.trim()){
      days=Number(raw);
      if(!Number.isInteger(days)||days<1||days>3650)
        throw Error('1–3650 kun kiriting')
    }
  }
  if(cmd==='reject_mod'){
    note=prompt('Rad etish sababi:','');
    if(note===null)return
  }
  if(['delete_mod','ban'].includes(cmd)&&
    !confirm('Tasdiqlaysizmi?'))return;
  check(await DB.rpc('admin_action',{
    p_action:cmd,p_id:id,p_days:days,p_note:note
  }));
  toast('✅ Bajarildi');
  await admin()
}

// BARCHA TUGMALAR
window.addEventListener('click',async event=>{
  let a=event.target.closest('[data-go],[data-act]');
  if(!a)return;
  try{
    if(a.dataset.go){
      close();
      await go(a.dataset.go);
      return
    }
    let act=a.dataset.act,id=a.dataset.id;
    if(act==='close')close();
    else if(act==='self')
      S.u?await go('profile',S.u.id):authBox();
    else if(act==='auth')authBox();
    else if(act==='authSwitch')
      authBox(a.dataset.register==='true');
    else if(act==='user'){
      close();
      await go('profile',id)
    }
    else if(act==='mod')await openMod(id);
    else if(act==='settings')await settings();
    else if(act==='notifications')await notifications();
    else if(act==='sort'){
      S.sort=a.dataset.sort;
      await home()
    }
    else if(act==='follow')await toggleFollow(id);
    else if(act==='posts')
      $('#profileMods')?.scrollIntoView({behavior:'smooth'});
    else if(act==='followers'||act==='following')
      await followList(act,id);
    else if(act==='editProfile')editProfile();
    else if(act==='editMod')await editMod(id);
    else if(act==='removeMod')await removeMod(id);
    else if(act==='like')await toggleTable('mod_likes',id);
    else if(act==='saveMod')await toggleTable('mod_saves',id);
    else if(act==='download')await download(id);
    else if(act==='reportMod')report('mod',id);
    else if(act==='reportUser')report('profile',id);
    else if(act==='reportMsg')report('message',id);
    else if(act==='removeComment'){
      if(confirm('Izoh o‘chirilsinmi?')){
        check(await DB.from('comments').delete().eq('id',id));
        await comments($('#commentList').dataset.mod)
      }
    }
    else if(act==='tab'){
      S.tab=a.dataset.tab;
      await community()
    }
    else if(act==='invite')inviteBox();
    else if(act==='join'){
      if(!requireUser())return;
      check(await DB.from('play_joins').insert({
        play_id:id,user_id:S.u.id
      }));
      await community()
    }
    else if(act==='removeInvite'){
      if(confirm('Taklif o‘chirilsinmi?')){
        check(await DB.from('play_posts').delete().eq('id',id));
        await community()
      }
    }
    else if(act==='chooseChat')await chooseChat();
    else if(act==='chatStart'){
      close();
      S.chatId=id;
      await go('chat')
    }
    else if(act==='chatSelect')await conversation(id);
    else if(act==='startChat'){
      if(!requireUser())return;
      S.chatId=id;
      await go('chat')
    }
    else if(act==='badgeRequest')badgeRequest();
    else if(act==='permit'){
      if(!('Notification'in window))
        throw Error('Brauzeringiz qo‘llamaydi');
      toast(await Notification.requestPermission())
    }
    else if(act==='markRead'){
      check(await DB.from('notifications')
        .update({is_read:true}).eq('user_id',S.u.id));
      await notificationCount();
      await notifications()
    }
    else if(act==='admin')await admin();
    else if(act==='adminAction')
      await adminAction(a.dataset.cmd,id);
    else if(act==='logout'){
      check(await DB.auth.signOut());
      close();
      await refreshUser();
      await go('home')
    }
  }catch(err){
    console.error(err);
    toast(err.message)
  }
});

// QIDIRUV VA TIL
window.addEventListener('input',ev=>{
  if(ev.target.id==='search'){
    S.query=ev.target.value;
    filterMods()
  }else if(ev.target.id==='accountSearch'){
    filterAccounts()
  }
});
window.addEventListener('change',async ev=>{
  if(ev.target.id==='category'){
    S.category=ev.target.value;
    filterMods()
  }else if(ev.target.id==='language'){
    S.lang=ev.target.value;
    localStorage.setItem('mw_lang',S.lang);
    close();
    document.documentElement.lang=S.lang;
    document.querySelectorAll('[data-tr]').forEach(
      x=>x.textContent=t(x.dataset.tr)
    );
    await go(S.page,S.profileId)
  }
});

// FORMALAR
window.addEventListener('submit',async ev=>{
  let f=ev.target;
  if(![
    'authForm','editProfileForm','modForm','inviteForm',
    'msgForm','badgeForm','reportForm','commentForm'
  ].includes(f.id))return;
  ev.preventDefault();
  let button=f.querySelector('button[type="submit"],button.btn');
  if(button)button.disabled=true;
  try{
    if(f.id==='authForm')await submitAuth(f);
    else if(f.id==='editProfileForm')await saveProfile(f);
    else if(f.id==='modForm')await saveMod(f);
    else if(f.id==='inviteForm'){
      if(!requireUser())return;
      let x=new FormData(f);
      let date=new Date(x.get('date'));
      if(!(date>new Date()))
        throw Error('Kelajakdagi vaqtni tanlang');
      check(await DB.from('play_posts').insert({
        author_id:S.u.id,
        title:x.get('title'),
        game_version:x.get('version'),
        play_mode:x.get('mode'),
        details:x.get('details'),
        play_at:date.toISOString()
      }));
      close();
      await go('community')
    }
    else if(f.id==='msgForm'){
      if(!requireUser())return;
      check(await DB.from('messages').insert({
        sender_id:S.u.id,
        recipient_id:f.dataset.id,
        body:new FormData(f).get('body')
      }));
      f.reset();
      await conversation(f.dataset.id)
    }
    else if(f.id==='badgeForm'){
      if(!requireUser())return;
      check(await DB.from('verification_requests').insert({
        user_id:S.u.id,
        reason:new FormData(f).get('reason')
      }));
      close();
      toast(t('applied'))
    }
    else if(f.id==='reportForm'){
      if(!requireUser())return;
      check(await DB.from('reports').insert({
        reporter_id:S.u.id,
        target_kind:f.dataset.kind,
        target_id:f.dataset.id,
        reason:new FormData(f).get('reason')
      }));
      close();
      toast('Yuborildi')
    }
    else if(f.id==='commentForm'){
      if(!requireUser())return;
      check(await DB.from('comments').insert({
        mod_id:f.dataset.id,
        author_id:S.u.id,
        body:new FormData(f).get('body')
      }));
      f.reset();
      await comments(f.dataset.id)
    }
  }catch(err){
    console.error(err);
    toast(err.code==='23505'?'Bu username band':err.message)
  }finally{
    if(button)button.disabled=false
  }
});

$('#overlay').addEventListener('click',ev=>{
  if(ev.target.id==='overlay')close()
});
window.addEventListener('keydown',ev=>{
  if(ev.key==='Escape')close()
});

// KUZGI BARGLAR
function leaves(){
  for(let i=0;i<18;i++){
    let x=document.createElement('span');
    x.className='leaf';
    x.textContent=['🍂','🍁','🍃'][i%3];
    x.style.left=(i*59.3%100)+'%';
    x.style.animationDuration=(12+i%7*3)+'s';
    x.style.animationDelay=(-i*2.2)+'s';
    x.style.fontSize=(14+i%6*4)+'px';
    $('#leaves').append(x)
  }
}

// SAYTNI ISHGA TUSHIRISH
(async()=>{
  leaves();
  document.documentElement.lang=S.lang;
  document.querySelectorAll('[data-tr]').forEach(
    x=>x.textContent=t(x.dataset.tr)
  );
  await refreshUser();
  await go('home');
  DB.auth.onAuthStateChange(event=>{
    if(['SIGNED_IN','SIGNED_OUT'].includes(event)){
      setTimeout(async()=>{
        await refreshUser();
        await go('home')
      },0)
    }
  })
})().catch(err=>{
  $('#app').innerHTML='<div class="empty">'+e(err.message)+'</div>';
  console.error(err)
});
</script>

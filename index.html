
<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16211b">
<title>Minecraft World | Mods & Community</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="manifest" href="./manifest.webmanifest">
<script src="https://telegram.org/js/telegram-web-app.js?65" defer></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#101914;--panel:#1c2920;--panel2:#273429;
  --text:#f9f0db;--muted:#b3b9aa;--gold:#ffc078;
  --orange:#ed9652;--edge:#ffffff20;--red:#f28d7e;
  --green:#8dda9b
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(ellipse at top right,#3c3a25,transparent 52%),var(--bg);
  color:var(--text);font:15px/1.5 system-ui,Arial,sans-serif;
  min-height:100vh
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
button:disabled{opacity:.55;cursor:default}
h1,h2,h3{line-height:1.2}
h1{font-size:clamp(34px,6vw,64px);letter-spacing:-2px;margin:0 0 16px}
h2{margin:5px 0 14px}
a{color:var(--gold)}
.shell{
  max-width:1160px;margin:auto;padding:0 14px 130px;
  position:relative;z-index:2
}
.top{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;position:sticky;top:0;z-index:20;
  padding:15px;background:#1a2821ee;
  border:1px solid var(--edge);border-radius:0 0 20px 20px;
  backdrop-filter:blur(16px)
}
.logo{
  font-weight:950;letter-spacing:1px;background:none;
  color:var(--text);font-size:19px;text-align:left
}
.logo b{color:var(--orange)}
.head-actions{display:flex;gap:8px}
.iconbtn{
  background:#ffffff12;color:var(--text);
  border:1px solid var(--edge);padding:9px 12px;
  border-radius:12px;position:relative
}
.dot{
  background:#ee6b48;border-radius:50%;
  position:absolute;top:-3px;right:-3px;
  min-width:18px;font-size:11px
}
.hero{
  position:relative;overflow:hidden;margin:20px 0 25px;
  background:radial-gradient(circle at 85% 22%,#ba693f66,transparent 43%),
  linear-gradient(125deg,#283d2d,#57402c);
  border:1px solid #cc94566c;border-radius:26px;
  padding:53px 35px;box-shadow:0 25px 60px #0006
}
.hero h1 span{color:var(--gold)}
.hero p{max-width:530px;color:#e5dbca}
.autumn{
  position:absolute;right:8%;top:25%;
  font-size:110px;opacity:.35;transform:rotate(18deg)
}
.eyebrow{
  color:var(--gold);font-size:11px;font-weight:800;
  letter-spacing:2px;text-transform:uppercase
}
.btn{
  background:var(--orange);color:#281f15;border-radius:12px;
  padding:10px 16px;font-weight:850;display:inline-block
}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{
  background:#ffffff13;color:var(--text);
  border:1px solid var(--edge)
}
.btn.danger{background:#b34940;color:white}
.btn.small{font-size:12px;padding:7px 10px}
.admin-mod-row{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;min-height:49px;padding:11px 13px;margin:7px 0;
  gap:12px;border:1px solid var(--edge);border-radius:12px;
  background:#26382c;color:var(--text);text-align:left;
  font-size:15px;cursor:pointer
}
.admin-mod-row:hover,.admin-mod-row:focus-visible{
  border-color:var(--orange);background:#354637
}
.admin-mod-row .mod-name{font-weight:750;overflow-wrap:anywhere}
.admin-mod-row .mod-open{color:var(--gold);font-size:13px;white-space:nowrap}
.admin-review-actions{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}
.admin-review-actions .btn{font-size:14px;padding:11px 14px;min-height:43px}
.admin-preview-image{width:100%;max-height:270px;object-fit:contain;
  border-radius:12px;background:#15221a;margin-bottom:15px}
.admin-current-file{margin-top:7px;overflow-wrap:anywhere;font-size:13px}

/* Mod detail actions: full labels, readable targets and clear pending state. */
.mod-actions{gap:10px;align-items:stretch}
.mod-actions .btn{font-size:15px;padding:12px 15px;min-height:46px;line-height:1.3}
.mod-actions .btn:disabled{opacity:.65;cursor:not-allowed;filter:none}
.mod-review-message{font-size:14px;line-height:1.5;margin:12px 0}
@media(max-width:560px){.mod-actions .btn{flex:1 1 calc(50% - 10px);font-size:14px}}

.buttons{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:12px 0}
.bar{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;margin:25px 0 15px
}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}
.field{
  background:#15221a;color:var(--text);
  border:1px solid var(--edge);border-radius:10px;
  padding:11px;width:100%;outline:none
}
.field:focus{border-color:var(--orange)}
.filters input{flex:2;min-width:170px}
.filters select{flex:1;min-width:120px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}
.card{
  background:linear-gradient(130deg,#253127,#1a241d);
  border:1px solid var(--edge);border-radius:18px;
  overflow:hidden;min-width:0
}
.card:hover{border-color:#ffa85e70}
.art{
  height:180px;background:linear-gradient(125deg,#557944,#ad7940);
  display:grid;place-items:center;font-size:64px;
  position:relative;overflow:hidden
}
.art img{width:100%;height:100%;object-fit:cover}
.chip{
  position:absolute;left:10px;top:10px;
  background:#10221dbb;border:1px solid #ffffff50;
  border-radius:9px;font-size:11px;padding:4px 9px
}
.cardbody{padding:15px}
.cardbody h3{margin:3px 0 6px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.mini{font-size:12px}
.smalltext{font-size:13px}
.cardbody p{min-height:35px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.av{
  width:40px;height:40px;border-radius:50%;
  background:#73563c;display:inline-grid;place-items:center;
  overflow:hidden;flex-shrink:0;color:white;font-weight:800
}
.av.large{width:90px;height:90px;font-size:39px}
.av img{width:100%;height:100%;object-fit:cover}
.linkbtn{
  border:0;background:transparent;color:var(--gold);
  padding:0;font-weight:800;text-align:left;
  cursor:pointer;overflow-wrap:anywhere
}
.tick{
  background:#3b98f4;color:white;border-radius:50%;
  font-size:11px;margin-left:3px;padding:1px 5px
}
.banner{
  border:1px solid #c7916266;
  background:radial-gradient(circle at right,#8f5b3455,transparent 55%),#2c4231;
  border-radius:22px;padding:30px
}
.counters{display:flex;gap:8px;margin:20px 0}
.count{
  flex:1;min-width:0;text-align:center;
  border:1px solid var(--edge);background:#13231abb;
  color:var(--text);padding:12px 4px;border-radius:12px
}
.count b{display:block;font-size:25px}
.count span{font-size:12px}
.list{display:grid;gap:10px}
.item{
  border:1px solid var(--edge);
  background:var(--panel);border-radius:14px;padding:14px
}
.tabs{display:flex;gap:7px;margin:18px 0}
.tabs button{
  padding:9px 14px;border-radius:10px;
  background:#ffffff12;color:var(--muted)
}
.tabs button.on{background:var(--orange);color:#281f15}
.bottom{
  position:fixed;bottom:10px;left:50%;transform:translateX(-50%);
  display:grid;grid-template-columns:repeat(5,1fr);
  gap:4px;padding:7px;background:#1b2921f1;
  backdrop-filter:blur(18px);border:1px solid var(--edge);
  border-radius:21px;width:min(720px,calc(100% - 15px));
  z-index:20;box-shadow:0 12px 45px #0009
}
.bottom button{
  background:transparent;color:#b7bbaf;border-radius:12px;
  padding:7px 2px;font-size:11px;display:grid;place-items:center
}
.bottom button i{font-style:normal;font-size:25px}
.bottom button.on{background:#ec974f27;color:var(--gold)}
#leaves{
  position:fixed;inset:0;overflow:hidden;
  pointer-events:none;z-index:0
}
.leaf{
  position:absolute;top:-40px;opacity:.5;
  animation:fall linear infinite
}
@keyframes fall{
  to{transform:translate(80px,110vh) rotate(520deg)}
}
#overlay{
  display:none;position:fixed;inset:0;background:#000c;
  backdrop-filter:blur(8px);z-index:50;
  align-items:center;justify-content:center;padding:10px
}
#overlay.open{display:flex}
.dialog{
  width:min(750px,100%);max-height:93vh;overflow:auto;
  background:#1d2b22;border:1px solid #ffffff33;
  border-radius:20px;box-shadow:0 20px 80px #000a
}
.dialoghead{
  position:sticky;top:0;background:#25372bee;
  display:flex;justify-content:space-between;align-items:center;
  padding:13px 20px;border-bottom:1px solid var(--edge);z-index:2
}
.dialogbody{padding:20px}
.formgroup{margin:0 0 15px}
.formgroup label{
  display:block;font-size:13px;font-weight:800;margin:0 0 6px
}
.formgroup textarea{min-height:95px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.messages{
  max-height:400px;min-height:240px;overflow:auto;
  display:flex;flex-direction:column;gap:10px;padding:12px 0
}
.bubble{
  background:#344637;padding:10px 13px;border-radius:14px;
  max-width:78%;align-self:start;white-space:pre-wrap;
  overflow-wrap:anywhere
}
.bubble.mine{background:#98673e;align-self:end}
.bubble small{
  display:block;color:#e4d6c0;font-size:10px;text-align:right
}
.chatlayout{
  display:grid;grid-template-columns:230px minmax(0,1fr);gap:15px
}
.note{
  border-left:3px solid var(--gold);padding:12px;
  background:#fca34d14;border-radius:8px;
  color:#f7d4ae;margin:10px 0
}
.empty{
  text-align:center;padding:40px 15px;
  border:1px dashed #ffffff45;
  border-radius:17px;color:var(--muted)
}
#toast{
  position:fixed;top:80px;right:12px;z-index:100;
  background:#334e38;border:1px solid var(--orange);
  color:white;border-radius:12px;padding:10px 15px;
  display:none;max-width:350px
}
.wrap{overflow-wrap:anywhere;white-space:pre-wrap}
.divider{border-top:1px solid var(--edge);margin:16px 0}
.status{
  font-size:11px;border:1px solid var(--edge);
  border-radius:8px;padding:3px 6px;color:var(--gold)
}
.badgeStatus{color:var(--green)}
.footer{
  text-align:center;color:#829286;font-size:11px;margin:28px 0
}
@media(max-width:760px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chatlayout{grid-template-columns:1fr}
  .autumn{font-size:80px;right:-10px}
  .hero{padding:39px 23px}
}
@media(max-width:560px){
  .grid,.two{grid-template-columns:1fr}
  .logo{font-size:14px}
  .top{padding:10px}
  .iconbtn{padding:7px 9px}
  .hero h1{font-size:36px}
  .art{height:190px}
  .banner{padding:18px}
  .count b{font-size:20px}
  .count span{font-size:10px}
  .bottom button{font-size:9px}
  .bottom button i{font-size:22px}
}
@media(prefers-reduced-motion:reduce){
  .leaf{display:none}
}


/* Compact SVG layout — old neon theme removed. */
.svg-icon{display:inline-block;vertical-align:-.22em;flex:none}
.bottom button .navicon{display:grid;place-items:center}
.head-actions{align-items:center}
.logo{display:inline-flex;align-items:center;gap:10px}
.brand-icon{display:inline-grid;place-items:center;width:43px;height:43px}
.cardbody .row.mini{font-size:13px;gap:7px}
.cardbody .row.mini .svg-icon{color:#dbad65}
.admin-mod-row .mod-name{display:inline-flex;align-items:center;gap:10px}
.admin-review-actions .btn,.mod-actions .btn{min-height:44px}
@media(max-width:560px){
  .logo{font-size:12px;gap:6px}
  .brand-icon{width:34px;height:34px}
  .head-actions{gap:4px}
  #accountTop{font-size:0;min-width:41px}
  #accountTop .svg-icon{width:18px;height:18px}
}
.account-trigger{gap:8px}
.account-menu-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:15px}
.account-menu-head>span:first-child{display:flex;align-items:center;gap:10px}
.account-limit{color:#baff83;font-size:13px;font-weight:850;border:1px solid #baff8373;border-radius:99px;padding:5px 12px}
.account-list{display:grid;gap:9px;margin-bottom:18px}
.account-entry{display:flex;align-items:stretch;gap:6px;background:#152a32;border:1px solid #b4ffe02c;border-radius:16px;overflow:hidden}
.account-entry.active{border-color:#baff83a5;background:linear-gradient(120deg,#24443e,#162d34)}
.account-switch{display:flex;align-items:center;flex:1;gap:12px;border:0;background:transparent;color:var(--text);padding:13px;text-align:left;min-width:0}
.account-switch:hover{background:#baff8310}
.account-avatar{width:43px;height:43px;display:grid;place-items:center;border-radius:14px;background:#baff8322;color:#caff92;flex:none}
.account-label{flex:1;display:grid;gap:2px;min-width:0}
.account-label b{font-size:15px;overflow-wrap:anywhere}
.account-label small{font-size:12px;color:#b9cdc3}
.account-remove{background:transparent;color:#f4a2ad;border:0;padding:12px;display:grid;place-items:center}
.account-remove:hover{background:#f87d9233}
.account-footer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.account-full{display:flex;gap:10px;align-items:center;background:#f7a14b16;border:1px solid #f7ac6480;padding:12px;border-radius:12px;color:#f8cfaa;flex:1}
.account-note{font-size:12px;color:#abc5bc;line-height:1.6;margin:18px 0 0}
@media(max-width:560px){.account-menu-head strong{font-size:15px}}

.compact-hero{min-height:235px;padding:38px clamp(24px,5vw,58px);margin-bottom:17px}
.compact-hero h1{font-size:clamp(38px,5.2vw,58px);margin-bottom:11px}
.compact-hero .eyebrow{margin-bottom:13px}
.compact-hero p{margin:10px 0}
.compact-hero .buttons{margin-top:18px}
.discover-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-bottom:25px}
.stat-tile{display:flex;align-items:center;gap:10px;padding:15px 20px;background:linear-gradient(120deg,#18363b,#11252f);border:1px solid #baff833a;border-radius:17px;min-width:0}
.stat-tile .svg-icon{color:#baff83}
.stat-tile b{font-size:22px;line-height:1;white-space:nowrap}
.stat-tile span{font-size:12px;color:#a8c7ba}
.section-kicker{font-weight:850;letter-spacing:.16em;font-size:10px;color:#baff83}
.explore-bar{margin:8px 0 12px}
.explore-bar h2{margin:4px 0}
.discover-tabs button,.sort-tabs button{display:inline-flex;align-items:center;gap:7px;justify-content:center}
.search-wrap{flex:2;min-width:210px;position:relative;display:flex;align-items:center}
.search-wrap .svg-icon{position:absolute;left:15px;z-index:1;color:#adff9e}
.search-wrap input{padding-left:43px}
.filters select{flex:1;min-width:155px}
.quick-categories{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:10px 0 15px}
.category-chip{padding:8px 13px;border-radius:100px;background:#1b3038;border:1px solid #b2f4d63b;color:#d5e9df;font-weight:700;font-size:12px}
.category-chip.selected,.category-chip:hover{background:#baff8327;color:#d9ffb9;border-color:#baff83a0}
.results-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:11px 0 16px}
#resultsCount{font-size:13px;color:#b4d1c4}
.sort-tabs{margin:0}
.sort-tabs button{font-size:12px;min-height:35px;padding:7px 12px}
.load-more{text-align:center;margin:25px 0}
.wide-empty{grid-column:1/-1;padding:55px 20px;text-align:center}
.skeleton-card{height:305px;border-radius:20px;overflow:hidden;background:#152b34;border:1px solid #bbfbe020}
.skeleton-art{height:170px;background:linear-gradient(105deg,#26423e,#376458,#26423e);background-size:210% 100%;animation:worldSkeleton 1.4s infinite}
.skeleton-lines{height:95px;margin:20px;border-radius:12px;background:linear-gradient(105deg,#25433c,#385750,#25433c);background-size:210% 100%;animation:worldSkeleton 1.4s infinite}
@keyframes worldSkeleton{to{background-position-x:-210%}}
@media(max-width:630px){
 .stat-tile{padding:10px;flex-direction:column;gap:5px}
 .stat-tile b{font-size:19px}
 .stat-tile span{font-size:11px}
 .compact-hero{padding:31px 22px}
 .compact-hero h1{font-size:41px}
 .search-wrap{min-width:100%;flex:1}
 .filters select{min-width:130px}
 .discover-tabs{width:100%}
 .discover-tabs button{flex:1}
}
@media(prefers-reduced-motion:reduce){.skeleton-art,.skeleton-lines{animation:none}}

.art{isolation:isolate}.quick-save{position:absolute;right:12px;top:12px;z-index:2;
width:42px;height:42px;display:grid;place-items:center;border-radius:13px;
color:#effff5;background:#0c1f29d9;border:1px solid #b3ff9e85;backdrop-filter:blur(10px)}
.quick-save:hover,.quick-save.saved{background:#baff83;color:#17301c;
transform:scale(1.06)}
@media(max-width:560px){.quick-save{width:38px;height:38px}}
.admin-section{margin:13px 0;border:1px solid #a9edcb43;border-radius:15px;
background:#142a32;overflow:hidden}
.admin-section summary{cursor:pointer;padding:15px 17px;display:flex;
align-items:center;gap:10px;font-weight:830;color:#e9fff2;list-style:none}
.admin-section summary::-webkit-details-marker{display:none}
.admin-section summary span{margin-left:auto;background:#baff831d;
border:1px solid #baff8380;color:#caff9b;padding:2px 10px;border-radius:99px}
.admin-section[open]>summary{background:#baff8314;border-bottom:1px solid #baff8330}
.admin-section>.item{margin:10px}

/* Lightweight mod detail modal; avoid entire DOM replacement on reactions */
#overlay{backdrop-filter:blur(3px)}
#overlay .dialog{overscroll-behavior:contain}
.mod-detail{display:grid;gap:15px}
.mod-hero-art{height:205px;overflow:hidden;display:grid;place-items:center;
  background:#152a32;border-radius:16px;color:#baff83}
.mod-hero-art img{width:100%;height:100%;object-fit:cover}
.mod-headline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mod-headline h2{font-size:clamp(20px,3vw,29px);margin:0}
.mod-description{line-height:1.65;margin:0}
.mod-author{display:flex;align-items:center;gap:9px;min-height:32px}
.mod-comment-list{min-height:48px}
.mod-comments-head h3{margin:0}
.mod-toggle[aria-pressed="true"]{border-color:#baff83!important;
  color:#d7ffb7!important;background:#baff8329!important}
.mod-toggle:disabled{opacity:.8;cursor:wait}
.mod-loading{padding:15px;text-align:center}
.mod-loading .skeleton-art{height:195px;border-radius:14px;margin-bottom:12px}
@media(max-width:768px){#leaves{display:none}#overlay{backdrop-filter:none}}

.clickable-mod{cursor:pointer;touch-action:manipulation}
.clickable-mod .cardbody{cursor:pointer}
.clickable-mod .quick-save,.clickable-mod .linkbtn,.clickable-mod .buttons button{touch-action:manipulation}

/* AUTUMN CRAFT — lightweight Minecraft GUI */
:root{--bg:#17120f;--panel:#2a201a;--panel2:#33271e;--text:#f4e8d6;
--muted:#bea990;--gold:#eac16b;--orange:#c99649;--green:#d4ab65;--red:#cb6f62;--edge:#7555378c}
html{background:#17120f}
body{background:#17120f!important;color:var(--text)!important;
font-family:system-ui,-apple-system,'Segoe UI',sans-serif!important;letter-spacing:0!important}
body:before,.hero:after{display:none!important}
*{scroll-behavior:auto}
.top,.bottom,.dialog,.banner,.card,.item,.admin-section,.hero{
box-shadow:none!important;backdrop-filter:none!important}
.top{background:#261c16!important;border:2px solid #624832!important;border-radius:8px!important}
.logo{font-weight:900;letter-spacing:.035em;font-family:ui-monospace,Consolas,monospace}
.logo b{color:#f1cd79!important;text-shadow:none!important}
.brand-icon{background:#9b713b!important;color:#fff0bf!important;
border:2px solid #edca81!important;border-radius:3px!important;box-shadow:3px 3px 0 #100c09!important}
.hero,.compact-hero{background:linear-gradient(135deg,#2b2119,#422f1e)!important;
border:2px solid #84623b!important;border-radius:8px!important;
min-height:170px!important;padding:26px 28px!important}
.hero h1,.hero h1 span{color:#f5dc9c!important;text-shadow:none!important}
.hero h1{font-size:clamp(30px,4.8vw,48px)!important}
.hero p{color:#d1baa0!important;line-height:1.5!important}
.hero .autumn{opacity:.17!important;color:#ecc06e!important;filter:none!important}
.eyebrow{background:#3d291c!important;border:1px solid #a98752!important;
color:#dfb875!important;border-radius:3px!important}
.version-block{display:inline-flex;padding:7px 13px;margin-top:10px;

/* Lightweight autumn leaves: visible on phones and behind transparent overlay,

  height:100dvh!important;

}

  display:block!important;

  top:-42px;
  color:#d9a74d!important;
  opacity:.23!important;
  pointer-events:none!important;
  width:auto;
  height:auto;
  transform:translate3d(0,0,0);
  animation:autumnLeafFall var(--leaf-duration,20s) linear var(--leaf-delay,0s) infinite!important;
  will-change:transform;
}

  0%{transform:translate3d(0,-10vh,0) rotate(0deg)}

}

function hydrateIcons(root=document){
 const nodes=[];
 if(root.nodeType===1&&root.matches('[data-icon]:not([data-icon-ready])'))nodes.push(root);
 if(root.querySelectorAll)nodes.push(...root.querySelectorAll('[data-icon]:not([data-icon-ready])'));
 for(const node of nodes){node.setAttribute('data-icon-ready','1');node.innerHTML=ico(node.dataset.icon,Number(node.dataset.size)||20);}
}

function ux(text){
  return EXTRA_WORDS[S.lang]?.[text]||
    MORE_UI_TRANSLATIONS[S.lang]?.[text]||
    AUTUMN_UI_TEXT[S.lang]?.[text]||text;
}
const uiObserver = new MutationObserver(records=>{
  if(S.lang==='uz')return;
  for(const record of records){
    for(const node of record.addedNodes){
      if(node.nodeType===1)translateUi(node);
      else if(node.nodeType===3)translateTextNode(node);
    }
  }
});
function translateTextNode(n){
  const parent=n.parentElement;
  if(!parent||parent.closest('.bubble-body,.mod-description,.profile-bio,.linkbtn[data-act="user"],.saved-modal-row,.mod-content,.mod-title'))return;
  const v=n.nodeValue;
  const trim=v.trim();
  const translated=ux(trim);
  if(trim && trim!==translated)n.nodeValue=v.replace(trim,translated);
}
function translateUi(root){
  if(S.lang==='uz'||!root)return;
  if(root.nodeType===3){translateTextNode(root);return}
  if(root.nodeType!==1&&root.nodeType!==9)return;
  if(root.nodeType===1&&root.matches('input,textarea')&&root.hasAttribute('placeholder')){
    root.placeholder=ux(root.placeholder);
  }
  const walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  let t;while(t=walk.nextNode())translateTextNode(t);
  for(const item of root.querySelectorAll?.('input[placeholder],textarea[placeholder]')||[])
    item.placeholder=ux(item.placeholder);
}

async function go(page='home',id=null){
  const target=page==='profile'?(id||S.u?.id||null):id;
  const nav=++navigationSeq;
  S.page=page;
  S.profileId=target;
  document.querySelectorAll('[data-go]').forEach(x=>
    x.classList.toggle('on',x.dataset.go===page));
  const useCache=page==='community'||page==='profile';
  const key=screenKey(page,target);
  const cached=useCache?fastScreens.get(key):null;
  if(cached){
    $('#app').innerHTML=cached.html;
    translateUi($('#app'));
    if(Date.now()-cached.at<SCREEN_TTL)return;
  }else if(page==='home'){
    // homeShell() paints immediately without waiting for Supabase.
  }else if(page==='create'){
    create();return;
  }else if(page==='chat'){
    // chats() paints the inbox immediately, then loads messages.
  }else{
    fastLoadingShell(page,target);
  }
  try{
    if(page==='home')await home();
    else if(page==='profile')await profile(target);
    else if(page==='community')await community();
    else if(page==='chat'){await chats();await window.MWChat?.load?.();}
    else if(page==='create')create();
    else await home();
  }catch(err){
    console.error(err);
    if(nav!==navigationSeq||S.page!==page)return;
    if(!cached)$('#app').innerHTML=`<div class="empty">${e(err.message)}</div>`;
    toast(err.message);
  }
}
const FEED_CACHE_KEY='mw_public_feed_v4';
const FEED_TTL=5*60*1000;
let searchTimer=null, homeRequest=0;

const knownProfiles=new Map();
function setCachedProfiles(rows){
  const now=Date.now();
  for(const p of rows||[])if(p?.id)knownProfiles.set(p.id,{p,at:now});
}
async function users(ids){
  const distinct=[...new Set(ids.filter(Boolean))];
  const now=Date.now(), result={},missing=[];
  for(const id of distinct){
    const c=knownProfiles.get(id);
    if(c&&now-c.at<5*60*1000)result[id]=c.p;
    else missing.push(id);
  }
  if(missing.length){
    const r=await DB.from('profiles')
      .select('id,username,display_name,avatar_url,verified,verified_until,banned_permanently,banned_until,public_id')
      .in('id',missing.slice(0,200));
    check(r);
    setCachedProfiles(r.data);
    for(const p of r.data)result[p.id]=p;
  }
  return result;
}
function readFeedCache(){
  try{
    const cached=JSON.parse(localStorage.getItem(FEED_CACHE_KEY)||'null');
    if(cached&&Array.isArray(cached.items)&&
      Date.now()-cached.at<(navigator.onLine?FEED_TTL:7*24*60*60*1000))
      return cached;
  }catch{}
  return null;
}

async function home(){
  const request=++homeRequest;
  homeShell();
  // Switching tabs should not trigger a full network refresh every time.
  const hasMemory=feedLoaded&&feedLoadedOrder===S.sort;
  let cached=null;
  if(hasMemory){
    filterMods();
    if(Date.now()-feedLoadedAt<30000)return;
  }else{
    cached=readFeedCache();
    if(cached){
      S.feed=cached.items;
      S.hasMore=S.feed.length>=60;
      S.feedOffset=S.feed.length;
      setCachedProfiles(cached.profiles);
      S.cache=Object.fromEntries(cached.profiles.map(p=>[p.id,p]));
      filterMods();
    }
  }
  const query=DB.from('mods')
    .select('id,author_id,title,description,category,game_version,cover_path,status,likes_count,downloads_count,saves_count,comments_count,views_count,title_uz,title_ru,title_en,description_uz,description_ru,description_en,created_at')
    .eq('status','approved')
    .order(S.sort==='popular'?'likes_count':S.sort==='views'?'views_count':'created_at',{ascending:false}).limit(60);
  const savedPromise=S.homeView==='saved'?loadSavedIds():Promise.resolve();
  const [res,savedResult]=await Promise.allSettled([query,savedPromise]);
  if(S.page!=='home'||request!==homeRequest)return;
  if(res.status==='rejected'||res.value.error){
    if(!cached&&!hasMemory)throw (res.status==='rejected'?res.reason:res.value.error);
    toast('Ulanish sust. Oldingi modlar ko‘rsatildi.');
    return;
  }
  if(savedResult.status==='rejected')toast('Saqlangan modlarni olishda xato');
  S.feed=res.value.data||[];
  S.hasMore=S.feed.length===60;
  S.feedOffset=S.feed.length;
  feedLoaded=true;
  feedLoadedAt=Date.now();
  feedLoadedOrder=S.sort;
  if(S.homeView==='saved')await loadExtraSavedMods();
  filterMods();
  saveFeedCache();
  try{
    S.cache=await users(S.feed.map(m=>m.author_id));
    if(S.page==='home'&&request===homeRequest)filterMods();
    saveFeedCache();
  }catch(err){console.warn('Author profiles:',err)}
}

  if(!missing.length)return;

async function fetchMoreFeed(){
  if(S.loadingMore||!S.hasMore)return;
  S.loadingMore=true;
  const request=homeRequest;
  const from=S.feedOffset||0;
  try{
    const r=await DB.from('mods')
      .select('id,author_id,title,description,category,game_version,cover_path,status,likes_count,downloads_count,saves_count,comments_count,views_count,title_uz,title_ru,title_en,description_uz,description_ru,description_en,created_at')
      .eq('status','approved')
      .order(S.sort==='popular'?'likes_count':S.sort==='views'?'views_count':'created_at',{ascending:false})
      .range(from,from+59);
    check(r);
    if(S.page!=='home'||request!==homeRequest)return;
    const existing=new Set(S.feed.map(m=>m.id));
    S.feed.push(...r.data.filter(m=>!existing.has(m.id)));
    S.feedOffset=from+r.data.length;
    S.hasMore=r.data.length===60;
    S.visibleMods+=12;
    filterMods();
    const mp=await users(r.data.map(m=>m.author_id));
    Object.assign(S.cache,mp);
    if(S.page==='home'&&request===homeRequest)filterMods();
    saveFeedCache();
  }finally{S.loadingMore=false}
}

    (view!=='saved'||S.savedIds?.has(m.id))&&
    (!q||`${localModTitle(m)} ${localModDesc(m)} ${m.category}`.toLocaleLowerCase().includes(q))
  );

function getProfileData(id){

  if(recent&&Date.now()-recent.at<45000)return recent.promise;
  const promise=Promise.all([
    DB.from('profiles').select('*').eq('id',id).single(),
    DB.from('mods').select('id,author_id,title,description,category,game_version,cover_path,status,likes_count,downloads_count,comments_count,views_count,title_uz,title_ru,title_en,description_uz,description_ru,description_en,created_at')

      .eq('author_id',id).eq('status','approved'),
    DB.from('follows').select('follower_id',{count:'exact',head:true})

const ACCOUNT_STORE_KEY='mw_saved_accounts_v1';
const ACCOUNT_MAX=5;
// Saved accounts belong to this browser profile only. Never sync sessions
// to the public database or expose them to other users.
function savedAccounts(){
  try{
    const items=JSON.parse(localStorage.getItem(ACCOUNT_STORE_KEY)||'[]');
    if(!Array.isArray(items))return [];
    const seen=new Set();
    return items.filter(a=>{
      if(!a||typeof a.id!=='string'||!/^[0-9a-f-]{36}$/i.test(a.id)||
          typeof a.username!=='string'||typeof a.access_token!=='string'||
          typeof a.refresh_token!=='string'||seen.has(a.id))return false;
      seen.add(a.id);return true;
    }).slice(0,ACCOUNT_MAX);
  }catch{return []}
}
function writeAccounts(items){
  const clean=items.slice(0,ACCOUNT_MAX);
  try{
    const serialized=JSON.stringify(clean);
    localStorage.setItem(ACCOUNT_STORE_KEY,serialized);
    // Important for Telegram in-app browsers: a failed write must not
    // silently look like a successfully saved account.
    const reread=localStorage.getItem(ACCOUNT_STORE_KEY);
    if(reread!==serialized)throw Error('Storage did not persist account list');
    return true;
  }catch(error){
    console.warn('Saved accounts storage failed:',error);
    throw Error('Brauzer akkauntlarni saqlamadi. Brauzer xotirasi yoki maxfiy rejimni tekshiring.');
  }
}
function rememberAccount(session,username=''){
  const user=session?.user;
  if(!user?.id||!session?.access_token||!session?.refresh_token)return false;
  const entries=savedAccounts();
  const index=entries.findIndex(a=>a.id===user.id);
  if(index<0&&entries.length>=ACCOUNT_MAX)return false;
  const known=index>=0?entries[index]:null;
  const name=username||(S.me?.id===user.id?S.me.username:'')||
    known?.username||user.user_metadata?.username||'user';
  const item={id:user.id,username:String(name).toLowerCase(),
    access_token:session.access_token,refresh_token:session.refresh_token};
  if(index>=0)entries[index]=item;else entries.push(item);
  return writeAccounts(entries);
}
function forgetAccount(id){
  writeAccounts(savedAccounts().filter(a=>a.id!==id));
}

async function switchAccount(id){
  if(id===S.u?.id){close();return}
  const target=savedAccounts().find(a=>a.id===id);
  if(!target)throw Error('Bu akkaunt saqlanmagan');
  const {data:prior}=await DB.auth.getSession();
  if(prior?.session)rememberAccount(prior.session);
  let data=null,error=null;
  try{
    const result=await DB.auth.setSession({
      access_token:target.access_token,refresh_token:target.refresh_token
    });
    data=result.data;error=result.error;
  }catch(err){error=err}
  if(error||!data?.session||data.user?.id!==id){
    // Keep the username in the account menu; don't silently erase the
    // saved account because of an expired/rotated refresh token.
    if(prior?.session){
      const restored=await DB.auth.setSession({
        access_token:prior.session.access_token,
        refresh_token:prior.session.refresh_token
      });
      if(restored.error)console.warn('Previous session restore:',restored.error);
    }
    toast('@'+target.username+' uchun parol bilan qayta kiring.');
    authBox(false,true,target.username);
    return;
  }
  rememberAccount({...data.session,user:data.user||data.session.user},target.username);
  close();
  await refreshUser();
  await go('home');
  scheduleFastPrefetch();
  toast('@'+target.username+' akkauntiga o‘tildi');
}

async function submitAuth(f){
  const form=new FormData(f);
  const username=String(form.get('username')||'').trim().toLowerCase();
  const password=String(form.get('password')||'');
  const register=f.dataset.register==='true';
  const adding=f.dataset.adding==='true';
  if(adding&&savedAccounts().length>=ACCOUNT_MAX &&
      !savedAccounts().some(a=>a.username===username))
    throw Error('5 ta akkaunt limiti tugadi');
  if(!/^[a-z0-9_]{3,20}$/.test(username))
    throw Error('Username 3–20 ta: a–z, 0–9 yoki _');
  if(!password || new TextEncoder().encode(password).length>72)
    throw Error('Parol bo‘sh bo‘lmasin, 72 baytdan oshmasin');
  if(register){
    if([...password].length<8)
      throw Error('Parol kamida 8 belgidan iborat bo‘lsin');
    if(password!==form.get('password2'))
      throw Error('Parollar bir xil emas');
  }
  let response;
  try{
    response=await fetch(
      'https://ruovdgyfcucspffrvijh.supabase.co/functions/v1/username-auth',
      {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        credentials:'omit',
        cache:'no-store',
        body:JSON.stringify({
          action:register?'signup':'login',username,password
        })
      }
    );
  }catch{
    throw Error('Login serveri hali ishga tushmagan yoki ulanmagan');
  }
  const result=await response.json().catch(()=>({}));
  if(!response.ok)
    throw Error(result.error||'Login serveri javob bermadi');
  if(!result.access_token||!result.refresh_token)
    throw Error('Server sessiya qaytarmadi');
  const {data:previous}=await DB.auth.getSession();
  if(previous?.session)rememberAccount(previous.session);
  const {data:authResult,error}=await DB.auth.setSession({
    access_token:result.access_token,
    refresh_token:result.refresh_token
  });
  if(error)throw error;
  try{
    const session=authResult?.session&&{
      ...authResult.session,
      user:authResult.user||authResult.session.user
    };
    if(!rememberAccount(session,username))
      throw Error('5 ta akkaunt limiti tugadi yoki sessiya mavjud emas.');
    if(!savedAccounts().some(a=>a.id===session.user.id&&a.username===username))
      throw Error('Yangi akkaunt saqlanmadi. Qayta urinib ko‘ring.');
  }catch(err){
    // Don't leave the browser switched to a new account that wasn't saved.
    if(previous?.session){
      const restore=await DB.auth.setSession({
        access_token:previous.session.access_token,
        refresh_token:previous.session.refresh_token
      });
      if(restore.error)console.warn('Session rollback:',restore.error);
    }
    throw err;
  }
  await refreshUser();
  toast('@'+username+' akkaunti saqlandi!');
  if(adding){
    accountMenu(); // Show saved accounts immediately, not only the home page.
  }else{
    close();
    await go('home');
  }
  scheduleFastPrefetch();
}

async function refreshUser(){
  const previousId=S.u?.id;
  let s=await DB.auth.getUser();
  S.u=s.data?.user||null;
  if(previousId!==S.u?.id){
    invalidateProfileData();
    prefetchedFor=null;
    S.communityData=null;S.accountsAt=0;
    S.chatId=null;S.chatUnread=new Set();S.chatPeers=[];
    S.chatUsers={};S.worldUnread=0;S.worldPref=null;
    S.savedIds=new Set();
  }
  S.me=S.u?
    check(await DB.from('profiles').select('*')
      .eq('id',S.u.id).maybeSingle()):null;
  if(S.u){
    const {data:current}=await DB.auth.getSession();

async function upload(bucket,file,max,types=null){
  if(!file||!file.size)throw Error('Fayl tanlanmagan');
  if(file.size>max)throw Error('Fayl hajmi katta');
  if(types&&!types.includes(file.type))
    throw Error('Rasm turi noto‘g‘ri');
  let ext=file.name.split('.').pop().toLowerCase();
  if(bucket!=='mod-files'){
    ext={
      'image/png':'png','image/jpeg':'jpg',
      'image/webp':'webp','image/gif':'gif'
    }[file.type]
  }
  if(bucket==='mod-files'&&
    !['zip','jar','mcpack','mcaddon','mcworld','rar','7z']
      .includes(ext))
    throw Error('Noto‘g‘ri mod fayl turi');
  let path=`${S.u.id}/${crypto.randomUUID()}.${ext}`;
  check(await DB.storage.from(bucket).upload(path,file,{
    contentType:file.type||'application/octet-stream',
    upsert:false
  }));
  return path
}

async function saveMod(f){
  if(!requireUser())return;
  const adminEdit=f.dataset.admin==='true';
  if(adminEdit && (!S.me?.is_admin||S.me.username!=='admin'))
    throw Error('Faqat admin tahrirlay oladi');
  let x=new FormData(f),id=f.dataset.id,m=null;
  if(id){
    let query=DB.from('mods').select('*').eq('id',id);
    if(!adminEdit)query=query.eq('author_id',S.u.id);
    m=check(await query.single());
    if(adminEdit&&m.status!=='pending')
      throw Error('Bu mod endi tekshiruvda emas');
  }
  let image=x.get('image'),file=x.get('file');
  let cover_path=m?.cover_path||'',file_path=m?.file_path||'';
  if(image?.size){
    cover_path=await upload('covers',image,2097152,
      ['image/jpeg','image/png','image/webp','image/gif'])
  }
  if(file?.size){
    file_path=await upload('mod-files',file,10485760)
  }
  if(!cover_path||!file_path)throw Error('Rasm va fayl kerak');
  let data={
    title:String(x.get('title')).trim(),
    description:String(x.get('description')).trim(),
    title_uz:String(x.get('title')).trim(),
    description_uz:String(x.get('description')).trim(),
    title_ru:String(x.get('title_ru')||'').trim()||null,
    description_ru:String(x.get('description_ru')||'').trim()||null,
    title_en:String(x.get('title_en')||'').trim()||null,
    description_en:String(x.get('description_en')||'').trim()||null,
    category:x.get('category'),
    game_version:x.get('version'),
    cover_path,file_path
  };
  if(data.title.length<3||data.description.length<10)
    throw Error('Mod nomi yoki tavsifi juda qisqa');
  if(m){
    let query=DB.from('mods').update(data).eq('id',id);
    if(adminEdit)query=query.eq('status','pending');
    else query=query.eq('author_id',S.u.id);
    const updated=check(await query.select('id'));
    if(!updated?.length)throw Error('Mod yangilanmadi. Sahifani qayta oching');
  }else{
    check(await DB.from('mods').insert({...data,author_id:S.u.id}));
  }
  toast(adminEdit?'Mod tahrirlandi':t('pending'));
  close();
  invalidateProfileData();feedLoadedAt=0;feedLoaded=false;
  if(adminEdit)await adminModDetail(id);
  else await go('profile',S.u.id)
}

async function getMod(id){

  const load=(async()=>{

      .select('id,author_id,title,description,category,game_version,cover_path,status,likes_count,downloads_count,saves_count,comments_count,views_count,title_uz,title_ru,title_en,description_uz,description_ru,description_en,created_at')
      .eq('id',id).single();

  })().finally(()=>modOpenPending.delete(id));
  modOpenPending.set(id,load);
  return load;
}

async function toggleCommentLike(id){
  if(!requireUser()||commentBusy.has(id))return;
  const button=document.querySelector('.comment-like[data-id="'+id+'"]');
  if(!button)return;
  commentBusy.add(id);button.disabled=true;
  const was=button.getAttribute('aria-pressed')==='true';
  const label=button.querySelector('span');
  const oldCount=Number(label?.textContent||0);
  button.setAttribute('aria-pressed',String(!was));
  button.classList.toggle('liked',!was);
  if(label)label.textContent=String(Math.max(0,oldCount+(was?-1:1)));
  try{
    const query=was?DB.from('comment_likes').delete()
      .eq('comment_id',id).eq('user_id',S.u.id):
      DB.from('comment_likes').insert({comment_id:id,user_id:S.u.id});
    check(await query);
  }catch(err){
    button.setAttribute('aria-pressed',String(was));
    button.classList.toggle('liked',was);
    if(label)label.textContent=String(oldCount);
    throw err;
  }finally{
    commentBusy.delete(id);if(button.isConnected)button.disabled=false;
  }
}
const modToggleLocks=new Set();
async function toggleTable(table,id,detail=true){
  if(!requireUser())return;
  const key=table+':'+id;
  if(modToggleLocks.has(key))return;
  modToggleLocks.add(key);
  const type=table==='mod_likes'?'like':'save';
  const btnEl=detail?document.querySelector('#overlay [data-mod-toggle="'+type+'"]'):null;
  const former=btnEl?.getAttribute('aria-pressed')==='true';
  if(btnEl){
    btnEl.disabled=true;
    btnEl.setAttribute('aria-pressed',String(!former));
  }
  try{
    const r=await DB.from(table).select('mod_id')
      .eq('mod_id',id).eq('user_id',S.u.id).maybeSingle();
    check(r);
    const current=!!r.data;
    check(current?
      await DB.from(table).delete().eq('mod_id',id).eq('user_id',S.u.id):
      await DB.from(table).insert({mod_id:id,user_id:S.u.id})
    );
    const m=getCachedMod(id);
    if(m){
      const field=type==='like'?'likes_count':'saves_count';
      m[field]=Math.max(0,(m[field]||0)+(current?-1:1));
      if(btnEl?.isConnected){
        const label=btnEl.querySelector('span');
        if(label)label.textContent=(type==='like'?'Like':'Saqlash')+' · '+count(m[field]);
      }
    }
    if(table==='mod_saves'){
      if(current)S.savedIds?.delete(id);else S.savedIds?.add(id);
      // Do not rerender the grid while the modal is open.
      const quick=document.querySelector('.quick-save[data-id="'+CSS.escape(id)+'"]');
      quick?.classList.toggle('saved',!current);
    }
    if(btnEl?.isConnected)btnEl.setAttribute('aria-pressed',String(!current));

async function community(){
  const request=++communityReq;
  const tab=S.tab;
  const uid=S.u?.id||null;
  const stillHere=()=>S.page==='community'&&S.tab===tab&&communityReq===request;
  if(tab==='play'){
    communityShell(tab);
    const old=S.communityData;
    if(old?.uid===uid&&Date.now()-old.at<COMMUNITY_TTL){
      renderCommunityPlays(old.posts,old.joined,old.people);
      saveScreen('community',null);
      return;
    }
    const [postsResult,joinsResult]=await Promise.all([
      DB.from('play_posts')
        .select('id,author_id,title,details,game_version,play_mode,play_at,joins_count')
        .order('play_at',{ascending:true}).limit(40),
      uid?DB.from('play_joins').select('play_id').eq('user_id',uid):
        Promise.resolve({data:[]})
    ]);
    check(postsResult);check(joinsResult);
    if(!stillHere())return;
    const posts=postsResult.data||[];
    const joined=new Set((joinsResult.data||[]).map(x=>x.play_id));
    const ids=posts.map(x=>x.author_id);
    const people=cachedPeople(ids);
    S.communityData={uid,at:Date.now(),posts,joined,people};
    renderCommunityPlays(posts,joined,people);
    saveScreen('community',null);
    if(ids.length){
      users(ids).then(mp=>{
        if(!stillHere())return;
        Object.assign(S.communityData.people,mp);
        renderCommunityPlays(posts,joined,S.communityData.people);
        saveScreen('community',null);
      }).catch(console.warn);
    }
  }else{
    communityShell(tab);
    if(S.accounts&&S.accountsAt&&Date.now()-S.accountsAt<COMMUNITY_TTL){
      filterAccounts();saveScreen('community',null);return;
    }
    const r=await DB.from('profiles')
      .select('id,username,avatar_url,public_id,verified,verified_until,display_name,bio,banned_permanently,banned_until')
      .order('public_id',{ascending:false}).limit(80);
    check(r);
    if(!stillHere())return;
    S.accounts=r.data;
    S.accountsAt=Date.now();
    setCachedProfiles(r.data);
    filterAccounts();
    saveScreen('community',null);
  }
}

let pendingWorldPref=null;
async function worldPref(){
  if(S.worldPref)return S.worldPref;
  const uid=S.u?.id;
  if(!uid)return {joined:false,muted:true,last_seen_at:new Date().toISOString()};
  if(pendingWorldPref?.id===uid)return pendingWorldPref.promise;
  const request=(async()=>{
    const {data,error}=await DB.from('world_chat_settings')
      .select('joined,muted,last_seen_at').eq('user_id',uid).maybeSingle();
    if(error)throw error;
    const pref=data||{joined:true,muted:false,
      last_seen_at:S.me?.created_at||new Date().toISOString()};
    if(S.u?.id===uid)S.worldPref=pref;
    return pref;
  })().finally(()=>{if(pendingWorldPref?.id===uid)pendingWorldPref=null});
  pendingWorldPref={id:uid,promise:request};
  return request;
}

async function chats(){
  if(!requireUser()){$('#app').innerHTML=blank();return}
  const request=++chatListRequest;
  const owner=S.u.id;
  S.chatUnread=S.chatUnread||new Set();
  S.chatId=S.chatId||'world';
  // Paint the inbox and active thread without waiting for the database.
  $('#app').innerHTML=`
    <div class="bar chat-title">
      <h2>${ico('chat',24)} Xabarlar</h2>
      <button class="btn small" data-act="chooseChat">${ico('plus',20)} Yangi chat</button>
    </div>
    <section class="chatlayout">
      <aside class="chatlist" id="chatRows"></aside>
      <div class="chat-window" id="conversation"></div>
    </section>`;
  chatRows();
  updateChatBadge();
  const selected=S.chatId;
  const thread=selected==='world'?worldConversation():selected.startsWith('g:')?Promise.resolve():conversation(selected);
  const [messages,pref]=await Promise.all([
    DB.from('messages').select('sender_id,recipient_id,created_at')
      .or(`sender_id.eq.${owner},recipient_id.eq.${owner}`)
      .order('created_at',{ascending:false}).limit(55),
    worldPref()
  ]);
  check(messages);
  if(S.page!=='chat'||S.u?.id!==owner||request!==chatListRequest)return;
  S.mwDirectTimes={};for(const m of messages.data){const id=m.sender_id===owner?m.recipient_id:m.sender_id;if(id&&!S.mwDirectTimes[id])S.mwDirectTimes[id]=new Date(m.created_at).getTime()}
  const peers=[...new Set(messages.data.map(m=>m.sender_id===owner?m.recipient_id:m.sender_id))]
    .filter(id=>id&&id!==owner);
  if(S.chatId&&S.chatId!=='world'&&!S.chatId.startsWith('g:')&&!peers.includes(S.chatId))peers.unshift(S.chatId);
  S.chatPeers=peers;
  for(const m of messages.data){
    if(m.recipient_id===owner&&S.chatId!==m.sender_id&&
      new Date(m.created_at)>new Date(chatSeen(m.sender_id)))S.chatUnread.add(m.sender_id);
  }
  chatRows();
  updateChatBadge();
  users(peers).then(mp=>{
    if(S.page!=='chat'||request!==chatListRequest)return;
    S.chatUsers={...(S.chatUsers||{}),...mp};
    chatRows();
  }).catch(console.warn);
  await thread;
}

      .order('created_at',{ascending:false}).limit(55)

  }
  S.worldUnread=0;
  worldUpdate({last_seen_at:new Date().toISOString()}).catch(console.warn);

async function onIncomingDirect(msg){
  if(!S.u||msg.sender_id===S.u.id)return;
  const sender=msg.sender_id;
  if(S.page==='chat'&&!S.chatPeers?.includes(sender)){
    S.chatPeers=[sender,...(S.chatPeers||[])];
    users([sender]).then(mp=>{
      S.chatUsers={...(S.chatUsers||{}),...mp};
      chatRows();
    }).catch(console.warn);
  }
  if(S.page==='chat'&&S.chatId===sender&&$('#msgs')){
    $('#msgs').insertAdjacentHTML('beforeend',chatBubble(msg.body,false,chatTime(msg.created_at),
      `<button class="linkbtn" data-act="reportMsg" data-id="${e(msg.id)}">${ico('flag',12)}</button>`));
    const container=$('#msgs');container.scrollTop=container.scrollHeight;
    markChatSeen(sender);
  }else{
    S.chatUnread=S.chatUnread||new Set();
    S.chatUnread.add(sender);
    updateChatBadge();
  }
  // Personal-message notifications come from the notifications trigger;
  // avoid displaying the same browser notification twice.
}
async function onIncomingWorld(msg){
  if(!S.u||msg.author_id===S.u.id)return;
  if(S.worldPref?.joined===false)return;
  if(S.page==='chat'&&S.chatId==='world'&&$('#msgs')){
    const mp=await users([msg.author_id]);
    if(S.chatId!=='world'||!$('#msgs'))return;
    const p=mp[msg.author_id];
    $('#msgs').insertAdjacentHTML('beforeend',`<div class="world-message">
      <button class="linkbtn" data-act="user" data-id="${e(msg.author_id)}">
      ${avatar(p)} ${label(p)}</button>
      ${chatBubble(msg.body,false,chatTime(msg.created_at),
        `<button class="linkbtn" data-act="reportUser" data-id="${e(msg.author_id)}"
        title="Shikoyat">${ico('flag',12)}</button>`)}
    </div>`);
    const container=$('#msgs');container.scrollTop=container.scrollHeight;
    S.worldUnread=0;
    worldUpdate({last_seen_at:new Date().toISOString()}).catch(console.warn);
  }else if(!S.worldPref?.muted){
    S.worldUnread=Math.min(99,(S.worldUnread||0)+1);
    updateChatBadge();
  }
  if(!S.worldPref?.muted&&notificationEnabled()&&document.visibilityState==='hidden'&&
     'Notification'in window&&Notification.permission==='granted')
    new Notification('Umumiy chat',{body:msg.body.slice(0,120)});
}
function listen(){
  if(S.channel){DB.removeChannel(S.channel);S.channel=null}
  if(!S.u)return;
  S.channel=DB.channel('world-'+S.u.id)
    .on('postgres_changes',{event:'INSERT',schema:'public',
      table:'notifications',filter:`user_id=eq.${S.u.id}`},p=>{
      notificationCount();
      if(notificationEnabled())toast(p.new.title);
      if(notificationEnabled()&&document.visibilityState==='hidden'&&
        'Notification'in window&&Notification.permission==='granted')
        new Notification(p.new.title,{body:p.new.body});
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',
      table:'messages',filter:`recipient_id=eq.${S.u.id}`},
      p=>{onIncomingDirect(p.new).catch(console.warn)})
    .on('postgres_changes',{event:'INSERT',schema:'public',
      table:'world_chat_messages'},
      p=>{onIncomingWorld(p.new).catch(console.warn)})
    .subscribe();
}

window.addEventListener('click',async event=>{

  try{
    if(a.dataset.go){
      close();
      if(a.dataset.go==='home')S.homeView='all';
      await go(a.dataset.go);
      return
    }
    let act=a.dataset.act,id=a.dataset.id;
    if(act==='close')close();
    else if(act==='self')
      S.u?await go('profile',S.u.id):authBox();
    else if(act==='auth')authBox();
    else if(act==='authSwitch')
      authBox(a.dataset.register==='true',a.dataset.adding==='true');
    else if(act==='accounts')accountMenu();
    else if(act==='accountAdd'){
      if(savedAccounts().length>=ACCOUNT_MAX)
        throw Error('5 ta akkaunt limiti tugadi');
      authBox(false,true);
    }
    else if(act==='accountSwitch')await switchAccount(id);
    else if(act==='accountRemove'){
      forgetAccount(id);
      accountMenu();
    }
    else if(act==='accountProfile'){
      close();
      if(S.u)await go('profile',S.u.id);
      else authBox();
    }
    else if(act==='user'){
      close();
      await go('profile',id)
    }
    else if(act==='mod')await openMod(id);
    else if(act==='settings')settings();
    else if(act==='notificationToggle')toggleNotifications();
    else if(act==='savedFromSettings')await savedModal();
    else if(act==='notifications')await notifications();
    else if(act==='sort'){
      S.sort=a.dataset.sort;
      S.visibleMods=12;
      await home();
    }
    else if(act==='homeView'){
      if(a.dataset.view==='saved'&&!S.u){authBox();return}
      S.homeView=a.dataset.view;
      S.visibleMods=12;
      document.querySelectorAll('[data-view]').forEach(x=>
        x.classList.toggle('on',x.dataset.view===S.homeView));
      if(S.homeView==='saved'){
        await loadSavedIds();
        await loadExtraSavedMods();
      }
      filterMods();
    }
    else if(act==='focusMods'){
      document.getElementById('exploreMods')?.scrollIntoView({behavior:'smooth',block:'start'});
    }
    else if(act==='allCategories'){
      S.categoriesExpanded=!S.categoriesExpanded;
      const action=document.querySelector('[data-act="allCategories"]');
      if(action)action.innerHTML=(S.categoriesExpanded?ux('Kamroq ko‘rsatish'):ux('Barchasini ko‘rish'))+' '+ico('arrow',17);
      refreshFeedCounters();
    }
    else if(act==='quickCategory'){
      S.category=a.dataset.category;
      const category=$('#category');
      if(category)category.value=S.category;
      S.visibleMods=12;
      filterMods();
    }
    else if(act==='moreMods'){
      const total=S.feed.filter(m=>
        (S.category==='all'||m.category===S.category)&&
        (!S.gameVersion||S.gameVersion==='all'||m.game_version===S.gameVersion)&&
        (!S.query||`${m.title} ${m.description}`.toLowerCase().includes(S.query.toLowerCase()))
      ).length;
      if(S.visibleMods>=total&&S.hasMore)await fetchMoreFeed();
      else{S.visibleMods+=12;filterMods()}
    }
    else if(act==='follow')await toggleFollow(id);
    else if(act==='posts')
      $('#profileMods')?.scrollIntoView({behavior:'smooth'});
    else if(act==='followers'||act==='following')
      await followList(act,id);
    else if(act==='editProfile')editProfile();
    else if(act==='editMod')await editMod(id);
    else if(act==='adminModDetail')
      await adminModDetail(id,true);
    else if(act==='adminEditMod')await adminEditMod(id);
    else if(act==='removeMod')await removeMod(id);
    else if(act==='like')await toggleTable('mod_likes',id);
    else if(act==='commentLike')await toggleCommentLike(id);
    else if(act==='saveMod')await toggleTable('mod_saves',id);
    else if(act==='quickSave')await toggleTable('mod_saves',id,false);
    else if(act==='download')await download(id);
    else if(act==='reportMod')report('mod',id);
    else if(act==='reportUser')report('profile',id);
    else if(act==='reportMsg')report('message',id);
    else if(act==='removeComment'){
      if(confirm('Izoh o‘chirilsinmi?')){
        check(await DB.from('comments').delete().eq('id',id));
        await comments($('#commentList').dataset.mod)
      }
    }
    else if(act==='tab'){
      S.tab=a.dataset.tab;
      await community();
    }
    else if(act==='invite')inviteBox();
    else if(act==='join'){
      if(!requireUser())return;
      check(await DB.from('play_joins').insert({
        play_id:id,user_id:S.u.id
      }));
      toast('Taklifga qo‘shildingiz. Qatnashchilarga xabar yuborildi.');
      S.communityData=null;clearScreenCache();
      await community();
    }
    else if(act==='leavePlay'){
      if(!requireUser())return;
      check(await DB.from('play_joins').delete()
        .eq('play_id',id).eq('user_id',S.u.id));
      S.communityData=null;clearScreenCache();
      await community();
    }
    else if(act==='playMembers')await playMembers(id);
    else if(act==='removeInvite'){
      if(confirm('Taklif o‘chirilsinmi?')){
        check(await DB.from('play_posts').delete().eq('id',id));
        await community()
      }
    }
    else if(act==='chooseChat')chooseChat();
    else if(act==='worldOpen')await worldConversation();
    else if(act==='worldJoin'){
      await worldUpdate({joined:true});
      await worldConversation();
    }
    else if(act==='worldLeave'){
      if(!confirm('Umumiy chatdan chiqmoqchimisiz?'))return;
      await worldUpdate({joined:false});
      await worldConversation();
    }
    else if(act==='worldMute'){
      await worldUpdate({muted:!S.worldPref.muted});
      await worldConversation();
    }
    else if(act==='chatStart'){
      close();
      S.chatId=id;
      await go('chat')
    }
    else if(act==='chatSelect')await conversation(id);
    else if(act==='startChat'){
      if(!requireUser())return;
      S.chatId=id;
      await go('chat')
    }
    else if(act==='badgeRequest')badgeRequest();
    else if(act==='permit'){
      if(!('Notification'in window))
        throw Error('Brauzeringiz qo‘llamaydi');
      toast(await Notification.requestPermission())
    }
    else if(act==='markRead'){
      check(await DB.from('notifications')
        .update({is_read:true}).eq('user_id',S.u.id));
      await notificationCount();
      await notifications()
    }
    else if(act==='installApp')await installApp();
    else if(act==='admin')await admin();
    else if(act==='adminAction')
      await adminAction(a.dataset.cmd,id);
    else if(act==='logout'){
      if(!confirm('Akkauntdan chiqmoqchimisiz?'))return;
      const leaving=S.u?.id;
      check(await DB.auth.signOut({scope:'local'}));
      if(leaving)forgetAccount(leaving);
      close();
      await refreshUser();
      await go('home')
    }
  }catch(err){
    console.error(err);
    toast(err.message)
  }
});

window.addEventListener('change',async ev=>{
  if(ev.target.matches('.file-picker input[type="file"]')){
    const x=ev.target;
    const label=document.getElementById('pick-label-'+x.name);
    if(label&&x.files?.[0])label.textContent=x.files[0].name;

      }

// FORMALAR
window.addEventListener('submit',async ev=>{
  let f=ev.target;
  if(![
    'authForm','editProfileForm','modForm','inviteForm',
    'msgForm','worldMsgForm','badgeForm','reportForm','commentForm'
  ].includes(f.id))return;
  ev.preventDefault();
  let button=f.querySelector('button[type="submit"],button.btn');
  if(button)button.disabled=true;
  try{
    if(f.id==='authForm')await submitAuth(f);
    else if(f.id==='editProfileForm')await saveProfile(f);
    else if(f.id==='modForm')await saveMod(f);
    else if(f.id==='inviteForm'){
      if(!requireUser())return;
      let x=new FormData(f);
      let date=new Date(x.get('date'));
      if(!(date>new Date()))
        throw Error('Kelajakdagi vaqtni tanlang');
      check(await DB.from('play_posts').insert({
        author_id:S.u.id,
        title:x.get('title'),
        game_version:x.get('version'),
        play_mode:x.get('mode'),
        details:x.get('details'),
        play_at:date.toISOString()
      }));
      close();
      S.communityData=null;clearScreenCache();
      await go('community')
    }
    else if(f.id==='msgForm'){
      if(!requireUser())return;
      const text=String(new FormData(f).get('body')||'').trim();
      if(!text)return;
      const result=check(await DB.from('messages').insert({
        sender_id:S.u.id,recipient_id:f.dataset.id,body:text
      }).select('id,body,created_at').single());
      f.reset();
      const msgs=$('#msgs');
      if(msgs&&S.chatId===f.dataset.id){
        msgs.insertAdjacentHTML('beforeend',chatBubble(result.body,true,chatTime(result.created_at)));
        msgs.scrollTop=msgs.scrollHeight;
      }
      markChatSeen(f.dataset.id);
      if(!S.chatPeers?.includes(f.dataset.id)){
        S.chatPeers=[f.dataset.id,...(S.chatPeers||[])];
        const mp=await users([f.dataset.id]);
        S.chatUsers={...S.chatUsers,...mp};
        chatRows();
      }
    }
    else if(f.id==='worldMsgForm'){
      if(!requireUser()||S.worldPref?.joined===false)return;
      const text=String(new FormData(f).get('body')||'').trim();
      if(!text)return;
      const result=check(await DB.from('world_chat_messages').insert({
        author_id:S.u.id,body:text
      }).select('id,author_id,body,created_at').single());
      f.reset();
      const msgs=$('#msgs');
      if(msgs&&S.chatId==='world'){
        msgs.insertAdjacentHTML('beforeend',`<div class="world-message">
          ${chatBubble(result.body,true,chatTime(result.created_at))}</div>`);
        msgs.scrollTop=msgs.scrollHeight;
      }
      worldUpdate({last_seen_at:new Date().toISOString()}).catch(console.warn);
    }
    else if(f.id==='badgeForm'){
      if(!requireUser())return;
      check(await DB.from('verification_requests').insert({
        user_id:S.u.id,
        reason:new FormData(f).get('reason')
      }));
      close();
      toast(t('applied'))
    }
    else if(f.id==='reportForm'){
      if(!requireUser())return;
      check(await DB.from('reports').insert({
        reporter_id:S.u.id,
        target_kind:f.dataset.kind,
        target_id:f.dataset.id,
        reason:new FormData(f).get('reason')
      }));
      close();
      toast('Yuborildi')
    }
    else if(f.id==='commentForm'){
      if(!requireUser())return;
      check(await DB.from('comments').insert({
        mod_id:f.dataset.id,
        author_id:S.u.id,
        body:new FormData(f).get('body')
      }));
      f.reset();
      await comments(f.dataset.id)
    }
  }catch(err){
    console.error(err);
    toast(err.code==='23505'?'Bu username band':err.message)
  }finally{
    if(button)button.disabled=false
  }
});

// KUZGI BARGLAR
function leaves(){
  const layer=$('#leaves');
  if(!layer)return;
  layer.replaceChildren();
  const count=window.matchMedia('(max-width:760px)').matches?6:10;
  const frag=document.createDocumentFragment();
  const leafSvg='<svg viewBox="0 0 32 32" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">'+
    '<path fill="currentColor" d="M16 2 20 9l5-2-2 6 6 4-7 3 1 6-7-3-7 3 1-6-7-3 6-4-2-6 5 2Z"/>'+
    '<path d="M16 12v17" fill="none" stroke="#88521f" stroke-width="1.2"/></svg>';
  for(let i=0;i<count;i++){
    const el=document.createElement('span');
    const size=15+i%4*4;
    el.className='leaf';
    el.innerHTML=leafSvg;
    el.style.left=((i*41+12)%100)+'%';
    el.style.width=size+'px';
    el.style.height=size+'px';
    el.style.setProperty('--leaf-drift',((i%2?1:-1)*(30+i%3*15))+'px');
    el.style.setProperty('--leaf-spin',(i%2?-1:1)*(190+i%4*70)+'deg');
    el.style.setProperty('--leaf-duration',(21+i%6*3)+'s');
    el.style.setProperty('--leaf-delay',(-i*4.7)+'s');
    frag.appendChild(el);
  }
  layer.append(frag);
}

(async()=>{
  hydrateIcons();
  leaves();
  document.documentElement.lang=S.lang;
  document.querySelectorAll('[data-tr]').forEach(
    x=>x.textContent=t(x.dataset.tr)
  );
  uiObserver.observe($('#app'),{childList:true,subtree:true});
  uiObserver.observe($('#overlay'),{childList:true,subtree:true});
  await Promise.allSettled([go('home'),refreshUser()]);
  scheduleFastPrefetch();
  const deepId=new URLSearchParams(location.search).get('mod');
  if(deepId&&/^[0-9a-f-]{36}$/i.test(deepId)){
    openMod(deepId).catch(err=>console.warn('Mod havolasi:',err));
  }
  // Supabase may emit SIGNED_IN again when the browser tab regains focus.
  // Update account data without forcing the user back to the home screen.
  DB.auth.onAuthStateChange((event,session)=>{
    if((event==='TOKEN_REFRESHED'||event==='SIGNED_IN')&&session){
      try{rememberAccount(session)}catch(error){console.warn('Account autosave:',error)}
    }
    if(event==='SIGNED_IN' && session?.user?.id!==S.u?.id){
      setTimeout(()=>refreshUser().catch(console.error),0);
    }else if(event==='SIGNED_OUT' && S.u){
      setTimeout(async()=>{
        try{
          await refreshUser();
          if(S.page!=='home')await go('home');
        }catch(err){console.error(err)}
      },0);
    }
  })
})().catch(err=>{
  $('#app').innerHTML='<div class="empty">'+e(err.message)+'</div>';
  console.error(err)
});

<style>
:root{
  --bg:#0c1b2c;--panel:#102338;--panel2:#172f46;
  --text:#e1f2fc;--muted:#96c7e5;--gold:#addaf4;
  --orange:#77a7c7;--edge:#ffffff20;--red:#f28d7e;
  --green:#addaf4
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(ellipse at top right,#203b55,transparent 52%),var(--bg);
  color:var(--text);font:15px/1.5 system-ui,Arial,sans-serif;
  min-height:100vh
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
button:disabled{opacity:.55;cursor:default}
h1,h2,h3{line-height:1.2}
h1{font-size:clamp(34px,6vw,64px);letter-spacing:-2px;margin:0 0 16px}
h2{margin:5px 0 14px}
a{color:var(--gold)}
.shell{
  max-width:1160px;margin:auto;padding:0 14px 130px;
  position:relative;z-index:2
}
.top{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;position:sticky;top:0;z-index:20;
  padding:15px;background:#102338ee;
  border:1px solid var(--edge);border-radius:0 0 20px 20px;
  backdrop-filter:blur(16px)
}
.logo{
  font-weight:950;letter-spacing:1px;background:none;
  color:var(--text);font-size:19px;text-align:left
}
.logo b{color:var(--orange)}
.head-actions{display:flex;gap:8px}
.iconbtn{
  background:#ffffff12;color:var(--text);
  border:1px solid var(--edge);padding:9px 12px;
  border-radius:12px;position:relative
}
.dot{
  background:#ee6b48;border-radius:50%;
  position:absolute;top:-3px;right:-3px;
  min-width:18px;font-size:11px
}
.hero{
  position:relative;overflow:hidden;margin:20px 0 25px;
  background:radial-gradient(circle at 85% 22%,#446c8966,transparent 43%),
  linear-gradient(125deg,#203b55,#203b55);
  border:1px solid #77a7c76c;border-radius:26px;
  padding:53px 35px;box-shadow:0 25px 60px #0006
}
.hero h1 span{color:var(--gold)}
.hero p{max-width:530px;color:#cce8f8}
.autumn{
  position:absolute;right:8%;top:25%;
  font-size:110px;opacity:.35;transform:rotate(18deg)
}
.eyebrow{
  color:var(--gold);font-size:11px;font-weight:800;
  letter-spacing:2px;text-transform:uppercase
}
.btn{
  background:var(--orange);color:#0c1b2c;border-radius:12px;
  padding:10px 16px;font-weight:850;display:inline-block
}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{
  background:#ffffff13;color:var(--text);
  border:1px solid var(--edge)
}
.btn.danger{background:#b34940;color:white}
.btn.small{font-size:12px;padding:7px 10px}
.admin-mod-row{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;min-height:49px;padding:11px 13px;margin:7px 0;
  gap:12px;border:1px solid var(--edge);border-radius:12px;
  background:#172f46;color:var(--text);text-align:left;
  font-size:15px;cursor:pointer
}
.admin-mod-row:hover,.admin-mod-row:focus-visible{
  border-color:var(--orange);background:#203b55
}
.admin-mod-row .mod-name{font-weight:750;overflow-wrap:anywhere}
.admin-mod-row .mod-open{color:var(--gold);font-size:13px;white-space:nowrap}
.admin-review-actions{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}
.admin-review-actions .btn{font-size:14px;padding:11px 14px;min-height:43px}
.admin-preview-image{width:100%;max-height:270px;object-fit:contain;
  border-radius:12px;background:#0c1b2c;margin-bottom:15px}
.admin-current-file{margin-top:7px;overflow-wrap:anywhere;font-size:13px}

/* Mod detail actions: full labels, readable targets and clear pending state. */
.mod-actions{gap:10px;align-items:stretch}
.mod-actions .btn{font-size:15px;padding:12px 15px;min-height:46px;line-height:1.3}
.mod-actions .btn:disabled{opacity:.65;cursor:not-allowed;filter:none}
.mod-review-message{font-size:14px;line-height:1.5;margin:12px 0}
@media(max-width:560px){.mod-actions .btn{flex:1 1 calc(50% - 10px);font-size:14px}}

.buttons{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:12px 0}
.bar{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;margin:25px 0 15px
}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}
.field{
  background:#0c1b2c;color:var(--text);
  border:1px solid var(--edge);border-radius:10px;
  padding:11px;width:100%;outline:none
}
.field:focus{border-color:var(--orange)}
.filters input{flex:2;min-width:170px}
.filters select{flex:1;min-width:120px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}
.card{
  background:linear-gradient(130deg,#172f46,#0c1b2c);
  border:1px solid var(--edge);border-radius:18px;
  overflow:hidden;min-width:0
}
.card:hover{border-color:#96c7e570}
.art{
  height:180px;background:linear-gradient(125deg,#446c89,#5d89a7);
  display:grid;place-items:center;font-size:64px;
  position:relative;overflow:hidden
}
.art img{width:100%;height:100%;object-fit:cover}
.chip{
  position:absolute;left:10px;top:10px;
  background:#10221dbb;border:1px solid #ffffff50;
  border-radius:9px;font-size:11px;padding:4px 9px
}
.cardbody{padding:15px}
.cardbody h3{margin:3px 0 6px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.mini{font-size:12px}
.smalltext{font-size:13px}
.cardbody p{min-height:35px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.av{
  width:40px;height:40px;border-radius:50%;
  background:#355974;display:inline-grid;place-items:center;
  overflow:hidden;flex-shrink:0;color:white;font-weight:800
}
.av.large{width:90px;height:90px;font-size:39px}
.av img{width:100%;height:100%;object-fit:cover}
.linkbtn{
  border:0;background:transparent;color:var(--gold);
  padding:0;font-weight:800;text-align:left;
  cursor:pointer;overflow-wrap:anywhere
}
.tick{
  background:#3b98f4;color:white;border-radius:50%;
  font-size:11px;margin-left:3px;padding:1px 5px
}
.banner{
  border:1px solid #77a7c766;
  background:radial-gradient(circle at right,#35597455,transparent 55%),#203b55;
  border-radius:22px;padding:30px
}
.counters{display:flex;gap:8px;margin:20px 0}
.count{
  flex:1;min-width:0;text-align:center;
  border:1px solid var(--edge);background:#0c1b2cbb;
  color:var(--text);padding:12px 4px;border-radius:12px
}
.count b{display:block;font-size:25px}
.count span{font-size:12px}
.list{display:grid;gap:10px}
.item{
  border:1px solid var(--edge);
  background:var(--panel);border-radius:14px;padding:14px
}
.tabs{display:flex;gap:7px;margin:18px 0}
.tabs button{
  padding:9px 14px;border-radius:10px;
  background:#ffffff12;color:var(--muted)
}
.tabs button.on{background:var(--orange);color:#0c1b2c}
.bottom{
  position:fixed;bottom:10px;left:50%;transform:translateX(-50%);
  display:grid;grid-template-columns:repeat(5,1fr);
  gap:4px;padding:7px;background:#102338f1;
  backdrop-filter:blur(18px);border:1px solid var(--edge);
  border-radius:21px;width:min(720px,calc(100% - 15px));
  z-index:20;box-shadow:0 12px 45px #0009
}
.bottom button{
  background:transparent;color:#96c7e5;border-radius:12px;
  padding:7px 2px;font-size:11px;display:grid;place-items:center
}
.bottom button i{font-style:normal;font-size:25px}
.bottom button.on{background:#77a7c727;color:var(--gold)}
#leaves{
  position:fixed;inset:0;overflow:hidden;
  pointer-events:none;z-index:0
}
.leaf{
  position:absolute;top:-40px;opacity:.5;
  animation:fall linear infinite
}
@keyframes fall{
  to{transform:translate(80px,110vh) rotate(520deg)}
}
#overlay{
  display:none;position:fixed;inset:0;background:#000c;
  backdrop-filter:blur(8px);z-index:50;
  align-items:center;justify-content:center;padding:10px
}
#overlay.open{display:flex}
.dialog{
  width:min(750px,100%);max-height:93vh;overflow:auto;
  background:#102338;border:1px solid #ffffff33;
  border-radius:20px;box-shadow:0 20px 80px #000a
}
.dialoghead{
  position:sticky;top:0;background:#172f46ee;
  display:flex;justify-content:space-between;align-items:center;
  padding:13px 20px;border-bottom:1px solid var(--edge);z-index:2
}
.dialogbody{padding:20px}
.formgroup{margin:0 0 15px}
.formgroup label{
  display:block;font-size:13px;font-weight:800;margin:0 0 6px
}
.formgroup textarea{min-height:95px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.messages{
  max-height:400px;min-height:240px;overflow:auto;
  display:flex;flex-direction:column;gap:10px;padding:12px 0
}
.bubble{
  background:#203b55;padding:10px 13px;border-radius:14px;
  max-width:78%;align-self:start;white-space:pre-wrap;
  overflow-wrap:anywhere
}
.bubble.mine{background:#446c89;align-self:end}
.bubble small{
  display:block;color:#cce8f8;font-size:10px;text-align:right
}
.chatlayout{
  display:grid;grid-template-columns:230px minmax(0,1fr);gap:15px
}
.note{
  border-left:3px solid var(--gold);padding:12px;
  background:#96c7e514;border-radius:8px;
  color:#cce8f8;margin:10px 0
}
.empty{
  text-align:center;padding:40px 15px;
  border:1px dashed #ffffff45;
  border-radius:17px;color:var(--muted)
}
#toast{
  position:fixed;top:80px;right:12px;z-index:100;
  background:#294962;border:1px solid var(--orange);
  color:white;border-radius:12px;padding:10px 15px;
  display:none;max-width:350px
}
.wrap{overflow-wrap:anywhere;white-space:pre-wrap}
.divider{border-top:1px solid var(--edge);margin:16px 0}
.status{
  font-size:11px;border:1px solid var(--edge);
  border-radius:8px;padding:3px 6px;color:var(--gold)
}
.badgeStatus{color:var(--green)}
.footer{
  text-align:center;color:#5d89a7;font-size:11px;margin:28px 0
}
@media(max-width:760px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chatlayout{grid-template-columns:1fr}
  .autumn{font-size:80px;right:-10px}
  .hero{padding:39px 23px}
}
@media(max-width:560px){
  .grid,.two{grid-template-columns:1fr}
  .logo{font-size:14px}
  .top{padding:10px}
  .iconbtn{padding:7px 9px}
  .hero h1{font-size:36px}
  .art{height:190px}
  .banner{padding:18px}
  .count b{font-size:20px}
  .count span{font-size:10px}
  .bottom button{font-size:9px}
  .bottom button i{font-size:22px}
}
@media(prefers-reduced-motion:reduce){
  .leaf{display:none}
}


/* Compact SVG layout — old neon theme removed. */
.svg-icon{display:inline-block;vertical-align:-.22em;flex:none}
.bottom button .navicon{display:grid;place-items:center}
.head-actions{align-items:center}
.logo{display:inline-flex;align-items:center;gap:10px}
.brand-icon{display:inline-grid;place-items:center;width:43px;height:43px}
.cardbody .row.mini{font-size:13px;gap:7px}
.cardbody .row.mini .svg-icon{color:#96c7e5}
.admin-mod-row .mod-name{display:inline-flex;align-items:center;gap:10px}
.admin-review-actions .btn,.mod-actions .btn{min-height:44px}
@media(max-width:560px){
  .logo{font-size:12px;gap:6px}
  .brand-icon{width:34px;height:34px}
  .head-actions{gap:4px}
  #accountTop{font-size:0;min-width:41px}
  #accountTop .svg-icon{width:18px;height:18px}
}
.account-trigger{gap:8px}
.account-menu-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:15px}
.account-menu-head>span:first-child{display:flex;align-items:center;gap:10px}
.account-limit{color:#e1f2fc;font-size:13px;font-weight:850;border:1px solid #e1f2fc73;border-radius:99px;padding:5px 12px}
.account-list{display:grid;gap:9px;margin-bottom:18px}
.account-entry{display:flex;align-items:stretch;gap:6px;background:#152a32;border:1px solid #e1f2fc2c;border-radius:16px;overflow:hidden}
.account-entry.active{border-color:#e1f2fca5;background:linear-gradient(120deg,#24443e,#162d34)}
.account-switch{display:flex;align-items:center;flex:1;gap:12px;border:0;background:transparent;color:var(--text);padding:13px;text-align:left;min-width:0}
.account-switch:hover{background:#e1f2fc10}
.account-avatar{width:43px;height:43px;display:grid;place-items:center;border-radius:14px;background:#e1f2fc22;color:#e1f2fc;flex:none}
.account-label{flex:1;display:grid;gap:2px;min-width:0}
.account-label b{font-size:15px;overflow-wrap:anywhere}
.account-label small{font-size:12px;color:#addaf4}
.account-remove{background:transparent;color:#f4a2ad;border:0;padding:12px;display:grid;place-items:center}
.account-remove:hover{background:#f87d9233}
.account-footer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.account-full{display:flex;gap:10px;align-items:center;background:#96c7e516;border:1px solid #96c7e580;padding:12px;border-radius:12px;color:#cce8f8;flex:1}
.account-note{font-size:12px;color:#addaf4;line-height:1.6;margin:18px 0 0}
@media(max-width:560px){.account-menu-head strong{font-size:15px}}

.compact-hero{min-height:235px;padding:38px clamp(24px,5vw,58px);margin-bottom:17px}
.compact-hero h1{font-size:clamp(38px,5.2vw,58px);margin-bottom:11px}
.compact-hero .eyebrow{margin-bottom:13px}
.compact-hero p{margin:10px 0}
.compact-hero .buttons{margin-top:18px}
.discover-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-bottom:25px}
.stat-tile{display:flex;align-items:center;gap:10px;padding:15px 20px;background:linear-gradient(120deg,#18363b,#11252f);border:1px solid #e1f2fc3a;border-radius:17px;min-width:0}
.stat-tile .svg-icon{color:#e1f2fc}
.stat-tile b{font-size:22px;line-height:1;white-space:nowrap}
.stat-tile span{font-size:12px;color:#addaf4}
.section-kicker{font-weight:850;letter-spacing:.16em;font-size:10px;color:#e1f2fc}
.explore-bar{margin:8px 0 12px}
.explore-bar h2{margin:4px 0}
.discover-tabs button,.sort-tabs button{display:inline-flex;align-items:center;gap:7px;justify-content:center}
.search-wrap{flex:2;min-width:210px;position:relative;display:flex;align-items:center}
.search-wrap .svg-icon{position:absolute;left:15px;z-index:1;color:#cce8f8}
.search-wrap input{padding-left:43px}
.filters select{flex:1;min-width:155px}
.quick-categories{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:10px 0 15px}
.category-chip{padding:8px 13px;border-radius:100px;background:#1b3038;border:1px solid #cce8f83b;color:#cce8f8;font-weight:700;font-size:12px}
.category-chip.selected,.category-chip:hover{background:#e1f2fc27;color:#e1f2fc;border-color:#e1f2fca0}
.results-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:11px 0 16px}
#resultsCount{font-size:13px;color:#addaf4}
.sort-tabs{margin:0}
.sort-tabs button{font-size:12px;min-height:35px;padding:7px 12px}
.load-more{text-align:center;margin:25px 0}
.wide-empty{grid-column:1/-1;padding:55px 20px;text-align:center}
.skeleton-card{height:305px;border-radius:20px;overflow:hidden;background:#152b34;border:1px solid #e1f2fc20}
.skeleton-art{height:170px;background:linear-gradient(105deg,#26423e,#376458,#26423e);background-size:210% 100%;animation:worldSkeleton 1.4s infinite}
.skeleton-lines{height:95px;margin:20px;border-radius:12px;background:linear-gradient(105deg,#25433c,#385750,#25433c);background-size:210% 100%;animation:worldSkeleton 1.4s infinite}
@keyframes worldSkeleton{to{background-position-x:-210%}}
@media(max-width:630px){
 .stat-tile{padding:10px;flex-direction:column;gap:5px}
 .stat-tile b{font-size:19px}
 .stat-tile span{font-size:11px}
 .compact-hero{padding:31px 22px}
 .compact-hero h1{font-size:41px}
 .search-wrap{min-width:100%;flex:1}
 .filters select{min-width:130px}
 .discover-tabs{width:100%}
 .discover-tabs button{flex:1}
}

width:42px;height:42px;display:grid;place-items:center;border-radius:13px;
color:#f1f9ff;background:#0c1f29d9;border:1px solid #e1f2fc85;backdrop-filter:blur(10px)}
.quick-save:hover,.quick-save.saved{background:#e1f2fc;color:#102338;
transform:scale(1.06)}

.admin-section{margin:13px 0;border:1px solid #cce8f843;border-radius:15px;
background:#142a32;overflow:hidden}
.admin-section summary{cursor:pointer;padding:15px 17px;display:flex;

.admin-section summary::-webkit-details-marker{display:none}

.admin-section[open]>summary{background:#e1f2fc14;border-bottom:1px solid #e1f2fc30}
.admin-section>.item{margin:10px}

/* Lightweight mod detail modal; avoid entire DOM replacement on reactions */

#overlay .dialog{overscroll-behavior:contain}
.mod-detail{display:grid;gap:15px}
.mod-hero-art{height:205px;overflow:hidden;display:grid;place-items:center;
  background:#152a32;border-radius:16px;color:#e1f2fc}
.mod-hero-art img{width:100%;height:100%;object-fit:cover}
.mod-headline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mod-headline h2{font-size:clamp(20px,3vw,29px);margin:0}
.mod-description{line-height:1.65;margin:0}
.mod-author{display:flex;align-items:center;gap:9px;min-height:32px}
.mod-comment-list{min-height:48px}

/* AUTUMN CRAFT — lightweight Minecraft GUI */
:root{--bg:#071322;--panel:#0c1b2c;--panel2:#102338;--text:#e1f2fc;
--muted:#96c7e5;--gold:#addaf4;--orange:#77a7c7;--green:#96c7e5;--red:#cb6f62;--edge:#3559748c}
html{background:#071322}
body{background:#071322!important;color:var(--text)!important;
font-family:system-ui,-apple-system,'Segoe UI',sans-serif!important;letter-spacing:0!important}
body:before,.hero:after{display:none!important}
*{scroll-behavior:auto}
.top,.bottom,.dialog,.banner,.card,.item,.admin-section,.hero{
box-shadow:none!important;backdrop-filter:none!important}
.top{background:#0c1b2c!important;border:2px solid #294962!important;border-radius:8px!important}
.logo{font-weight:900;letter-spacing:.035em;font-family:ui-monospace,Consolas,monospace}
.logo b{color:#addaf4!important;text-shadow:none!important}
.brand-icon{background:#446c89!important;color:#e1f2fc!important;
border:2px solid #addaf4!important;border-radius:3px!important;box-shadow:3px 3px 0 #071322!important}
.hero,.compact-hero{background:linear-gradient(135deg,#102338,#172f46)!important;
border:2px solid #446c89!important;border-radius:8px!important;
min-height:170px!important;padding:26px 28px!important}
.hero h1,.hero h1 span{color:#cce8f8!important;text-shadow:none!important}

/* Lightweight autumn leaves: visible on phones and behind transparent overlay,
   with pointer events disabled. */
#leaves {
  display:block!important;
  position:fixed!important;
  inset:0!important;
  width:100%!important;
  height:100dvh!important;
  pointer-events:none!important;
  overflow:hidden!important;
  z-index:4!important;
  background:transparent!important;
}
#leaves .leaf {
  display:block!important;
  position:absolute!important;
  top:-42px;
  color:#d9a74d!important;
  opacity:.23!important;
  pointer-events:none!important;
  width:auto;
  height:auto;
  transform:translate3d(0,0,0);
  animation:autumnLeafFall var(--leaf-duration,20s) linear var(--leaf-delay,0s) infinite!important;
  will-change:transform;
}
@keyframes autumnLeafFall {
  0%{transform:translate3d(0,-10vh,0) rotate(0deg)}
  45%{transform:translate3d(var(--leaf-drift),48vh,0) rotate(var(--leaf-rotate))}
  100%{transform:translate3d(0,113vh,0) rotate(650deg)}
}
@media(prefers-reduced-motion:reduce){
  #leaves .leaf{animation:none!important;opacity:.15!important}
}

/* MINECRAFT WORLD — AUTUMN PIXEL EDITION
   Inspired by the chosen mockup. No blur, GPU shaders, continuously animated
   gradients, remote fonts or heavy graphics. Hero is one tiny static SVG. */
:root{
  --bg:#071322;--panel:#102338;--panel2:#172f46;
  --text:#e1f2fc;--muted:#96c7e5;--gold:#addaf4;
  --orange:#77a7c7;--green:#77a7c7;--edge:#355974a8;
}
body{
  background:#0c1b2c!important;
  color:var(--text)!important;
  font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif!important;
  background-image:radial-gradient(ellipse at 48% -5%,#203b5548,transparent 65%)!important;
}
body:before,.hero:after{display:none!important}
.shell{max-width:1120px;padding:0 16px 120px}
.top{
  top:8px!important;
  background:#102338f2!important;
  border:1px solid #446c89!important;
  border-radius:13px!important;
  padding:13px 17px!important;
  margin-top:8px;
  box-shadow:0 3px 0 #071322!important;

/* V1.1 Messenger visual refinement
   Telegram-like composition, strictly Minecraft World green + wood + gold palette.
   Only affects active chat windows: all other pages keep their existing theme. */
#app.mw11-chat-page {
  --mw11-wall:#102338;
  --mw11-wall-dark:#0c1b2c;
  --mw11-wood:#172f46;
  --mw11-head:#172f46;
  --mw11-head-edge:#446c89;
  --mw11-sent:#446c89;
  --mw11-received:#203b55;
  --mw11-text:#e1f2fc;
  --mw11-soft:#addaf4;
  --mw11-gold:#96c7e5;
}
#app.mw11-chat-page .mw11-chat-avatar{
  width:45px;height:45px;min-width:45px;display:grid;place-items:center;
  border-radius:50%;background:#355974;color:#cce8f8;
  border:1px solid #5d89a73d;overflow:hidden;flex:none;
}
#app.mw11-chat-page .mw11-chat-avatar .av,
#app.mw11-chat-page .mw11-chat-avatar .av img{
  width:100%!important;height:100%!important;border:0!important;
  border-radius:50%!important;object-fit:cover!important;display:grid;place-items:center;
}
#app.mw11-chat-page .mw11-chat-options-btn{
  width:43px;height:43px;min-width:43px;display:grid;place-items:center;
  border:1px solid #ffffff16;background:#203b55!important;border-radius:50%;
  padding:0;color:var(--mw11-gold);flex:none;cursor:pointer;
}
#app.mw11-chat-page .mw11-chat-options-btn:active{background:#355974!important}
#app.mw11-chat-page .chat-toolbar{min-width:0}
#app.mw11-chat-page .mw11-head-name{color:var(--mw11-text);min-width:0}
#app.mw11-chat-page .mw11-head-name strong{font-size:16px;letter-spacing:.1px}
#app.mw11-chat-page .mw11-head-name small{color:#addaf4}
#app.mw11-chat-page .chat-window .messages{
  background-color:var(--mw11-wall);
  background-image:
    radial-gradient(circle at 8% 18%,#addaf430 0 2px,transparent 2.5px),
    radial-gradient(circle at 90% 75%,#77a7c728 0 2px,transparent 2.5px),
    linear-gradient(45deg,transparent 47.5%,#cce8f808 48.5%,#cce8f808 50%,transparent 51%),
    linear-gradient(135deg,transparent 47.5%,#96c7e509 48.5%,#96c7e509 50%,transparent 51%),
    linear-gradient(160deg,#102338,#172f46 55%,#102338);
  background-size:160px 160px,183px 183px,118px 118px,118px 118px,cover;
  background-position:0 0,40px 30px,16px 2px,16px 2px,center;
}
#app.mw11-chat-page .chat-window .messages .bubble{
  background:var(--mw11-received);
  color:var(--mw11-text);border:1px solid #addaf419;
  box-shadow:0 3px 12px #07132232;
  border-radius:19px 19px 19px 6px;
  line-height:1.47;padding:10px 13px;
  width:max-content;max-width:min(82%,520px);
  min-width:80px;margin:0;word-break:break-word;align-self:flex-start;
}
#app.mw11-chat-page .chat-window .messages .bubble.mine{
  background:var(--mw11-sent);
  color:#f1f9ff;border-color:#addaf440;
  border-radius:19px 19px 6px 19px;
  align-self:flex-end;margin-left:auto;
}
#app.mw11-chat-page .chat-window .messages .bubble .bubble-body{
  white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.45;
}
#app.mw11-chat-page .chat-window .messages .bubble small,
#app.mw11-chat-page .chat-window .messages .mw11-bubble .mw11-footer small{
  color:#e1f2fc;font-size:10px;line-height:1.1;opacity:.78;
}
#app.mw11-chat-page .chat-window .messages .world-message{
  width:100%;max-width:100%;display:flex;flex-direction:column;
  align-items:flex-start;gap:4px;margin:2px 0 7px;
}
#app.mw11-chat-page .chat-window .messages .world-message:has(.bubble.mine){align-items:flex-end}
#app.mw11-chat-page .chat-window .messages .world-message .bubble{
  margin-left:0!important;
}
#app.mw11-chat-page .chat-window .messages .world-message>.linkbtn{
  display:flex;align-items:center;gap:8px;
  padding:0 5px!important;margin:0 0 1px!important;
  font-size:12px;font-weight:700;color:var(--mw11-gold);max-width:85%;
}
#app.mw11-chat-page .chat-window .messages .world-message>.linkbtn .av{width:25px;height:25px}
#app.mw11-chat-page .chat-window .messages .world-message:has(.bubble.mine)>.linkbtn{display:none}
#app.mw11-chat-page .chat-window .messages .mw11-bubble{cursor:pointer}
#app.mw11-chat-page .chat-window .messages .mw11-bubble:focus-visible{
  outline:2px solid var(--mw11-gold);outline-offset:2px;
}
#app.mw11-chat-page .chat-window .messages .mw11-quote{
  border-left:3px solid var(--mw11-gold);background:#10233854;
  color:#e1f2fc;padding:7px 10px;
}
#app.mw11-chat-page .chat-window .messages .mw11-reaction-list{margin-top:5px}
#app.mw11-chat-page .chat-window .messages .mw11-react-chip{

}
#app.mw11-chat-page .chat-window .messages .mw11-date-separator{

#app.mw11-chat-page .chat-window .messages .mw11-group-sender{
  color:var(--mw11-gold);padding-left:5px;margin:1px 0 0;font-size:12px;
}
#app.mw11-chat-page .chat-window .chat-compose{
  background:var(--mw11-head);border-top:1px solid #446c897e;

  if(hasMemory){
    filterMods();
    if(Date.now()-feedLoadedAt<30000)return;
  }else{
    cached=readFeedCache();
    if(cached){
      S.feed=cached.items;
      S.hasMore=S.feed.length>=60;
      S.feedOffset=S.feed.length;
      setCachedProfiles(cached.profiles);
      for(const p of cached.profiles)if(knownProfiles.has(p.id))knownProfiles.get(p.id).at=0;
      S.cache=Object.fromEntries(cached.profiles.map(p=>[p.id,p]));
      filterMods();
    }
  }
  const query=DB.from('mods')
    .select('id,shares_count,author_id,title,description,category,game_version,cover_path,file_path,status,likes_count,downloads_count,saves_count,comments_count,views_count,title_uz,title_ru,title_en,description_uz,description_ru,description_en,created_at')
    .eq('status','approved')
    .order(S.sort==='popular'?'views_count':S.sort==='best'?'likes_count':'created_at',{ascending:false}).limit(60);
  const savedPromise=S.homeView==='saved'?loadSavedIds():Promise.resolve();
  const [res,savedResult]=await Promise.allSettled([query,savedPromise]);
  if(S.page!=='home'||request!==homeRequest)return;
  if(res.status==='rejected'||res.value.error){
    if(!cached&&!hasMemory)throw (res.status==='rejected'?res.reason:res.value.error);
    toast('Ulanish sust. Oldingi modlar ko‘rsatildi.');
    return;
  }
  if(savedResult.status==='rejected')toast('Saqlangan modlarni olishda xato');
  S.feed=res.value.data||[];
  S.hasMore=S.feed.length===60;
  S.feedOffset=S.feed.length;
  feedLoaded=true;
  feedLoadedAt=Date.now();
  feedLoadedOrder=S.sort;
  if(S.homeView==='saved')await loadExtraSavedMods();
  filterMods();
  saveFeedCache();
  try{
    S.cache=await users(S.feed.map(m=>m.author_id),true);
    if(S.page==='home'&&request===homeRequest)filterMods();
    saveFeedCache();
  }catch(err){console.warn('Author profiles:',err)}
}

async function loadExtraSavedMods(){

  const existing=new Set(S.feed.map(m=>m.id));

  if(!missing.length)return;
  const r=await DB.from('mods')

    .in('id',missing).eq('status','approved').limit(80);

  S.feed.push(...r.data);
  const profiles=await users(r.data.map(m=>m.author_id));

}
async function fetchMoreFeed(){
  if(S.loadingMore||!S.hasMore)return;
  S.loadingMore=true;
  const request=homeRequest;
  const from=S.feedOffset||0;
  try{
    const r=await DB.from('mods')
      .select('id,shares_count,author_id,title,description,category,game_version,cover_path,status,likes_count,downloads_count,saves_count,comments_count,views_count,title_uz,title_ru,title_en,description_uz,description_ru,description_en,created_at')
      .eq('status','approved')
      .order(S.sort==='popular'?'views_count':S.sort==='best'?'likes_count':'created_at',{ascending:false})
      .range(from,from+59);
    check(r);
    if(S.page!=='home'||request!==homeRequest)return;
    const existing=new Set(S.feed.map(m=>m.id));
    S.feed.push(...r.data.filter(m=>!existing.has(m.id)));
    S.feedOffset=from+r.data.length;
    S.hasMore=r.data.length===60;
    S.visibleMods+=12;
    filterMods();
    const mp=await users(r.data.map(m=>m.author_id));
    Object.assign(S.cache,mp);
    if(S.page==='home'&&request===homeRequest)filterMods();
    saveFeedCache();
  }finally{S.loadingMore=false}
}

function getProfileData(id){

  if(recent&&Date.now()-recent.at<45000)return recent.promise;
  const promise=Promise.all([
    DB.from('profiles').select('*').eq('id',id).single(),
    DB.from('mods').select('id,shares_count,author_id,title,description,category,game_version,cover_path,status,likes_count,downloads_count,comments_count,views_count,title_uz,title_ru,title_en,description_uz,description_ru,description_en,created_at')

    DB.from('mods').select('id',{count:'exact',head:true})
      .eq('author_id',id).eq('status','approved'),
    DB.from('follows').select('follower_id',{count:'exact',head:true})

const ACCOUNT_STORE_KEY='mw_saved_accounts_v1';
const ACCOUNT_MAX=5;
// Saved accounts belong to this browser profile only. Never sync sessions
// to the public database or expose them to other users.
function savedAccounts(){
  try{
    const items=JSON.parse(localStorage.getItem(ACCOUNT_STORE_KEY)||'[]');
    if(!Array.isArray(items))return [];
    const seen=new Set();
    return items.filter(a=>{
      if(!a||typeof a.id!=='string'||!/^[0-9a-f-]{36}$/i.test(a.id)||
          typeof a.username!=='string'||typeof a.access_token!=='string'||
          typeof a.refresh_token!=='string'||seen.has(a.id))return false;
      seen.add(a.id);return true;
    }).slice(0,ACCOUNT_MAX);
  }catch{return []}
}
function writeAccounts(items){
  const clean=items.slice(0,ACCOUNT_MAX);
  try{
    const serialized=JSON.stringify(clean);
    localStorage.setItem(ACCOUNT_STORE_KEY,serialized);
    // Important for Telegram in-app browsers: a failed write must not
    // silently look like a successfully saved account.
    const reread=localStorage.getItem(ACCOUNT_STORE_KEY);
    if(reread!==serialized)throw Error('Storage did not persist account list');
    return true;
  }catch(error){
    console.warn('Saved accounts storage failed:',error);
    throw Error('Brauzer akkauntlarni saqlamadi. Brauzer xotirasi yoki maxfiy rejimni tekshiring.');
  }
}
function rememberAccount(session,username=''){
  const user=session?.user;
  if(!user?.id||!session?.access_token||!session?.refresh_token)return false;
  const entries=savedAccounts();
  const index=entries.findIndex(a=>a.id===user.id);
  if(index<0&&entries.length>=ACCOUNT_MAX)return false;
  const known=index>=0?entries[index]:null;
  const name=username||(S.me?.id===user.id?S.me.username:'')||
    known?.username||user.user_metadata?.username||'user';
  const item={id:user.id,username:String(name).toLowerCase(),
    access_token:session.access_token,refresh_token:session.refresh_token};
  if(index>=0)entries[index]=item;else entries.push(item);
  return writeAccounts(entries);
}
function forgetAccount(id){
  writeAccounts(savedAccounts().filter(a=>a.id!==id));
}

async function switchAccount(id){
  if(id===S.u?.id){close();return}
  const target=savedAccounts().find(a=>a.id===id);
  if(!target)throw Error('Bu akkaunt saqlanmagan');
  const {data:prior}=await DB.auth.getSession();
  if(prior?.session)rememberAccount(prior.session);
  let data=null,error=null;
  try{
    const result=await DB.auth.setSession({
      access_token:target.access_token,refresh_token:target.refresh_token
    });
    data=result.data;error=result.error;
  }catch(err){error=err}
  if(error||!data?.session||data.user?.id!==id){
    // Keep the username in the account menu; don't silently erase the
    // saved account because of an expired/rotated refresh token.
    if(prior?.session){
      const restored=await DB.auth.setSession({
        access_token:prior.session.access_token,
        refresh_token:prior.session.refresh_token
      });
      if(restored.error)console.warn('Previous session restore:',restored.error);
    }
    toast('@'+target.username+' uchun parol bilan qayta kiring.');
    authBox(false,true,target.username);
    return;
  }
  rememberAccount({...data.session,user:data.user||data.session.user},target.username);
  close();
  await refreshUser();
  await go('home');
  scheduleFastPrefetch();
  toast('@'+target.username+' akkauntiga o‘tildi');
}

async function submitAuth(f){
  const form=new FormData(f);
  const username=String(form.get('username')||'').trim().toLowerCase();
  const password=String(form.get('password')||'');
  const register=f.dataset.register==='true';
  const adding=f.dataset.adding==='true';
  if(adding&&savedAccounts().length>=ACCOUNT_MAX &&
      !savedAccounts().some(a=>a.username===username))
    throw Error('5 ta akkaunt limiti tugadi');
  if(!/^[a-z0-9_]{3,20}$/.test(username))
    throw Error('Username 3–20 ta: a–z, 0–9 yoki _');
  if(!password || new TextEncoder().encode(password).length>72)
    throw Error('Parol bo‘sh bo‘lmasin, 72 baytdan oshmasin');
  if(register){
    if([...password].length<8)
      throw Error('Parol kamida 8 belgidan iborat bo‘lsin');
    if(password!==form.get('password2'))
      throw Error('Parollar bir xil emas');
  }
  let response;
  try{
    response=await fetch(
      'https://ruovdgyfcucspffrvijh.supabase.co/functions/v1/username-auth',
      {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        credentials:'omit',
        cache:'no-store',
        body:JSON.stringify({
          action:register?'signup':'login',username,password
        })
      }
    );
  }catch{
    throw Error('Login serveri hali ishga tushmagan yoki ulanmagan');
  }
  const result=await response.json().catch(()=>({}));
  if(!response.ok)
    throw Error(result.error||'Login serveri javob bermadi');
  if(!result.access_token||!result.refresh_token)
    throw Error('Server sessiya qaytarmadi');
  const {data:previous}=await DB.auth.getSession();
  if(previous?.session)rememberAccount(previous.session);
  const {data:authResult,error}=await DB.auth.setSession({
    access_token:result.access_token,
    refresh_token:result.refresh_token
  });
  if(error)throw error;
  try{
    const session=authResult?.session&&{
      ...authResult.session,
      user:authResult.user||authResult.session.user
    };
    if(!rememberAccount(session,username))
      throw Error('5 ta akkaunt limiti tugadi yoki sessiya mavjud emas.');
    if(!savedAccounts().some(a=>a.id===session.user.id&&a.username===username))
      throw Error('Yangi akkaunt saqlanmadi. Qayta urinib ko‘ring.');
  }catch(err){
    // Don't leave the browser switched to a new account that wasn't saved.
    if(previous?.session){
      const restore=await DB.auth.setSession({
        access_token:previous.session.access_token,
        refresh_token:previous.session.refresh_token
      });
      if(restore.error)console.warn('Session rollback:',restore.error);
    }
    throw err;
  }
  await refreshUser();
  toast('@'+username+' akkaunti saqlandi!');
  if(adding){
    accountMenu(); // Show saved accounts immediately, not only the home page.
  }else{
    close();
    await go('home');
  }
  scheduleFastPrefetch();
}

async function refreshUser(){
  const previousId=S.u?.id;
  let s=await DB.auth.getUser();
  S.u=s.data?.user||null;
  if(previousId!==S.u?.id){
    invalidateProfileData();
    prefetchedFor=null;
    S.communityData=null;S.accountsAt=0;
    S.chatId=null;S.chatUnread=new Set();S.chatPeers=[];
    S.chatUsers={};S.worldUnread=0;S.worldPref=null;
    S.savedIds=new Set();
  }
  S.me=S.u?
    check(await DB.from('profiles').select('*')
      .eq('id',S.u.id).maybeSingle()):null;
  if(S.me)setCachedProfiles([S.me]);
  if(S.u){
    const {data:current}=await DB.auth.getSession();
    if(current?.session?.user?.id===S.u.id){
      try{rememberAccount(current.session,S.me?.username)}
      catch(error){console.warn('Account persistence:',error)}
    }
    loadSavedIds().then(()=>{
      if(S.page==='home')filterMods();
    }).catch(console.warn);
  }else{
    S.savedIds=new Set();
  }
  // The account icon is rendered in initial HTML and stays unchanged during auth refresh.
  if(S.listenUserId!==S.u?.id){
    S.listenUserId=S.u?.id||null;
    listen();
  }
  syncPushDevice().catch(console.warn);
  notificationCount().catch(console.warn);
  if(S.u){
    worldPref().then(async pref=>{
      if(pref.joined&&!pref.muted){
        const last=await DB.from('world_chat_messages').select('id',{count:'exact',head:true})
          .gt('created_at',pref.last_seen_at||new Date(0).toISOString());
        if(!last.error)S.worldUnread=Math.min(99,last.count||0);
      }
      updateChatBadge();
    }).catch(console.warn);
  }else{
    S.chatUnread=new Set();S.worldUnread=0;S.worldPref=null;
    updateChatBadge();
  }
}
async function upload(bucket,file,max,types=null){
  if(!file||!file.size)throw Error('Fayl tanlanmagan');
  if(file.size>max)throw Error('Fayl hajmi katta');
  if(types&&!types.includes(file.type))
    throw Error('Rasm turi noto‘g‘ri');
  let ext=file.name.split('.').pop().toLowerCase();
  if(bucket!=='mod-files'){
    ext={
      'image/png':'png','image/jpeg':'jpg',
      'image/webp':'webp','image/gif':'gif'
    }[file.type]
  }
  if(bucket==='mod-files'&&
    !['zip','jar','mcpack','mcaddon','mcworld','rar','7z']
      .includes(ext))
    throw Error('Noto‘g‘ri mod fayl turi');
  let path=`${S.u.id}/${crypto.randomUUID()}.${ext}`;
  check(await DB.storage.from(bucket).upload(path,file,{
    contentType:file.type||'application/octet-stream',
    upsert:false
  }));
  return path
}

function showAvatarCrop(file,input){
  if(!file||!file.type.startsWith('image/')){toast('Rasm faylini tanlang');input.value='';return}
  const oldFile=avatarCroppedFile;
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onerror=()=>{URL.revokeObjectURL(url);input.value='';toast('Rasmni ochib bo‘lmadi')};
  img.onload=()=>{
    URL.revokeObjectURL(url);
    const overlay=document.createElement('div');
    overlay.className='mw-avatar-crop-overlay';
    overlay.setAttribute('role','dialog');
    overlay.setAttribute('aria-modal','true');
    overlay.setAttribute('aria-label','Profil rasmini moslash');
    overlay.innerHTML='<div class="mw-avatar-crop-panel"><h3>Profil rasmini moslash</h3>'+
      '<p>Rasmni suring yoki ikki barmoq bilan kattalashtiring. Doira ichida qanday ko‘rinsa, profilda ham shunday bo‘ladi.</p>'+
      '<div class="mw-avatar-crop-circle"><canvas width="320" height="320" aria-label="Dumaloq avatar oldindan ko‘rinishi"></canvas></div>'+
      '<div class="mw-avatar-crop-zoom"><span>−</span><input type="range" min="1" max="4" step=".01" value="1.15" aria-label="Rasmni kattalashtirish"><span>+</span></div>'+
      '<div class="mw-avatar-crop-actions"><button type="button" class="btn ghost" data-avatar-cancel>Bekor qilish</button>'+
      '<button type="button" class="btn" data-avatar-done>Tayyor</button></div></div>';
    document.body.appendChild(overlay);
    const canvas=overlay.querySelector('canvas'),ctx=canvas.getContext('2d');
    const slider=overlay.querySelector('input[type="range"]');
    const area=overlay.querySelector('.mw-avatar-crop-circle');
    const pointers=new Map();
    const base=Math.max(320/img.naturalWidth,320/img.naturalHeight);
    let zoom=1.15,dx=0,dy=0,pinch=null,closed=false;
    function constrain(){
      const w=img.naturalWidth*base*zoom,h=img.naturalHeight*base*zoom;
      dx=Math.max(-(w-320)/2,Math.min((w-320)/2,dx));
      dy=Math.max(-(h-320)/2,Math.min((h-320)/2,dy))
    }
    function draw(target=ctx,size=320){
      const ratio=size/320;
      target.clearRect(0,0,size,size);
      target.drawImage(img,(160+dx-img.naturalWidth*base*zoom/2)*ratio,
        (160+dy-img.naturalHeight*base*zoom/2)*ratio,
        img.naturalWidth*base*zoom*ratio,img.naturalHeight*base*zoom*ratio)
    }
    function setZoom(z){
      zoom=Math.max(1,Math.min(4,z));slider.value=String(zoom);constrain();draw()
    }
    function restorePrevious(){
      if(oldFile){const dt=new DataTransfer();dt.items.add(oldFile);input.files=dt.files}
      else input.value=''
    }
    function cancel(){if(closed)return;closed=true;restorePrevious();overlay.remove()}
    slider.addEventListener('input',()=>setZoom(Number(slider.value)));
    area.addEventListener('pointerdown',event=>{
      event.preventDefault();area.setPointerCapture(event.pointerId);
      pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
      if(pointers.size===2){
        const pts=[...pointers.values()];
        pinch={distance:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),zoom}
      }
    });
    area.addEventListener('pointermove',event=>{
      if(!pointers.has(event.pointerId))return;
      event.preventDefault();
      const last=pointers.get(event.pointerId);
      pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
      if(pointers.size===2){
        const pts=[...pointers.values()];
        const d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
        if(pinch&&pinch.distance>0)setZoom(pinch.zoom*d/pinch.distance)
      }else{
        const scale=320/area.getBoundingClientRect().width;
        dx+=(event.clientX-last.x)*scale;
        dy+=(event.clientY-last.y)*scale;
        constrain();draw()
      }
    });
    const stop=event=>{
      pointers.delete(event.pointerId);
      if(pointers.size<2)pinch=null
    };
    area.addEventListener('pointerup',stop);
    area.addEventListener('pointercancel',stop);
    overlay.querySelector('[data-avatar-cancel]').addEventListener('click',cancel);
    overlay.addEventListener('click',event=>{if(event.target===overlay)cancel()});
    overlay.querySelector('[data-avatar-done]').addEventListener('click',()=>{
      if(closed)return;
      const output=document.createElement('canvas');
      output.width=512;output.height=512;
      draw(output.getContext('2d'),512);
      output.toBlob(blob=>{
        if(!blob){toast('Rasmni saqlab bo‘lmadi');return}
        if(blob.size>2097152){toast('Rasm 2 MB dan katta');return}
        const cropped=new File([blob],'avatar.jpg',{type:'image/jpeg'});
        const dt=new DataTransfer();dt.items.add(cropped);input.files=dt.files;
        avatarCroppedFile=cropped;
        const preview=document.getElementById('avatarPreview');
        if(preview){
          const previewUrl=URL.createObjectURL(cropped);
          const previous=preview.querySelector('img');
          preview.innerHTML='';
          const thumb=document.createElement('img');
          thumb.alt='Profil rasmi';thumb.className='avatar-thumb';
          thumb.src=previewUrl;
          thumb.onload=()=>URL.revokeObjectURL(previewUrl);
          preview.appendChild(thumb)
        }
        closed=true;overlay.remove()
      },'image/jpeg',.88)
    });
    constrain();draw()
  };
  img.src=url
}

async function saveProfile(f){
  let x=new FormData(f);
  let username=String(x.get('username')).trim().toLowerCase();
  const display_name=String(x.get('display_name')||'').trim().slice(0,60)||null;
  let bio=String(x.get('bio')).trim();
  if(!/^[a-z0-9_]{3,20}$/.test(username))
    throw Error('Username noto‘g‘ri');
  if(S.me.is_admin&&username!=='admin')
    throw Error('Admin username o‘zgarmaydi');
  const usernameCheck=await DB.rpc('mw_username_available',{candidate:username,kind:'profile'});
  check(usernameCheck);
  if(!usernameCheck.data)throw Error('Username band');
  let avatar_url=f.dataset.removeAvatar==='1'?null:S.me.avatar_url;
  let fi=x.get('avatar');
  if(fi?.size){
    let path=await upload('avatars',fi,2097152,
      ['image/jpeg','image/png','image/webp','image/gif']);
    avatar_url=DB.storage.from('avatars')
      .getPublicUrl(path).data.publicUrl
  }
  let r=await DB.from('profiles')
    .update({username,display_name,bio,avatar_url}).eq('id',S.u.id);
  if(r.error?.code==='23505')throw Error('Bu username band');
  check(r);
  knownProfiles.delete(S.u.id);if(S.cache)delete S.cache[S.u.id];
  feedLoadedAt=0;feedLoaded=false;
  try{for(const key of ['mw_public_feed_v4','mw_public_feed_v5',FEED_CACHE_KEY])localStorage.removeItem(key);}catch{}
  invalidateProfileData();
  await refreshUser();
  close();
  await go('profile',S.u.id)
}

const MOD_UPLOAD_LIMIT=2097152;
const acceptedCovers=new WeakMap();

function setModCover(input,file){
  const transfer=new DataTransfer();
  if(file)transfer.items.add(file);
  input.files=transfer.files;
}

async function compressModCover(file){
  const url=URL.createObjectURL(file);
  try{
    const image=new Image();
    image.src=url;
    await image.decode();
    const canvas=document.createElement('canvas');
    const context=canvas.getContext('2d');
    if(!context)throw Error('Rasmni siqib bo‘lmadi.');
    const largest=Math.max(image.naturalWidth,image.naturalHeight);
    let edge=Math.min(2560,largest);
    for(let attempt=0;attempt<8;attempt++){
      const scale=edge/largest;
      canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
      canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
      context.drawImage(image,0,0,canvas.width,canvas.height);
      for(const quality of [.9,.76,.62]){
        const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',quality));
        if(blob?.size&&blob.size<=MOD_UPLOAD_LIMIT){
          const ext=blob.type==='image/webp'?'webp':'png';
          return new File([blob],file.name.replace(/\.[^.]+$/,'')+'.'+ext,{type:blob.type});
        }
      }
      edge=Math.max(1,Math.round(edge*.72));
    }
    throw Error('Rasmni 2 MB gacha siqib bo‘lmadi. Boshqa rasm tanlang.');
  }finally{URL.revokeObjectURL(url)}
}

function requestCoverCompression(input,file){
  const popup=document.createElement('dialog');
  popup.className='cover-consent';
  popup.setAttribute('aria-labelledby','cover-consent-title');
  popup.innerHTML=`
    <h2 id="cover-consent-title">Rasmni siqishga ruxsat berasizmi?</h2>
    <p>${e(file.name)} · ${(file.size/1048576).toFixed(1)} MB</p>
    <p>Rasmni 2 MB gacha kichraytiramiz. Sifati biroz pasayishi mumkin.
      ${['image/gif','image/webp','image/png'].includes(file.type)?'Animatsiyali rasm bitta kadrga aylanadi.':''}</p>
    <p role="status" hidden></p>
    <div class="buttons">
      <button type="button" class="btn ghost" data-cancel autofocus>Bekor qilish</button>
      <button type="button" class="btn" data-compress>Siqish va tanlash</button>
    </div>`;
  const status=popup.querySelector('[role="status"]');
  const confirmButton=popup.querySelector('[data-compress]');
  popup.querySelector('[data-cancel]').onclick=()=>popup.close();
  popup.addEventListener('keydown',event=>{
    if(event.key==='Escape')event.stopPropagation();
  });
  popup.addEventListener('close',()=>popup.remove(),{once:true});
  confirmButton.onclick=async()=>{
    confirmButton.disabled=true;
    status.hidden=false;
    status.textContent='Rasm siqilmoqda…';
    try{
      const compressed=await compressModCover(file);
      if(!popup.open)return;
      if(input.isConnected){
        setModCover(input,compressed);
        input.dispatchEvent(new Event('change',{bubbles:true}));
      }
      popup.close();
    }catch(error){
      if(!popup.open)return;
      status.textContent='Rasmni siqib bo‘lmadi. Boshqa rasm tanlang.';
      confirmButton.disabled=false;
    }
  };
  document.body.append(popup);
  popup.showModal();
}

document.addEventListener('change',event=>{
  const input=event.target;
  if(!input.matches('#modForm input[type="file"]'))return;
  const file=input.files?.[0];
  if(input.name==='image'){
    if(file?.size>MOD_UPLOAD_LIMIT){
      setModCover(input,acceptedCovers.get(input));
      event.stopImmediatePropagation();
      if(['image/jpeg','image/png','image/webp','image/gif'].includes(file.type)){
        requestCoverCompression(input,file);
      }else toast('JPEG, PNG, WebP yoki GIF rasm tanlang.');
    }else if(file)acceptedCovers.set(input,file);
    else acceptedCovers.delete(input);
  }else if(file?.size>MOD_UPLOAD_LIMIT){
    input.value='';
    toast(file.name+': 2 MB dan katta fayl. Kichikroq fayl tanlang.');
    event.stopImmediatePropagation();

/* Unfinished mod drafts stay in browser IndexedDB until the owner deletes them. */
const MW_DRAFT_DB='mw-mod-drafts-v1';
let mwDraftOpen=null, mwDraftTimer=null, mwDraftRestoring=false;
function mwDraftDatabase(){
  if(!('indexedDB' in window))return Promise.reject(Error('Brauzer fayllarni saqlashni qo‘llamaydi'));
  if(!mwDraftOpen)mwDraftOpen=new Promise((resolve,reject)=>{
    const request=indexedDB.open(MW_DRAFT_DB,1);
    request.onupgradeneeded=()=>{
      const db=request.result;
      if(!db.objectStoreNames.contains('drafts'))db.createObjectStore('drafts',{keyPath:'key'});
    };
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error)
  }).catch(error=>{mwDraftOpen=null;throw error});
  return mwDraftOpen
}
async function mwDraftTx(mode,operation){
  const db=await mwDraftDatabase();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction('drafts',mode),store=tx.objectStore('drafts');
    const request=operation(store);
    let value;
    request.onsuccess=()=>{value=request.result};
    tx.oncomplete=()=>resolve(value);
    tx.onerror=()=>reject(tx.error||Error('Qoralama saqlanmadi'));
    tx.onabort=()=>reject(tx.error||Error('Qoralama saqlanmadi'))
  })
}
function mwDraftKey(id){return S.u?.id+':'+id}
async function mwDraftRead(id){return mwDraftTx('readonly',store=>store.get(mwDraftKey(id)))}
async function mwDraftList(){
  const rows=await mwDraftTx('readonly',store=>store.getAll());
  return rows.filter(row=>row.owner===S.u?.id).sort((a,b)=>b.updated-a.updated)
}
async function mwDraftDelete(id){return mwDraftTx('readwrite',store=>store.delete(mwDraftKey(id)))}
function mwDraftActive(form){return form&&form.id==='modForm'&&form.dataset.admin!=='true'&&!form.dataset.id&&form.dataset.draftId}
async function mwDraftSave(form){
  if(!mwDraftActive(form)||mwDraftRestoring||!S.u)return;
  const previous=await mwDraftRead(form.dataset.draftId);
  const fields={},langs={};
  for(const [name,value] of new FormData(form).entries()){
    if(name==='image'||name==='file')continue;
    fields[name]=String(value)
  }
  for(const lang of ['uz','ru','en'])
    langs[lang]=form.querySelector('[data-mod-lang="'+lang+'"]')?.getAttribute('aria-pressed')==='true';
  const image=form.querySelector('[name="image"]')?.files?.[0];
  const file=form.querySelector('[name="file"]')?.files?.[0];
  const row={
    key:mwDraftKey(form.dataset.draftId),owner:S.u.id,id:form.dataset.draftId,
    updated:Date.now(),fields,langs,
    image:image||previous?.image||null,
    file:file||previous?.file||null,
    cover_path:form.dataset.coverPath??previous?.cover_path??'',
    file_path:form.dataset.filePath??previous?.file_path??'',
    state:form.dataset.draftState||'draft'
  };
  await mwDraftTx('readwrite',store=>store.put(row));
  return row
}
function mwDraftSchedule(form){
  if(!mwDraftActive(form)||mwDraftRestoring)return;
  clearTimeout(mwDraftTimer);
  mwDraftTimer=setTimeout(()=>{

async function mwDraftRestore(form,id){
  const row=await mwDraftRead(id);
  if(!row||!form.isConnected||row.owner!==S.u?.id)return;
  mwDraftRestoring=true;
  try{
    form.dataset.coverPath=row.cover_path||'';
    form.dataset.filePath=row.file_path||'';
    form.dataset.draftState='draft';
    for(const lang of ['uz','ru','en']){
      const chosen=Boolean(row.langs?.[lang]);
      const button=form.querySelector('[data-mod-lang="'+lang+'"]');
      const section=form.querySelector('[data-mod-lang-section="'+lang+'"]');
      if(button){button.setAttribute('aria-pressed',String(chosen));button.classList.toggle('on',chosen)}
      if(section){
        section.hidden=!chosen;
        section.querySelectorAll('input,textarea').forEach(field=>{
          field.disabled=!chosen;field.required=chosen
        })
      }
    }
    for(const [name,value] of Object.entries(row.fields||{})){
      const target=form.elements.namedItem(name);

    for(const kind of ['category','version']){

    for(const kind of ['image','file']){

        const transfer=new DataTransfer();
        transfer.items.add(row[kind]);input.files=transfer.files;
        if(kind==='image')acceptedCovers.set(input,row[kind]);
        mwDraftFilePreview(input,row[kind])

      modUploadProgress(form,0,'Saqlangan qoralama','Avval yuborilgan fayllar qayta yuborilmaydi. Davom ettirishni bosing.');
    }
  }finally{mwDraftRestoring=false}
}

// XHR provides actual transfer byte progress; the final 5% is reserved for database confirmation.
async function modUploadWithProgress(bucket,file,onProgress){
  if(!file?.size)throw Error('Fayl tanlanmagan');
  if(file.size>2097152)throw Error('Fayl 2 MB dan katta');
  const ext=bucket==='covers'?
    ({'image/png':'png','image/jpeg':'jpg','image/webp':'webp','image/gif':'gif'}[file.type]):
    file.name.split('.').pop().toLowerCase();
  if(bucket==='covers'&&!ext)throw Error('Rasm turi noto‘g‘ri');
  if(bucket==='mod-files'&&!['zip','jar','mcpack','mcaddon','mcworld','rar','7z'].includes(ext))
    throw Error('Noto‘g‘ri mod fayl turi');
  const sessionResult=await DB.auth.getSession();
  if(sessionResult.error)throw sessionResult.error;
  const token=sessionResult.data?.session?.access_token;
  if(!token)throw Error('Sessiya tugagan. Qayta kiring.');
  const path=S.u.id+'/'+crypto.randomUUID()+'.'+ext;
  const endpoint='https://ruovdgyfcucspffrvijh.supabase.co/storage/v1/object/'+
    encodeURIComponent(bucket)+'/'+path.split('/').map(encodeURIComponent).join('/');
  return await new Promise((resolve,reject)=>{
    const request=new XMLHttpRequest();
    request.open('POST',endpoint,true);
    request.timeout=60000;
    request.setRequestHeader('Authorization','Bearer '+token);
    request.setRequestHeader('apikey','sb_publishable_L3WnUsSn6GBh16nqZTxisQ_eJu8uIrw');
    request.setRequestHeader('Content-Type',file.type||'application/octet-stream');
    request.setRequestHeader('x-upsert','false');
    request.upload.onprogress=event=>{
      if(event.lengthComputable)onProgress(Math.min(file.size,event.loaded),file.size)
    };
    request.onerror=()=>reject(Error('Internet aloqasi uzildi. Qayta tekshiring.'));
    request.ontimeout=()=>reject(Error('Server 60 soniya ichida javob bermadi. Internetni tekshiring.'));
    request.onload=()=>{
      if(request.status>=200&&request.status<300){onProgress(file.size,file.size);resolve(path);return}
      let message='';
      try{
        const body=JSON.parse(request.responseText||'{}');
        message=body.message||body.error||body.msg||''
      }catch(error){}
      reject(new Error(message || ('Fayl serverga yuklanmadi (HTTP ' + request.status + ').')))
    };
    request.send(file)
  })
}

async function saveMod(f){
  if(mwDraftActive(f)){
    clearTimeout(mwDraftTimer);
    f.dataset.draftState='uploading';
    await mwDraftSave(f);
  }
  modUploadProgress(f,0,'Yuborilmoqda...','Ma’lumotlar tekshirilmoqda.');
  if(!requireUser())return;
  const adminEdit=f.dataset.admin==='true';
  const adminDirect=S.me?.is_admin===true&&S.me.username==='admin';
  if(adminEdit && (!S.me?.is_admin||S.me.username!=='admin'))
    throw Error('Faqat admin tahrirlay oladi');
  let x=new FormData(f),id=f.dataset.id,m=null;
  if(id){
    let query=DB.from('mods').select('*').eq('id',id);
    if(!adminEdit)query=query.eq('author_id',S.u.id);
    m=check(await query.single());

  }
  let image=x.get('image'),file=x.get('file');
  const maxModBytes=2097152;
  if(image?.size>maxModBytes||file?.size>maxModBytes)
    throw Error('Rasm va mod fayli 2 MB dan oshmasligi kerak');
  const titles={},descs={};
  for(const lang of ['uz','ru','en']){
    const section=f.querySelector('[data-mod-lang-section="'+lang+'"]');
    if(!section||section.hidden)continue;
    const rawTitle=String(x.get('title_'+lang)||''),rawDesc=String(x.get('description_'+lang)||'');
    if(rawTitle.length>80||rawDesc.length>380)throw Error(lang.toUpperCase()+': nom 80, tavsif 380 belgidan oshmasligi kerak (bo‘sh joylar ham hisoblanadi)');
    titles[lang]=rawTitle.trim();
    descs[lang]=String(x.get('description_'+lang)||'').trim();
    if(titles[lang].length<3||descs[lang].length<10)
      throw Error(lang.toUpperCase()+': mod nomi yoki tavsifi juda qisqa');
  }
  const primary=['uz','ru','en'].find(lang=>titles[lang]);

function mwMountSiteSelects(){
  for(const select of document.querySelectorAll('select:not([multiple]):not([size])')){
    if(select.dataset.mwCustom==='1')continue;
    select.dataset.mwCustom='1';
    const button=document.createElement('button');button.type='button';button.className='mw-site-select';button.setAttribute('aria-haspopup','dialog');
    const sync=()=>{button.innerHTML='<span>'+e(select.selectedOptions[0]?.textContent||'Tanlash')+'</span>'+ico('back',18);button.disabled=select.disabled;};
    sync();select.hidden=true;select.setAttribute('tabindex','-1');select.after(button);
    select.addEventListener('change',sync);

      const modal=document.createElement('dialog');modal.className='mw-question mw-site-select-dialog';modal.setAttribute('aria-label',select.id==='language'?t('language'):'Tanlash');

      modal.innerHTML='<div class="mw-question-form"><header><strong>'+e(title)+'</strong><button type="button" class="mw-question-close" aria-label="Yopish">'+ico('x',20)+'</button></header><div class="mw-site-select-list">'+Array.from(select.options).map((o,i)=>'<button type="button" data-option-index="'+i+'" class="mw-site-select-option'+(o.selected?' selected':'')+'" '+(o.disabled?'disabled':'')+'><span>'+e(o.textContent)+'</span>'+(o.selected?ico('check',20):'')+'</button>').join('')+'</div></div>';
      const closePicker=()=>{if(modal.open)modal.close();modal.remove();if(button.isConnected)button.focus({preventScroll:true});};
      modal.addEventListener('cancel',ev=>{ev.preventDefault();closePicker();});
      modal.addEventListener('close',()=>modal.remove());
      modal.addEventListener('keydown',ev=>{if(ev.key==='Escape')ev.stopPropagation();});
      modal.addEventListener('click',ev=>{
        const option=ev.target.closest('[data-option-index]');
        if(option){const index=Number(option.dataset.optionIndex);if(select.options[index]?.disabled)return;const changed=select.selectedIndex!==index;select.selectedIndex=index;sync();closePicker();if(changed)select.dispatchEvent(new Event('change',{bubbles:true}));}
        else if(ev.target===modal||ev.target.closest('.mw-question-close'))closePicker();
      });
      document.body.append(modal);modal.showModal();modal.querySelector('.selected')?.focus();
    });
  }
}

function mwQuestion(message,options={}){
  const run=()=>new Promise(resolve=>{
    const prior=document.activeElement;
    const modal=document.createElement('dialog');
    modal.className='mw-question';
    modal.setAttribute('aria-labelledby','mwQuestionTitle');
    modal.setAttribute('aria-describedby','mwQuestionText');
    const inputMode=options.input===true;
    const title=options.title||(inputMode?'Ma’lumot kiriting':'Tasdiqlash');
    modal.innerHTML='<form class="mw-question-form"><header><span class="mw-question-icon">'+ico(options.danger?'trash':'info',22)+'</span><strong id="mwQuestionTitle">'+e(title)+'</strong><button type="button" class="mw-question-close" aria-label="Yopish">'+ico('x',20)+'</button></header><p id="mwQuestionText">'+e(String(message))+'</p>'+(inputMode?'<textarea class="field mw-question-input" rows="3" aria-label="'+e(title)+'"></textarea>':'')+'<footer><button type="button" class="mw-question-cancel">'+e(t('cancel'))+'</button><button type="submit" class="mw-question-ok'+(options.danger?' is-danger':'')+'">'+e(options.ok||'Tasdiqlash')+'</button></footer></form>';
    const input=modal.querySelector('textarea');if(input)input.value=String(options.initial??'');
    let settled=false;
    const finish=value=>{if(settled)return;settled=true;modal.close();modal.remove();if(prior?.isConnected)prior.focus({preventScroll:true});resolve(value)};
    const cancel=()=>finish(inputMode?null:false);
    modal.addEventListener('cancel',ev=>{ev.preventDefault();cancel()});
    modal.addEventListener('close',cancel);
    modal.addEventListener('click',ev=>{if(ev.target===modal||ev.target.closest('.mw-question-close,.mw-question-cancel'))cancel()});
    modal.addEventListener('submit',ev=>{ev.preventDefault();ev.stopImmediatePropagation();finish(inputMode?input.value:true)});
    modal.addEventListener('keydown',ev=>{if(ev.key==='Escape')ev.stopPropagation()});
    document.body.appendChild(modal);modal.showModal();(input||modal.querySelector('.mw-question-cancel')).focus({preventScroll:true});
  });
  const result=mwQuestionQueue.then(run,run);mwQuestionQueue=result.catch(()=>{});return result;
}

async function toggleTable(table,id,detail=true){

      .eq('mod_id',id).eq('user_id',S.u.id).maybeSingle();

        document.querySelectorAll('[data-like-count]').forEach(node=>{
          if(node.dataset.likeCount===String(id))node.textContent=count(m[field]);
        });
        clearScreenCache();

    if(btnEl?.isConnected)btnEl.setAttribute('aria-pressed',String(former));

function fetchModFile(url,onProgress){
  return new Promise((resolve,reject)=>{
    const request=new XMLHttpRequest();
    request.open('GET',url,true);
    request.responseType='blob';
    request.timeout=65000;
    request.onprogress=event=>{
      if(event.lengthComputable&&event.total)onProgress(Math.min(99,Math.floor(event.loaded/event.total*100)));
    };
    request.onload=()=>{
      if(request.status>=200&&request.status<300&&request.response?.size)resolve(request.response);
      else reject(Error('Faylni yuklab bo‘lmadi.'));
    };
    request.onerror=()=>reject(Error('Internet aloqasini tekshirib qayta urining.'));
    request.ontimeout=()=>reject(Error('Yuklash vaqti tugadi. Qayta urining.'));
    request.send();
  });
}
async function download(id){
  if(downloadingMods.has(id))return;
  downloadingMods.add(id);

  const progress=panel?.querySelector('progress');
  const status=panel?.querySelector('[role="status"]');
  const tg=telegramApp();
  function update(percent,message){
    if(progress)progress.value=percent;
    if(status){
      const text=percent+'% · '+message;
      if(status.textContent!==text)status.textContent=text;
    }
  }
  if(button)button.disabled=true;
  if(panel)panel.querySelector('.mod-download-progress').hidden=false;
  if(progress)progress.hidden=false;

const pushPublicKey='BJqPU4nlhyEUPhnK2C0NqBOonmyXVs-xZnMdmpKR3yzTySJruuxu16aqOsiLzB0N68MUo9AGvLCGlVgy1EI_Glk';
function pushSupported(){

async function syncPushDevice(){
  if(!pushSupported()||!('caches' in window))return;
  const uid=S.u?.id;
  const cache=await caches.open('mw-device-notification-settings');
  const record=new URL('push-device',new URL('./',location.href)).href;
  if(!uid||!notificationEnabled()||Notification.permission!=='granted'){
    await cache.delete(record);
    return;
  }
  const reg=await Promise.race([navigator.serviceWorker.ready,new Promise((_,reject)=>setTimeout(()=>reject(Error('Bildirishnoma xizmati hali tayyor emas')),7000))]);
  let sub=await reg.pushManager.getSubscription();
  if(!sub){
    const bytes=Uint8Array.from(atob(pushPublicKey.replace(/-/g,'+').replace(/_/g,'/')),ch=>ch.charCodeAt(0));
    sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:bytes});
  }
  if(S.u?.id!==uid||!notificationEnabled())return;
  const keys=sub.toJSON().keys;
  check(await DB.from('mw_push_devices').upsert({user_id:uid,endpoint:sub.endpoint,p256dh:keys.p256dh,auth:keys.auth}));
  if(S.u?.id===uid&&notificationEnabled())await cache.put(record,new Response(uid));
}

async function enablePhonePush(){
  if(!pushSupported()){toast('Bu brauzer telefon bildirishnomalarini qo‘llamaydi.');return}
  const permission=Notification.permission==='default'?await Notification.requestPermission():Notification.permission;
  if(permission!=='granted'){toast('Bildirishnomalarni brauzerning sayt sozlamalaridan yoqishingiz mumkin.');return}
  localStorage.setItem('mw_notifs_ui','on');
  await syncPushDevice();
  toast(S.u?'Telefon bildirishnomalari yoqildi.':'Ruxsat berildi. Akkauntga kirganda bildirishnomalar ulanadi.');
}
let mwNotificationBusy=false;
function mwUpdateNotificationControls(busy=false){
 const on=notificationEnabled()&&pushSupported()&&Notification.permission==='granted';
 document.querySelectorAll('[data-act="notificationToggle"]').forEach(b=>{
  b.disabled=busy;if(b.classList.contains('mw-setting-toggle')){b.setAttribute('aria-checked',String(on));}else{b.textContent=ux(on?'O‘chirish':'Yoqish');}b.setAttribute('aria-busy',String(busy));
  const row=b.closest('.settings-row');const state=row?.querySelector('[data-mw-notification-state]');if(state)state.textContent=ux(on?'Yoqilgan':'O‘chirilgan');
 });
}
async function toggleNotifications(){
 if(mwNotificationBusy)return;
 if(!pushSupported()){toast('Bu brauzer telefon bildirishnomalarini qo‘llamaydi.');return;}
 mwNotificationBusy=true;
 const wasOn=notificationEnabled()&&Notification.permission==='granted';
 try{
  if(wasOn){
   localStorage.setItem('mw_notifs_ui','off');mwUpdateNotificationControls(true);
   await syncPushDevice();
   toast('Bildirishnomalar o‘chirildi');
   const reg=await navigator.serviceWorker.getRegistration();
   const sub=await reg?.pushManager.getSubscription();
   if(sub&&S.u)DB.from('mw_push_devices').delete().eq('user_id',S.u.id).eq('endpoint',sub.endpoint).then(r=>{if(r.error)console.warn(r.error)});
   // Keep the browser subscription for quick re-enabling; the local
   // service worker blocks delivery while this device is disabled.
  }else{
   const permission=Notification.permission==='default'?await Notification.requestPermission():Notification.permission;
   if(permission!=='granted'){toast('Brauzer sozlamalaridan bildirishnomalarga ruxsat bering');return;}
   localStorage.setItem('mw_notifs_ui','on');mwUpdateNotificationControls(true);
   await syncPushDevice();toast(S.u?'Bildirishnomalar yoqildi':'Ruxsat berildi. Akkauntga kiring.');
  }
 }catch(err){
  console.warn(err);
  if(!wasOn)localStorage.setItem('mw_notifs_ui','off');
  toast('Bildirishnoma ulanishida xato. Qayta urinib ko‘ring.');
 }finally{mwNotificationBusy=false;mwUpdateNotificationControls();}
}
async function savedModal(liked=false){
  if(!requireUser())return;
  const uid=S.u.id;
  const heading=liked?(S.lang==='ru'?'Понравившиеся моды':S.lang==='en'?'Liked mods':'Likelarim'):t('saved');
  dialog(heading,`<div id="savedModalList" class="saved-modal-list">
    <p class="muted">${ux('Yuklanmoqda...')}</p>
  </div>`);
  const holder=$('#savedModalList');
  try{
    let ids;
    if(liked){
      const result=await DB.from('mod_likes').select('mod_id').eq('user_id',uid).limit(500);
      check(result);
      ids=[...new Set((result.data||[]).map(row=>row.mod_id))];
    }else{
      await loadSavedIds();
      ids=[...S.savedIds];
    }
    if(!holder.isConnected||S.u?.id!==uid)return;
    if(!ids.length){
      holder.innerHTML=`<div class="empty">${ico(liked?'heart':'bookmark',30)}
        <p>${liked?(S.lang==='ru'?'Нет понравившихся модов':S.lang==='en'?'No liked mods yet':'Hozircha like bosilgan modlar yo‘q'):ux('Saqlangan modlar yo‘q')}</p></div>`;
      return;
    }
    const result=await DB.from('mods')
      .select('id,shares_count,author_id,title,description,category,game_version,cover_path,status,likes_count,downloads_count,saves_count,comments_count,views_count,title_uz,title_ru,title_en,description_uz,description_ru,description_en,created_at')
      .in('id',ids.slice(0,90)).eq('status','approved').limit(90);
    check(result);
    if(!holder.isConnected)return;
    result.data.forEach(cacheMod);
    holder.innerHTML=result.data.map(m=>`<button class="saved-modal-row" data-act="mod"
      data-id="${e(m.id)}">
      ${m.cover_path?`<img src="${e(cover(m.cover_path))}" loading="lazy" alt="">`:ico('package',26)}
      <span>${e(localModTitle(m))}<small>${e(m.game_version)} · ${e(m.category)}</small></span>

  }catch(err){
    if(holder.isConnected)holder.textContent=err.message;
  }
}

      </div></div>`).join('')||blank();
  }else if(section==='all'){
    const r=await DB.from('mods').select('id,title,status,created_at')
      .order('created_at',{ascending:false}).limit(50);
    check(r);
    html=r.data.map(m=>`<div class="item admin-simple-mod">

  if(holder.isConnected)holder.innerHTML=html;

      dialog('Chat uchun ko‘k belgi muddati',`<div class="mw-badge-duration"><label for="mwBadgeDays">Amal qilish muddati (kun)</label><input class="field" type="number" id="mwBadgeDays" min="1" max="3650" placeholder="Masalan, 30"><p class="muted">Bo‘sh qoldirilsa, muddatsiz beriladi.</p><div class="buttons">${btn('admin','Bekor qilish','','ghost')}${btn('groupBadgeApproveConfirm','Tasdiqlash',id)}</div></div>`);return;
    }
    check(await DB.rpc('mw_review_group_badge',{p_id:id,p_approve:cmd==='approve_group_badge',p_days:chosenDays??null}));
    toast(cmd==='approve_group_badge'?'Guruh tasdiqlandi':'Ariza rad etildi');await admin();return;
  }
  let days=null,note=null;
  if(cmd==='approve_verification'||cmd==='reject_verification'){
    if(mwBadgeActionsInFlight.has(id))return;
    const current=check(await DB.from('verification_requests').select('id,status').eq('id',id).maybeSingle());
    if(!current||current.status!=='pending'){toast(current?.status==='approved'?'Bu ariza avval tasdiqlangan':current?.status==='rejected'?'Bu ariza avval rad etilgan':'Ariza topilmadi');await freshAdminBadges();return;}
  }
  if(cmd==='approve_verification'&&chosenDays===undefined){
    dialog('Ko‘k belgi muddati',`<div class="mw-badge-duration"><label for="mwBadgeDays">Amal qilish muddati (kun)</label><input class="field" type="number" id="mwBadgeDays" min="1" max="3650" placeholder="Masalan, 30"><p class="muted">Bo‘sh qoldirilsa, muddatsiz beriladi.</p><div class="buttons">${btn('adminBadges','Bekor qilish','','ghost')}${btn('badgeApproveConfirm','Tasdiqlash',id)}</div></div>`);return;
  }
  if(cmd==='approve_verification')days=chosenDays;
  if(cmd==='ban'){
    let raw=await mwPrompt(
      'Necha kun? Bo‘sh qoldirsang muddatsiz bo‘ladi:',''
    );
    if(raw===null)return;
    if(raw.trim()){
      days=Number(raw);
      if(!Number.isInteger(days)||days<1||days>3650)
        throw Error('1–3650 kun kiriting')
    }
  }
  if(cmd==='reject_mod'){
    note=await mwPrompt('Rad etish sababi:','');
    if(note===null)return
  }
  if(['delete_mod','ban'].includes(cmd)&&
    !await mwConfirm('Tasdiqlaysizmi?'))return;
  if(cmd==='approve_verification'||cmd==='reject_verification'){
    if(mwBadgeActionsInFlight.has(id))return;
    mwBadgeActionsInFlight.add(id);
    const controls=[...document.querySelectorAll('#overlay [data-act="badgeApproveConfirm"],#overlay [data-act="adminAction"]')];controls.forEach(b=>b.disabled=true);
    try{
      const result=await DB.rpc('admin_action',{p_action:cmd,p_id:id,p_days:days,p_note:note});
      if(result.error?.message?.includes('Request not found')){toast('Ariza avval ko‘rib chiqilgan');await freshAdminBadges();return;}
      check(result);toast(cmd==='approve_verification'?'Ko‘k belgi tasdiqlandi':'Ariza rad etildi');await freshAdminBadges();return;
    }finally{mwBadgeActionsInFlight.delete(id);controls.forEach(b=>b.disabled=false);}
  }
  check(await DB.rpc('admin_action',{
    p_action:cmd,p_id:id,p_days:days,p_note:note
  }));
  toast('Bajarildi');
  await admin()
}

window.addEventListener('change',async ev=>{
  if(ev.target.id==='winterBackground'){
    const enabled=ev.target.checked;
    if(enabled)delete document.documentElement.dataset.winterBackground;
    else document.documentElement.dataset.winterBackground='off';

      label.textContent=x.files[0].name;

      if(small)small.textContent='Tanlandi · '+Math.max(1,Math.ceil(x.files[0].size/1024))+' KB';
      const preview=tile?.querySelector('.mw-upload-preview');
      if(preview&&x.files[0].type.startsWith('image/')){
        const reader=new FileReader();
        reader.onload=()=>{if(tile?.isConnected){preview.src=String(reader.result);preview.hidden=false}};
        reader.readAsDataURL(x.files[0]);
      }
    }
    if(x.name==='avatar'&&x.files?.[0])showAvatarCrop(x.files[0],x);

    close();
    document.documentElement.lang=S.lang;
    document.querySelectorAll('[data-tr]').forEach(
      x=>x.textContent=t(x.dataset.tr)
    );
    location.reload();
  }
});

window.addEventListener('submit',async ev=>{
  let f=ev.target;
  if(![
    'authForm','editProfileForm','modForm','inviteForm',
    'msgForm','worldMsgForm','badgeForm','reportForm','commentForm'
  ].includes(f.id))return;
  ev.preventDefault();
  let button=f.querySelector('button[type="submit"],button.btn');
  if(button)button.disabled=true;
  try{
    if(f.id==='authForm')await submitAuth(f);
    else if(f.id==='editProfileForm')await saveProfile(f);
    else if(f.id==='modForm'){
      if(button)button.textContent='Yuborilmoqda... 0%';
      await saveMod(f);
    }
    else if(f.id==='inviteForm'){
      if(!requireUser())return;
      let x=new FormData(f);
      let date=new Date(x.get('date'));
      if(!(date>new Date()))
        throw Error('Kelajakdagi vaqtni tanlang');
      check(await DB.from('play_posts').insert({
        author_id:S.u.id,
        title:x.get('title'),
        game_version:x.get('version'),
        play_mode:x.get('mode'),
        details:x.get('details'),
        play_at:date.toISOString()
      }));
      close();
      S.communityData=null;clearScreenCache();
      await go('community')
    }
    else if(f.id==='msgForm'){
      if(!requireUser())return;
      const text=String(new FormData(f).get('body')||'').trim();
      const files=window.MWV11?.selectedAttachments?.(f)||[];
      if(!text&&!files.length)return;
      const mediaList=files.length?files:[null];
      if(f.dataset.limited==='true'&&mediaList.length>1){toast('Bir martalik so‘rovda faqat bitta xabar yuborish mumkin');return;}
      const sent=[];
      const pending=window.MWV11?.beginPending?.(text||'Fayl');
      try{
      for(let i=0;i<mediaList.length;i++){
        const media=mediaList[i]?await window.MWV11.uploadAttachment(f,'dm',f.dataset.id,mediaList[i]):{};
        const body=(i===0&&text)|| (media.attachment_type==='image'?'Rasm':'Fayl: '+(media.attachment_name||'Fayl'));
        const result=check(await DB.from('messages').insert({
          sender_id:S.u.id,recipient_id:f.dataset.id,body,...media,
          reply_to:i===0?(window.MWV11?.replyId?.('dm','u:'+f.dataset.id)||null):null
        }).select('id,sender_id,recipient_id,body,created_at,reply_to,edited_at,attachment_path,attachment_name,attachment_type').single());
        sent.push(result);
      }
      window.MWV11?.finishPending?.(pending);
      }catch(err){window.MWV11?.finishPending?.(pending,true);throw err;}
      f.reset();window.MWV11?.clearAttachment?.(f);window.MWV11?.clearReply?.();
      const msgs=$('#msgs');
      if(msgs&&S.chatId===f.dataset.id)for(const result of sent){
        const html=window.MWV11?.bubble?.(result,'dm',sent)||chatBubble(result.body,true,chatTime(result.created_at));
        if(window.MWV11?.appendDated)window.MWV11.appendDated(result,html);
        else msgs.insertAdjacentHTML('beforeend',html);
        window.MWV11?.afterRender?.([result],'dm');
        msgs.scrollTop=msgs.scrollHeight;
      }
      S.mwDirectTimes=S.mwDirectTimes||{};S.mwDirectTimes[f.dataset.id]=Date.now();
      S.mwLastMessage=S.mwLastMessage||{};S.mwLastMessage[f.dataset.id]='Siz: '+sent[sent.length-1].body.slice(0,65);
      markChatSeen(f.dataset.id);chatRows();
      mwRefreshDmComposer(f.dataset.id).catch(console.warn);
      mwMaybeExpireImages().catch(console.warn);
      if(!S.chatPeers?.includes(f.dataset.id)){
        S.chatPeers=[f.dataset.id,...(S.chatPeers||[])];
        const mp=await users([f.dataset.id]);
        S.chatUsers={...S.chatUsers,...mp};chatRows();
      }
    }
    else if(f.id==='worldMsgForm'){
      if(!requireUser()||S.worldPref?.joined===false)return;
      const text=String(new FormData(f).get('body')||'').trim();
      const files=window.MWV11?.selectedAttachments?.(f)||[];
      if(!text&&!files.length)return;
      const mediaList=files.length?files:[null];
      const sent=[];
      const pending=window.MWV11?.beginPending?.(text||'Fayl');
      try{
      for(let i=0;i<mediaList.length;i++){
        const media=mediaList[i]?await window.MWV11.uploadAttachment(f,'world','world',mediaList[i]):{};
        const body=(i===0&&text)||(media.attachment_type==='image'?'Rasm':'Fayl: '+(media.attachment_name||'Fayl'));
        const result=check(await DB.from('world_chat_messages').insert({
          author_id:S.u.id,body,...media,
          reply_to:i===0?(window.MWV11?.replyId?.('world','world')||null):null
        }).select('id,author_id,body,created_at,reply_to,edited_at,attachment_path,attachment_name,attachment_type').single());
        sent.push(result);
      }
      window.MWV11?.finishPending?.(pending);
      }catch(err){window.MWV11?.finishPending?.(pending,true);throw err;}
      f.reset();window.MWV11?.clearAttachment?.(f);window.MWV11?.clearReply?.();
      const msgs=$('#msgs');
      if(msgs&&S.chatId==='world')for(const result of sent){
        const html='<div class="world-message">'+
          (window.MWV11?.bubble?.(result,'world',sent)||chatBubble(result.body,true,chatTime(result.created_at)))+'</div>';
        if(window.MWV11?.appendDated)window.MWV11.appendDated(result,html);
        else msgs.insertAdjacentHTML('beforeend',html);
        window.MWV11?.afterRender?.([result],'world');
        msgs.scrollTop=msgs.scrollHeight;
      }
      S.mwWorldTime=Date.now();S.mwWorldPreview='Siz: '+sent[sent.length-1].body.slice(0,65);chatRows();
      worldUpdate({last_seen_at:new Date().toISOString()}).catch(console.warn);
      mwMaybeExpireImages().catch(console.warn);
    }
    else if(f.id==='badgeForm'){
      if(!requireUser())return;
      const result=await DB.from('verification_requests').insert({
        user_id:S.u.id,
        reason:new FormData(f).get('reason')
      });
      if(result.error?.code==='23505'){toast('Arizangiz allaqachon tekshiruvda');await settings();}
      else{check(result);toast('Ariza yuborildi');await settings();}
    }
    else if(f.id==='reportForm'){
      if(!requireUser())return;
      check(await DB.from('reports').insert({
        reporter_id:S.u.id,
        target_kind:f.dataset.kind,
        target_id:f.dataset.id,
        reason:new FormData(f).get('reason')
      }));
      close();
      toast('Yuborildi')
    }
    else if(f.id==='commentForm'){
      if(!requireUser())return;
      check(await DB.from('comments').insert({
        mod_id:f.dataset.id,
        author_id:S.u.id,
        body:new FormData(f).get('body')
      }));
      f.reset();
      await comments(f.dataset.id)
    }
  }catch(err){
    console.error(err);
    if(f.id==='modForm'){
      modUploadProgress(f,
        Number(f.querySelector('.mw-mod-upload-progress progress')?.value||0),
        'Yuborishda xatolik',err.message||'Internet yoki serverda muammo.');
    }
    toast(err.code==='23505'?(f.id==='authForm'?'Bu username band':'Bu ma’lumot avval saqlangan'):err.message)
  }finally{
    if(f.id==='modForm'&&f.isConnected){
      f.dataset.draftState='draft';
      if(mwDraftActive(f))mwDraftSave(f).catch(console.warn);
      const progress=f.querySelector('.mw-mod-upload-progress');
      if(button)button.textContent=progress?.querySelector('[data-upload-stage]')?.textContent==='Yuborishda xatolik'?
        'Qayta yuborish':(f.dataset.admin==='true'?'O‘zgarishlarni saqlash':'Yuborish');
    }
    if(button)button.disabled=false
  }
});

function createSnow(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const flakes=window.matchMedia('(max-width:560px)').matches?18:34;
  const fragment=document.createDocumentFragment();
  for(let i=0;i<flakes;i++){
    const flake=document.createElement('span');
    flake.className='winter-flake';
    flake.style.left=((i*41+12)%100)+'%';
    flake.style.setProperty('--size',(2+i%4)+'px');
    flake.style.setProperty('--opacity',String(.3+i%5*.12));
    flake.style.setProperty('--duration',(8+i%8*1.7)+'s');
    flake.style.setProperty('--delay',(-i*1.31)+'s');
    flake.style.setProperty('--drift',(i%2===0?28:-45)+'px');
    fragment.appendChild(flake);
  }
  $('#winterSnow').replaceChildren(fragment);
}

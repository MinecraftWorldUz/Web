// Presence: only mutually following accounts can read each other's last seen time (RLS).
async function mwPingPresence(){
  if(!S.u||document.visibilityState!=='visible')return;
  const {error}=await DB.from('mw_presence').upsert({user_id:S.u.id,last_seen_at:new Date().toISOString()});
  if(error)console.warn('Presence:',error.message);
}
async function mwFriendPresence(peer,thread){
  if(!S.u||!peer||peer===S.u.id)return;
  const {data,error}=await DB.from('mw_presence').select('last_seen_at').eq('user_id',peer).maybeSingle();
  if(error){console.warn('Presence fetch:',error.message);return}
  const title=document.querySelector('#conversation .mw11-head-name');
  if(!title||S.chatId!==thread)return;
  const small=title.querySelector('small');
  if(!small||!data?.last_seen_at)return;
  const at=new Date(data.last_seen_at),minutes=Math.floor((Date.now()-at.getTime())/60000);
  if(minutes<0||!Number.isFinite(minutes))return;
  const formatted=at.toLocaleString('uz-UZ',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  small.textContent=minutes<2?'Onlayn':'Oxirgi marta: '+formatted;
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')mwPingPresence().catch(console.warn)});
setInterval(()=>{mwPingPresence().catch(console.warn);if(S.page==='chat'&&S.chatId&&S.chatId!=='world'&&!S.chatId.startsWith('g:'))mwFriendPresence(S.chatId,S.chatId).catch(console.warn)},60000);


const mwPageStack=[],mwDialogStack=[];
let mwDialogTitle='',mwBackRestoring=false,mwExitAt=0,mwBackBusy=false,mwGuardReady=false;
function mwRememberDialog(title){
 const overlay=$('#overlay');
 if(!mwBackRestoring&&overlay?.classList.contains('open')&&mwDialogTitle!==title){
  const body=overlay.querySelector('.dialogbody');
  if(body){
   // Store live nodes, not HTML, preserving form values and existing listeners.
   const nodes=[...body.childNodes];
   mwDialogStack.push({title:mwDialogTitle,nodes,scroll:body.scrollTop,mod:activeModId});
   if(mwDialogStack.length>12)mwDialogStack.shift();
  }
 }
 mwDialogTitle=title;
}
async function mwBackDialog(){
 const prev=mwDialogStack.pop();
 if(!prev){close();return}
 mwBackRestoring=true;
 try{
  modalGeneration++;activeModId=prev.mod;
  dialog(prev.title,'');
  const body=$('#overlay .dialogbody');body.replaceChildren(...prev.nodes);body.scrollTop=prev.scroll;
  mountMarquees();
 }finally{mwBackRestoring=false}
}
let mwRouteSession=Date.now().toString(36),mwHistoryReady=false,mwLastRoute='',mwLastDepth=0;
let mwHomeExitAt=0,mwHomeGuardArmed=false;
function mwRouteKey(){
 const open=$('#overlay')?.classList.contains('open');
 return [S.page,S.profileId||'',S.page==='chat'&&S.mw11MobileOpen?S.chatId||'thread':'',open?mwDialogTitle:'',open?mwDialogStack.length:0].join('|');
}
function mwRouteDepth(){
 return (S.page==='home'?0:Math.max(1,mwPageStack.length))+($('#overlay').classList.contains('open')?1+mwDialogStack.length:0)+(S.page==='chat'&&S.mw11MobileOpen?1:0);
}
function mwSyncRoute(){
 if(!mwHistoryReady||mwBackRestoring||mwBackBusy)return;
 const key=mwRouteKey(),depth=mwRouteDepth();
 if(key===mwLastRoute)return;
 const previousDepth=mwLastDepth;
 mwLastRoute=key;mwLastDepth=depth;mwHomeExitAt=0;
 try{
  const index=history.state?.mwRouteSession===mwRouteSession?Number(history.state.index)||0:0;
  if(depth>previousDepth){
   history.pushState({mwRouteSession,index:index+1,depth,key},'');
  }else{
   history.replaceState({mwRouteSession,index,depth,key},'');
  }
 }catch(err){console.warn(err)}
}
async function mwRequestDialogBack(){
 if(mwBackBusy||!$('#overlay').classList.contains('open'))return;
 // Use the same existing browser entry for X and Android Back.
 if(mwHistoryReady&&history.state?.mwRouteSession===mwRouteSession&&history.state.index>0){
  history.back();return;
 }
 await mwBackDialog();mwSyncRoute();
}
function mwInstallBackGuard(){
 if(mwGuardReady)return;mwGuardReady=true;
 mwHistoryReady=true;mwLastRoute=mwRouteKey();mwLastDepth=mwRouteDepth();
 history.replaceState({mwRouteSession,index:0,depth:mwLastDepth,key:mwLastRoute},'');
 // A single extra root entry, created during a genuine user gesture.
 const armHome=ev=>{if(!ev.isTrusted||mwHomeGuardArmed||mwRouteDepth()!==0||mwBackBusy)return;mwHomeGuardArmed=true;history.pushState({mwRouteSession,index:1,depth:0,key:mwRouteKey(),homeGuard:true},'');};
 window.addEventListener('click',armHome,true);
 window.addEventListener('keydown',armHome,true);
 new MutationObserver(()=>mwSyncRoute()).observe($('#app'),{attributes:true,attributeFilter:['class'],childList:true});
 window.addEventListener('popstate',async event=>{
  if(mwBackBusy)return;
  if(mwRouteDepth()===0){
   if(event.state?.mwRouteSession!==mwRouteSession)return;
   if(mwHomeExitAt&&Date.now()-mwHomeExitAt<2000){mwHomeExitAt=0;mwHomeGuardArmed=false;history.go(-(Number(event.state.index||0)+1));return;}
   mwHomeExitAt=Date.now();toast('Chiqish uchun yana bir marta orqaga bosing');
   history.pushState({mwRouteSession,index:Number(event.state.index||0)+1,depth:0,key:mwRouteKey(),homeGuard:true},'');
   return;
  }
  mwHomeExitAt=0;mwBackBusy=true;mwBackRestoring=true;
  try{
   if($('#overlay').classList.contains('open'))await mwBackDialog();
   else if(S.page==='chat'&&S.mw11MobileOpen){window.MWV11?.backMobileThread?.();}
   else{
    const prev=mwPageStack.pop();
    if(prev){S.chatId=prev.chatId;await go(prev.page,prev.id);}
    else await go('home');
   }
  }catch(err){console.warn(err)}
  finally{
   mwBackRestoring=false;mwBackBusy=false;
   mwLastRoute=mwRouteKey();mwLastDepth=mwRouteDepth();
   // Never push or recreate a history entry after Back. Chromium can
   // otherwise mark the whole document skippable on the next Back gesture.
  }
 });
}


/* Select exactly one actionable element per pointer gesture. */
(()=>{
 let pressed=null,parent=null;
 function clearPress(){
  pressed?.classList.remove('mw-tap-down');parent?.classList.remove('mw-child-press');pressed=null;parent=null;
 }
 document.addEventListener('pointerdown',ev=>{
  clearPress();if(ev.button!==0||!ev.isPrimary)return;
  const el=ev.target.closest?.('button,a[href],[role="button"],[data-act],[data-go],[data-mw],[data-v11]');
  if(!el||el.disabled||el.getAttribute('aria-disabled')==='true')return;
  const card=el.closest('.clickable-mod');
  // Cover and title are entrances to the same mod; other controls are independent.
  pressed=card&&el.dataset.act==='mod'?card:el;
  if(card&&pressed!==card){parent=card;parent.classList.add('mw-child-press')}
  pressed.classList.add('mw-press-target','mw-tap-down');
 },true);
 for(const name of ['pointerup','pointercancel','lostpointercapture','dragstart'])document.addEventListener(name,clearPress,true);
 window.addEventListener('blur',clearPress);
 document.addEventListener('scroll',clearPress,true);
})();

(async()=>{
  hydrateIcons();
  createSnow();
  document.documentElement.lang=S.lang;
  document.querySelectorAll('[data-tr]').forEach(
    x=>x.textContent=t(x.dataset.tr)
  );
  uiObserver.observe($('#app'),{childList:true,subtree:true,characterData:true});
  uiObserver.observe($('#overlay'),{childList:true,subtree:true,characterData:true});
  mwInstallBackGuard();
  await Promise.allSettled([go('home'),refreshUser()]);
  mwInitialNavigation=false;
  offerPush();
  mwPageStack.length=0;
  mwPingPresence().catch(console.warn);
  scheduleFastPrefetch();
  const deepId=new URLSearchParams(location.search).get('mod');
  if(deepId&&/^[0-9a-f-]{36}$/i.test(deepId)){
    openMod(deepId).catch(err=>console.warn('Mod havolasi:',err));
  }
  const noticeLink=new URLSearchParams(location.search);
  if(S.u&&noticeLink.get('recipient')===S.u.id){
    const kind=noticeLink.get('notice'),actor=noticeLink.get('actor');
    if(kind==='review'&&S.me?.is_admin)await admin();
    if(kind==='follow'&&actor)await go('profile',actor);
    if(['like','comment'].includes(kind))await socialActivity();
    if(['badge','group_badge','mod'].includes(kind))await notifications();
    if(kind==='message'&&actor){S.chatId=actor;S.mw11MobileOpen=true;await go('chat')}
    if(kind==='world_message'){S.chatId='g:'+MW_WORLD_GROUP;S.mw11MobileOpen=true;await go('chat')}
    if(kind==='group_message'&&noticeLink.get('target')){S.chatId='g:'+noticeLink.get('target');S.mw11MobileOpen=true;await go('chat')}
    if(['like','comment','follow'].includes(kind))await socialActivity();
    if(['badge','group_badge','mod'].includes(kind))await notifications();
  }
  // Supabase may emit SIGNED_IN again when the browser tab regains focus.
  // Update account data without forcing the user back to the home screen.
  DB.auth.onAuthStateChange((event,session)=>{
    if((event==='TOKEN_REFRESHED'||event==='SIGNED_IN')&&session){
      try{rememberAccount(session)}catch(error){console.warn('Account autosave:',error)}
    }
    if(event==='SIGNED_IN' && session?.user?.id!==S.u?.id){
      setTimeout(()=>refreshUser().catch(console.error),0);
    }else if(event==='SIGNED_OUT' && S.u){
      setTimeout(async()=>{
        try{
          await refreshUser();
          if(S.page!=='home')await go('home');
        }catch(err){console.error(err)}
      },0);
    }
  })
})().catch(err=>{
  $('#app').innerHTML='<div class="empty">'+e(err.message)+'</div>';
  console.error(err)
});
